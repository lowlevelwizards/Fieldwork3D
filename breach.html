<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#171f22"/>
<title>FIELDWORK — Breach 01</title>
<link rel="stylesheet" href="./src/breach-style.css"/>
</head>
<body>
<canvas id="breachCanvas" aria-label="Top-down tactical encounter. Choose an operator, plan waypoints and execute." role="img"></canvas>
<header class="top">
  <div class="ident"><span>FIELDWORK <i>/</i> TACTICAL STUDY</span>
    <strong>CUTWOODS / STATION</strong><small>01 — TWO ROOMS, TWO OPERATORS</small></div>
  <div class="mode"><strong id="phase">PLANNING</strong><output id="clock">00:00</output></div>
</header>
<div class="guidance" id="hint" role="status" aria-live="polite">Tap to move · Select an order for LOOK, PIE, or STRAFE</div>
<section class="orders compact" id="advancedOrders" aria-label="Additional tactical options">
  <button id="undo" type="button" title="Undo the last planning edit">UNDO</button>
  <button id="redo" type="button" title="Redo the last planning edit">REDO</button>
  <button id="wait" type="button">WAIT</button>
  <button id="sync" type="button" title="Synchronize both operators">SYNC</button>
  <button id="stance" type="button">CROUCH</button>
  <button id="contact" type="button" aria-pressed="false">STOP ON CONTACT</button>
  <button id="variant" type="button">SITE 1/3</button>
  <button id="clear" type="button" title="Clear all remaining orders for selected operator">CLEAR PLAN</button>
  <button id="restart" type="button">RESTART</button>
  <button id="viewIso" type="button" aria-pressed="true">ISO</button>
  <button id="viewTop" type="button" aria-pressed="false">TOP</button>
  <button id="view2d" type="button" aria-pressed="false">2D</button>
  <button id="cameraFit" type="button">FIT VIEW</button>
</section>
<div id="contextTools" class="context-tools" role="toolbar" aria-label="Contextual tactical actions" hidden></div>
<div class="feed" id="feed" aria-live="polite">PLAN THE ENTRY</div>
<nav class="bar" aria-label="Tactical controls">
  <div class="units">
    <button id="rook" class="unit selected" type="button" aria-pressed="true">
      <span class="unit-code">01</span><strong>ROOK</strong><small id="rookHp">●●</small>
    </button>
    <button id="moss" class="unit" type="button" aria-pressed="false">
      <span class="unit-code">02</span><strong>MOSS</strong><small id="mossHp">●●</small>
    </button>
  </div>
  <div class="actions">
    <button id="back" type="button" title="Remove just the final pending order">BACK −1</button>
    <button id="moreOrders" type="button" aria-pressed="false" title="Additional commands and views">TOOLS</button>
    <button id="play" type="button" class="play">GO <span>▶</span></button>
  </div>
</nav>
<section id="debrief" class="debrief" hidden aria-label="Mission debrief">
  <strong id="debriefTitle">MISSION COMPLETE</strong>
  <p id="debriefStats"></p>
  <button id="retry" type="button">RETRY MISSION</button>
  <button id="next" type="button">NEXT ARRANGEMENT</button>
</section>
<div class="foot"><span id="mission">CONTACTS UNKNOWN • SECURE THE STATION</span><span class="shortcut">TAP TO ORDER · DRAG TO ORBIT · 2 FINGERS PAN/PINCH</span></div>
<script type="module" src="./src/breach-main.ts"></script>
</body>
</html>
