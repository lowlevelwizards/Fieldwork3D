<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#171f22"/>
<title>FIELDWORK — Breach 01</title>
<link rel="stylesheet" href="./src/breach-style.css"/>
</head>
<body>
<canvas id="breachCanvas" aria-label="Top-down tactical encounter. Choose an operator, plan waypoints and execute." role="img"></canvas>
<header class="top">
  <div class="ident"><span>FIELDWORK <i>/</i> TACTICAL STUDY</span>
    <strong>CUTWOODS / STATION</strong><small>01 — TWO ROOMS, TWO OPERATORS</small></div>
  <div class="mode"><strong id="phase">PLANNING</strong><output id="clock">00:00</output></div>
</header>
<div class="guidance" id="hint" role="status" aria-live="polite">Choose Rook or Moss. Tap ground to add a route, or drag from an operator to draw one.</div>
<section class="orders" aria-label="Planning tools">
  <button id="back" type="button" title="Remove just the final queued order, preserving the rest of this route">↤ BACK −1</button>
  <button id="undo" type="button" title="Undo the previous edit or drawn stroke">↶ UNDO</button>
  <button id="redo" type="button" title="Redo previously undone order">↷ REDO</button>
  <button id="insert" type="button" aria-pressed="false" title="Tap between route nodes to insert">+ NODE</button>
  <button id="delete" type="button" title="Delete selected route node">− NODE</button>
  <button id="strafe" type="button" aria-pressed="false" title="Choose a move node to toggle strafe, or arm the next movement; LOOK sets weapon facing">STRAFE</button>
  <button id="pieLeft" type="button" aria-pressed="false" title="Sweep counter-clockwise around a doorway (position first)">PIE ↶</button>
  <button id="pieRight" type="button" aria-pressed="false" title="Sweep clockwise around a doorway (position first)">PIE ↷</button>
  <button id="door" type="button" aria-pressed="false" title="Tap a door to add an entry order">DOOR</button>
  <button id="method" type="button" title="Cycle door action">OPEN</button>
  <button id="wait" type="button" title="Wait at the end of the plan">WAIT</button>
  <button id="sync" type="button" title="Both soldiers wait for the same go code">SYNC</button>
  <button id="stance" type="button" title="Toggle this soldier's movement stance">CROUCH</button>
  <button id="contact" type="button" aria-pressed="false" title="Halt when a threat is seen">STOP ON CONTACT</button>
  <button id="variant" type="button" title="Try another authored opponent arrangement">SITE 1/3</button>
</section>
<div class="feed" id="feed" aria-live="polite">PLAN THE ENTRY</div>
<nav class="bar" aria-label="Tactical controls">
  <div class="units">
    <button id="rook" class="unit selected" type="button" aria-pressed="true">
      <span class="unit-code">01</span><strong>ROOK</strong><small id="rookHp">●●</small>
    </button>
    <button id="moss" class="unit" type="button" aria-pressed="false">
      <span class="unit-code">02</span><strong>MOSS</strong><small id="mossHp">●●</small>
    </button>
  </div>
  <div class="actions">
    <button id="aim" type="button" title="Choose a point to face">LOOK</button>
    <button id="clear" type="button" title="Erase this soldier's entire remaining plan">ALL CLEAR</button>
    <button id="play" type="button" class="play">GO <span>▶</span></button>
    <button id="restart" type="button" title="Restart this encounter">↺</button>
  </div>
</nav>
<section id="debrief" class="debrief" hidden aria-label="Mission debrief">
  <strong id="debriefTitle">MISSION COMPLETE</strong>
  <p id="debriefStats"></p>
  <button id="retry" type="button">RETRY MISSION</button>
  <button id="next" type="button">NEXT ARRANGEMENT</button>
</section>
<div class="foot"><span id="mission">CONTACTS UNKNOWN • SECURE THE STATION</span><span class="shortcut">SPACE PAUSE · TAP TO PLAN</span></div>
<script type="module" src="./src/breach-main.ts"></script>
</body>
</html>
