<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fieldwork / Street Lab</title>
<style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;background:#242824;color:#dddcd3}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid #4c5047}h1{font-size:16px;letter-spacing:.09em;margin:0}a{color:#bbbca8}#controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px;padding:10px;background:#2e322d}label{display:grid;gap:4px;min-width:0;color:#b6b9ad;font-size:10px;text-transform:uppercase}select,input,button{min-width:0;width:100%;font:16px system-ui;padding:5px;background:#343934;color:#e2e1d8;border:1px solid #55594f}#viewport{flex:1;min-height:0;position:relative;overflow:hidden}#viewport canvas{display:block;width:100%;height:100%}#diagnostics,#note{padding:8px 12px;overflow-wrap:anywhere}#note{color:#a1a598;font-size:11px;padding-bottom:calc(6px + env(safe-area-inset-bottom))} @media(max-width:600px){#controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>STREET LAB</h1><a href="./index.html">RETURN</a></header>
<section id="controls"><label>Seed<input id="seed" type="number" value="4" min="1" max="999999"></label><label>Scale<select id="scale"><option>small</option><option>standard</option><option selected>large</option></select></label>
<label>Street<select id="kind"><option value="auto">Contextual</option><option>residential</option><option>commercial</option><option>suburban</option><option>industrial</option><option>rural</option></select></label>
<label>Layout<select id="layout"><option value="proposal">ST proposal</option><option value="pilot">Validated ST pilot</option><option value="legacy">Current production</option></select></label>
<label>View<select id="view"><option value="iso">Gameplay</option><option value="top">Overhead</option></select></label><label>Generate<button id="generate">Apply seed</button></label></section>
<div id="viewport"></div><output id="diagnostics" role="status"></output><div id="note">ST foundation · actual tactical renderer, operator and vehicle scale. Proposal mode reports legacy fixture conflicts; validated pilot uses safe retrofit or falls back to VEH12. No live generation changes.</div>
<script type="module" src="./src/street-lab-main.ts"></script></body></html>
