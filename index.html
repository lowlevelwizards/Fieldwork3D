<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1b302e" />
  <meta name="description" content="Fieldwork 3D — a living miniature world." />
  <title>Fieldwork 3D · Cedar Relay</title>
</head>
<body>
  <div id="app">
    <div id="viewport" aria-label="Interactive isometric Three.js field scene"></div>

    <!-- Quiet scene metadata: no persistent debug/status panels or button tray. -->
    <header class="scene-hud" aria-label="Scene information">
      <span class="place-name">CEDAR RELAY</span>
      <div class="scene-conditions" aria-label="Scene time and simulated weather">
        <span class="clock-label"><time datetime="07:14">07:14</time></span>
        <span class="separator" aria-hidden="true">·</span>
        <span class="weather-label">OVERCAST</span>
      </div>
    </header>

    <button type="button" id="notebookToggle" aria-controls="notebookPanel"
      aria-expanded="false" title="Open field notebook" aria-label="Field notebook">▤</button>
    <aside id="notebookPanel" class="notebook-panel" aria-label="Field notebook" hidden>
      <div class="notebook-header"><strong>FIELD NOTES</strong><button id="closeNotebook" type="button" aria-label="Close notebook">×</button></div>
      <div class="notebook-heading">OBSERVATIONS</div>
      <div id="notebookEvidence" class="notebook-evidence"></div>
      <div class="notebook-heading">CURRENT LEAD</div>
      <p id="notebookLead"></p>
      <div class="notebook-heading">CREW</div>
      <p id="notebookCrew"></p>
      <div id="notebookEvents" class="notebook-events"></div>
    </aside>
    <div id="meterHud" class="meter-hud" hidden>
      <span id="meterStation">Equipment</span><strong><span id="meterNumber">0.0</span> V AC</strong>
    </div>
    <div id="crewCue" class="crew-cue" hidden></div>
    <button type="button" id="tacticalToggle" aria-label="Toggle tactical mode"
      aria-pressed="false" title="Tactical controls">⌖</button>
    <div id="tacticalPanel" class="tactical-panel" hidden aria-label="Tactical controls">
      <div id="tacticalStatus" class="tactical-status">ROOK 100 · 09/36</div>
      <div class="tactical-actions">
        <button type="button" id="tacticalFire" class="tactical-fire" aria-label="Hold to fire">FIRE</button>
        <button type="button" id="tacticalReload" aria-label="Reload weapon">↻</button>
        <button type="button" id="tacticalTarget" aria-label="Cycle enemy target">◎</button>
      </div>
      <button type="button" id="tacticalOrder" class="tactical-order">MICA · FOLLOW</button>
      <button type="button" id="tacticalAssist" class="tactical-order" hidden>AID MICA</button>
      <button type="button" id="tacticalReset" class="tactical-order" hidden>REGROUP · RETRY</button>
    </div>
    <button type="button" id="contextAction" class="context-action" hidden
      aria-label="Work on the relay cabinet">INSPECT</button>
    <button type="button" id="deferAction" class="context-action defer-action" hidden
      aria-label="Leave the unresolved repair for later">LEAVE FOR LATER</button>
    <div id="message" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
