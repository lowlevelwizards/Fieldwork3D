<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#c5d2c9" />
  <title>Fieldwork — Ground Zero · Rain</title>
</head>
<body>
  <canvas id="app" aria-label="Single isometric ground block with changing daylight and mist; drag to orbit and pinch to zoom"></canvas>
  <section class="time-inspector" aria-label="Time of day">
    <div class="time-inspector__row">
      <button type="button" id="timeToggle" aria-label="Pause time" aria-pressed="false">Ⅱ</button>
      <output id="timeLabel" for="timeScrub">05:15</output>
      <span class="time-inspector__phase" id="phaseLabel">PRE-DAWN</span>
    </div>
    <input type="range" id="timeScrub" aria-label="Set time of day" min="0" max="1440" step="1" value="315" />
    <div class="cloud-inspector">
      <label id="cloudCoverLabel" for="cloudCover">CLOUDS 70%</label>
      <input type="range" id="cloudCover" aria-label="Cloud coverage percentage" min="0" max="100" step="1" value="70" />
      <button type="button" id="cloudAuto" aria-label="Restore automatic cloud coverage" aria-pressed="true">AUTO</button>
    </div>
    <div class="rain-status">
      <span>PRECIPITATION</span>
      <span id="rainLabel" role="status" aria-live="off">RAIN 0% · DRY</span>
    </div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
