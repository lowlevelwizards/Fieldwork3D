<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fieldwork / Vehicle Lab</title><style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;background:#242824;color:#dddcd3}
*{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #4c5047}
h1{font-size:16px;letter-spacing:.09em;margin:0}a{color:#bbbca8}#controls{display:flex;gap:8px;align-items:end;flex-wrap:wrap;padding:10px 16px;background:#2e322d}
label{display:grid;gap:4px;color:#b6b9ad;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
select{font:inherit;padding:7px;background:#343934;color:#e2e1d8;border:1px solid #55594f;min-width:100px}
#viewport{flex:1;min-height:0;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}
#diagnostics{padding:10px 16px;border-top:1px solid #4c5047;font-variant-numeric:tabular-nums;min-height:38px}
#note{padding:6px 16px;color:#a1a598;font-size:11px} @media(max-width:600px){#controls{padding:8px;gap:5px}select{min-width:80px;padding:5px}}
</style></head><body>
<header><h1>VEHICLE LAB</h1><a href="./index.html">RETURN</a></header>
<section id="controls" aria-label="Vehicle controls">
<label>Family<select id="family"></select></label>
<label>Configuration<select id="configuration"></select></label>
<label>Paint<select id="paint"></select></label>
<label>Condition<select id="condition"><option value="clean">Maintained</option><option value="used">Used</option><option value="neglected">Weathered</option></select></label>
<label>View<select id="view"><option value="iso">Gameplay angle</option><option value="side">Side</option><option value="front">Front</option><option value="rear">Rear</option><option value="top">Top</option></select></label>
<label>Scene<select id="count"><option value="1">1 vehicle</option><option value="6">Family lineup</option><option value="5">5 vehicles</option><option value="10">10 vehicles</option><option value="20">20 vehicles</option><option value="50">50 vehicles</option></select></label>
<label>Rendering<select id="batch"><option value="individual">Cached meshes</option><option value="instanced">Instance batch</option></select></label>
<label>Footprint<select id="footprint"><option value="off">Off</option><option value="on">On</option></select></label>
</section>
<div id="viewport"><canvas id="canvas" aria-label="Vehicle geometry preview"></canvas></div>
<output id="diagnostics" role="status"></output><div id="note">Shared gameplay model and material; isolated lighting for silhouette review. Geometry is static; rendering occurs on control changes.</div>
<script type="module" src="./src/vehicle-lab-main.ts"></script></body></html>
