name: BP backpack foundation critical
on:
  push:
    branches: [art/backpacks-bp0-bp15]
  workflow_dispatch:
concurrency:
  group: bp-critical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/backpack-bp*.test.mjs tests/operator-wardrobe-unified.test.mjs tests/operator-wardrobe-gear-visuals.test.mjs tests/equipment-carry-gear-change.test.mjs tests/equipment-07-encumbrance.test.mjs tests/operator-visual-fit.test.mjs tests/sling-retention-sr21-pack-motion.test.mjs
