name: BP backpack foundation critical
on:
  push:
    branches: [art/backpacks-bp0-bp15]
  pull_request:
    branches: [main, art/backpacks-bp5-baseline, art/backpacks-canonical-auto]
    paths:
      - 'src/operator-backpack-*.ts'
      - 'src/equipment-backpack-change.ts'
      - 'src/equipment-carry-gear-change.ts'
      - 'tests/backpack-bp*.test.mjs'
      - 'scripts/*backpack*.mjs'
      - '.github/workflows/backpack-critical.yml'
  workflow_dispatch:
concurrency:
  group: bp-critical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: git fetch --depth=1 origin efd1b6e9828f4f2d4964362c4a0d1bf7b3707849
      - run: node --experimental-strip-types scripts/audit-backpack-geometry.mjs
      - run: node --experimental-strip-types --test tests/backpack-bp*.test.mjs tests/operator-wardrobe-unified.test.mjs tests/operator-wardrobe-gear-visuals.test.mjs tests/equipment-carry-gear-change.test.mjs tests/equipment-carry-gear-authority.test.mjs tests/equipment-07-encumbrance.test.mjs tests/operator-visual-fit.test.mjs tests/sling-retention-sr21-pack-motion.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node scripts/smoke-backpack-art.mjs
        env:
          FIELDWORK_CI_CHROME: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backpack-art-captures
          path: backpack-art-captures/
          if-no-files-found: ignore
