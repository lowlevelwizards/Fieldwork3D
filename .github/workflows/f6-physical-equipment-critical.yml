name: F6 Physical Equipment critical
on:
  push:
    branches:
      - feature/f6-physical-interactions-stages-0-2-20261119
      - feature/f6-physical-interactions-stages-3-4-20261119
      - feature/f6-physical-interactions-stage-3-wedge-20261119
      - feature/f6-physical-interactions-release-f-20261119
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: f6-physical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physical-equipment-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Typecheck
        run: npm run check
      - name: Focused physical equipment and pose regressions
        run: >-
          node --experimental-strip-types --test
          tests/f6-equipment-interaction-pose.test.mjs
          tests/f6-flash-handoff.test.mjs
          tests/f6-wedge-handoff.test.mjs
          tests/f6-cuff-handoff.test.mjs
          tests/eqa3-9-civilian-animation.test.mjs
          tests/equipment-deployed-field-use.test.mjs
          tests/equipment-field-visual-rig.test.mjs
          tests/animation-a1-choreography.test.mjs
          tests/breach-roadmap3-order-utility.test.mjs
          tests/eqa3-10-restrain.test.mjs
          tests/equipment-mission-field-reconciliation.test.mjs
