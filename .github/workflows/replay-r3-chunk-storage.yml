name: Replay R3 G3 — Durable Chunk Storage Browser
on:
  pull_request:
    paths:
      - 'src/breach-replay-chunk-store.ts'
      - 'src/breach-replay-chunks.ts'
      - 'src/breach-replay-chunk-transport.ts'
      - 'src/breach-replay-chunk-scene.ts'
      - 'src/breach-replay-chunk-controller.ts'
      - 'tests/replay-r3-chunk-controller.test.mjs'
      - 'src/breach-replay-frame-sampling.ts'
      - 'src/breach-replay.ts'
      - 'tests/replay-r3-chunk-scene.test.mjs'
      - 'tests/replay-r3-frame-sampling.test.mjs'
      - 'tests/replay-r3-chunk-transport.test.mjs'
      - 'tests/replay-r3-chunk-store.test.mjs'
      - 'tests/replay-r3-chunks.test.mjs'
      - 'scripts/smoke-replay-r3-chunk-store.mjs'
      - '.github/workflows/replay-r3-chunk-storage.yml'
permissions:
  contents: read
concurrency:
  group: replay-r3-chunks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-browser-persistence:
    if: ${{ startsWith(github.head_ref, 'feature/replay-r3-long-recording-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Persistent chunk writes, interrupted recovery, race and corruption
        run: node scripts/smoke-replay-r3-chunk-store.mjs
