name: EQA3.1 forensic review of frozen 8-case run
on:
  push:
    branches: [audit/eqa3-complete-mission-decision-baseline-20261118]
    paths:
      - '.github/workflows/eqa3-forensic-collate.yml'
      - 'scripts/audit-eqa3-forensic-collate.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download original exact sight / motor / civilian traces
        uses: actions/download-artifact@v4
        with:
          run-id: 44421635232
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: eqa3-forensic-*
          merge-multiple: true
          path: artifacts/eqa3/
      - name: Produce concise static review of actual source snapshots
        run: |
          node scripts/audit-eqa3-forensic-collate.mjs > artifacts/eqa3/forensic-console.txt
          node - <<'NODE'
          const j=require('./artifacts/eqa3/forensic-review.json');
          console.log('CASE_COUNT',j.summary);
          for(const r of j.rows){
            const q={seed:r.seed,mission:r.mission,intel:r.intel,entry:r.entry,
              stage:r.stage,contact:r.firstContactAt,initialSight:r.initialActiveEnemySight,
              firstSight:r.firstSight&&{t:r.firstSight.t,who:r.firstSight.firstThreat},
              firstEnemySight:r.firstEnemySight&&{t:r.firstEnemySight.t,who:r.firstEnemySight.firstThreat},
              aborts:r.aborts,firstAbort:r.firstAbort,
              rejected:r.rejected,reason:r.rejectedKinds,
              transitions:r.personTransitions.map(x=>({t:x.t,kind:x.kind,stage:x.stage,
               person:x.person,escort:x.escort,p:x.p,order:x.order})).slice(0,9),
              late:r.timed.filter(x=>x.time===40||x.time===80).map(x=>({
               t:x.t,p:x.p,stage:x.stage,person:x.person,escort:x.escort,
               blocker:x.blocker,order:x.order})),
              ending:r.ending&&{t:r.ending.t,p:r.ending.p,
               stage:r.ending.stage,person:r.ending.person,escort:r.ending.escort,
               order:r.ending.order,blocker:r.ending.blocker}};
            console.log('CASE',JSON.stringify(q));
          }
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqa3-forensic-consolidated
          path: |
            artifacts/eqa3/forensic-review.json
            artifacts/eqa3/forensic-console.txt
