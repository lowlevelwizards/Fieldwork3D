name: Glock family art gate
on:
  pull_request:
    paths:
      - 'src/weapons/geometry/glock-family-silhouettes.ts'
      - 'src/arsenal/glock-gallery.ts'
      - 'src/arsenal/gallery-main.ts'
      - 'src/arsenal/preview-job-queue.ts'
      - 'src/arsenal/gallery-browser-controls.ts'
      - 'src/arsenal/gallery-chrome.ts'
      - 'tests/consolidation-p11-arsenal-chrome.test.mjs'
      - 'tests/consolidation-p10-arsenal-controls.test.mjs'
      - 'tests/consolidation-p9-arsenal-preview.test.mjs'
      - 'tests/performance-p3-preview-hotpaths.test.mjs'
      - 'scripts/smoke-consolidation-p9-arsenal.mjs'
      - 'src/arsenal/arsenal.css'
      - 'tests/weapon-glock-family-art.test.mjs'
      - 'tests/secondary-s1-s3-foundation.test.mjs'
      - 'src/secondary-equipment.ts'
      - 'src/equipment-loadouts.ts'
      - '.github/workflows/glock-family-art.yml'
  workflow_dispatch:
jobs:
  focused-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Glock anatomy and gallery checks
        run: >-
          node --experimental-strip-types --test
          tests/weapon-glock-family-art.test.mjs
          tests/secondary-s1-s3-foundation.test.mjs
          tests/secondary-arsenal-parity.test.mjs
          tests/consolidation-p9-arsenal-preview.test.mjs
          tests/consolidation-p10-arsenal-controls.test.mjs
          tests/consolidation-p11-arsenal-chrome.test.mjs
          tests/performance-p3-preview-hotpaths.test.mjs
      - name: TypeScript and production build
        run: npm run check && npm run build
      - name: Install critical browser smoke
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Live Arsenal phone and desktop lazy-thumbnails
        run: node scripts/smoke-consolidation-p9-arsenal.mjs
