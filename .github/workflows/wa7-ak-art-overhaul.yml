name: WA7 AK artwork overhaul
on:
  push:
    branches: [feature/wa0-wa2-weapon-art-foundation]
    paths:
      - 'src/weapons/geometry/ak-silhouettes.ts'
      - 'src/weapons/geometry/weapon-visual-palette.ts'
      - 'scripts/verify-wa7-art-delta.mjs'
      - '.github/workflows/wa7-ak-art-overhaul.yml'
  workflow_dispatch:
concurrency:
  group: wa7-ak-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/weapon-ak-r46-silhouettes.test.mjs tests/weapon-ak-r47-final-polish.test.mjs tests/arsenal-a2-material-unification.test.mjs tests/wa0-weapon-art-geometry.test.mjs
      - name: Verify color-only scoped delta against WA6
        run: |
          mkdir -p reports/wa7
          git worktree add --detach /tmp/wa6-art fdd46c21be8b4f798469a5008e7223fd1c470104
          ln -s "$PWD/node_modules" /tmp/wa6-art/node_modules
          cp scripts/audit-wa4-art-delta.mjs scripts/capture-weapon-art-baseline.mjs scripts/capture-wa0-operator-context.mjs /tmp/wa6-art/scripts/
          node --experimental-strip-types scripts/audit-wa4-art-delta.mjs reports/wa7/candidate.json
          (cd /tmp/wa6-art && node --experimental-strip-types scripts/audit-wa4-art-delta.mjs "$GITHUB_WORKSPACE/reports/wa7/baseline.json")
          node scripts/verify-wa7-art-delta.mjs reports/wa7/baseline.json reports/wa7/candidate.json reports/wa7/delta.json
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render pinned before and actual candidate
        env:
          WA0_PLATFORMS: ak,custom-ak,accessory-samples
          WA0_OPERATOR_IDS: ak-akm,ak-akms,ak-ak74,ak-aks74,ak-ak74m,ak-rpk74,ak-ak103,ak-aks74u,ak-ak105
        run: |
          WA0_OUTPUT="$PWD/reports/wa7/after" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs
          WA0_OPERATOR_OUTPUT="$PWD/reports/wa7/after/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs
          (cd /tmp/wa6-art && WA0_OUTPUT="$GITHUB_WORKSPACE/reports/wa7/before" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs)
          (cd /tmp/wa6-art && WA0_OPERATOR_OUTPUT="$GITHUB_WORKSPACE/reports/wa7/before/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs)
          node scripts/verify-wa4-capture-pairs.mjs reports/wa7/before reports/wa7/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa7-ak-evidence
          path: reports/wa7/
          if-no-files-found: ignore
