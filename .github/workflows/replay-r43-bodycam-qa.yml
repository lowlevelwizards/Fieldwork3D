name: Replay R4.3 — Bodycam iPhone Visual QA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-r43-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  bodycam-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install chromium
      - name: Audition Bodycam chest, helmet, rewind and landscape in WebGL
        run: node scripts/smoke-replay-r43-bodycam.mjs
      - name: Retain first-person comparison frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-r43-bodycam-screenshots
          path: artifacts/replay-r43-bodycam/
          if-no-files-found: ignore
          retention-days: 7
