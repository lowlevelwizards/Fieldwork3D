name: Replay R4.4 — Squad Entry Critical
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/breach-main.ts'
      - 'src/breach-style.css'
      - 'src/breach-replay-squad-entry.ts'
      - 'tests/replay-r44-squad-entry.test.mjs'
      - '.github/workflows/replay-r44-squad-entry.yml'
permissions:
  contents: read
concurrency:
  group: replay-r44-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  entry-analysis:
    if: ${{ startsWith(github.head_ref, 'feature/replay-r44-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Deterministic four-operator doorway crossing
        run: node --experimental-strip-types --test tests/replay-r44-squad-entry.test.mjs
      - name: Production TypeScript / bundle gate
        run: npm run build
