name: D3.11E bounded corner lookahead and 45-second parity
on:
  pull_request:
    branches: [feature/d3-9-clean-single-opener-20261114]
    paths:
      - 'src/breach-motor-cornering.ts'
      - 'src/breach-actor-motor.ts'
      - 'tests/release4-cornering.test.mjs'
      - 'tests/release-d3-11e-corner-lookahead.test.mjs'
      - '.github/workflows/d3-11e-corner-lookahead.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-11e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  corner-lookahead:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Focused corner, door and authored route safety
        run: |
          node --experimental-strip-types --test tests/release4-cornering.test.mjs tests/release-d3-11e-corner-lookahead.test.mjs tests/release-d3-11d-portal-handoff.test.mjs tests/release-d3-10b-authored-obstruction.test.mjs tests/release-d3-9-single-opener.test.mjs
      - name: TypeScript and production bundle
        run: npm run build
      - name: Paired 45-second 11-site physical arrivals and route quality
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress --route-quality > "$RUNNER_TEMP/current.json"
          git worktree add --detach "$RUNNER_TEMP/baseline" fb2ffbd14737fd0fc8bf9197b983a75f9f842874
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/baseline/node_modules"
          node --experimental-strip-types "$RUNNER_TEMP/baseline/scripts/audit-r7-squad-execution.mjs" 11 2700 --progress --route-quality > "$RUNNER_TEMP/baseline.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const before=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const after=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const k=["acceptedFour","physicalArrivals","physicalCompletedFour",
              "completedFour","stallEpisodes","retries","reversalsNearDoor",
              "invalidPositions","physicsStepViolations","corruptedPlans"];
            const pick=(x,keys)=>Object.fromEntries(keys.map(key=>[key,x[key]]));
            console.log("D311E_PAIRED",JSON.stringify({
              baseline:pick(before.summary,k),current:pick(after.summary,k),
              beforeProgress:before.progressSummary,afterProgress:after.progressSummary,
              beforeRoutes:before.routeQualitySummary,
              afterRoutes:after.routeQualitySummary},null,2));
            for(const key of ["acceptedFour","physicalArrivals",
              "physicalCompletedFour","completedFour"])
              if(after.summary[key]<before.summary[key])throw Error("arrival regression "+key);
            for(const key of ["exceptions","invalidPositions",
              "physicsStepViolations","corruptedPlans","unboundedManeuverAttempts"])
              if(after.summary[key]>0)throw Error("unsafe state "+key);
            if(after.progressSummary.sustainedStill>before.progressSummary.sustainedStill||
               after.progressSummary.suspectedLoops>before.progressSummary.suspectedLoops)
              throw Error("new sustained still / movement loop");
            if(after.summary.stallEpisodes>before.summary.stallEpisodes)
              throw Error("new stall episodes");
            if(after.routeQualitySummary.searches>
                before.routeQualitySummary.searches*1.05)
              throw Error("unexpected route search inflation");
          ' "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/current.json"
      - name: Retain paired full physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-11e-paired45
          path: |
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/current.json
          if-no-files-found: ignore
