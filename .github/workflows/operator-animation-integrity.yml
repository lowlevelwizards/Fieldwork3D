name: Operator animation integrity
on:
  pull_request:
    paths:
      - 'src/breach-operator-rig.ts'
      - 'src/breach-muzzle.ts'
      - 'src/breach-weapon-pose.ts'
      - 'src/breach-weapon-clearance.ts'
      - 'src/breach-game.ts'
      - 'src/breach-3d.ts'
      - 'tests/breach-17*.test.mjs'
      - '.github/workflows/operator-animation-integrity.yml'
  workflow_dispatch:
jobs:
  animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Focused animation and barrel regressions
        run: node --experimental-strip-types --test tests/breach-17*.test.mjs
      - name: Verify Vite runtime bundle
        run: npx vite build
      - name: Typecheck full repository (may expose unrelated main-branch regressions)
        run: npm run check
