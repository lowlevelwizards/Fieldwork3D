name: Operator animation integrity
on:
  workflow_dispatch:
jobs:
  animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - name: Focused animation and barrel regressions
        run: node --experimental-strip-types --test tests/breach-17*.test.mjs tests/breach-operator-static-render-performance.test.mjs tests/breach-static-batching-performance.test.mjs tests/breach-shadow-update-policy-performance.test.mjs tests/breach-ik-scratch-performance.test.mjs tests/operator-visual-fit.test.mjs tests/operator-d2-facewear-pose-colors-r4.test.mjs
      - name: Verify Vite runtime bundle
        run: npx vite build
      - name: Typecheck full repository (may expose unrelated main-branch regressions)
        run: npm run check
