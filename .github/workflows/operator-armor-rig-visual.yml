name: Armor & Rig — Critical Mobile Silhouettes
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  armor-rig:
    # Dedicated V3 visual job avoids slow general armor suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - name: Focused RIG-R6 pocket and shoulder contact regressions
        run: node --experimental-strip-types --test tests/operator-rig-r4-pocket-routing.test.mjs tests/operator-rig-r5-matrix.test.mjs tests/operator-rig-r6-pocket-pressure.test.mjs tests/operator-rig-r6-shoulder-joins.test.mjs
      - name: R7 real rig colors, mounts, and magazine identity critical tests
        run: node --experimental-strip-types --test tests/operator-rig-r7-authenticity-policy.test.mjs tests/operator-rig-r7-front-mounts.test.mjs tests/operator-rig-r7-magazine-readability.test.mjs tests/operator-rig-r6-pocket-pressure.test.mjs tests/operator-rig-r6-shoulder-joins.test.mjs tests/operator-rig-r5-matrix.test.mjs
      - name: Armor R8 default fabrics, material changes and override regressions
        run: node --experimental-strip-types --test tests/operator-armor-r8-default-color.test.mjs
      - name: R10 color coupling and carrier/rig identity critical checks
        run: node --experimental-strip-types --test tests/operator-r10-material-coupling.test.mjs tests/operator-r10-silhouette-distinctions.test.mjs tests/operator-armor-r4-silhouette.test.mjs tests/operator-armor-r5-orthogonal.test.mjs tests/operator-armor-r6-contact.test.mjs
      - name: R9 armor occlusion, real lower strap joins and world-scale camo
        run: node --experimental-strip-types --test tests/operator-r9-armor-visibility.test.mjs tests/operator-r9-lower-front-straps.test.mjs tests/operator-r9-camo-density.test.mjs tests/operator-fabric-camo-stage2.test.mjs
      - run: npm exec -- playwright install --with-deps chromium
      - name: Existing mobile Operator Studio smoke
        run: node scripts/smoke-operator-studio.mjs
      - name: Phone Tops Material Clothes Only — no geometry spikes
        if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'fix/operator-lightmaps-metric-')) }}
        run: node scripts/smoke-lightmap-clothes-only.mjs
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.head_ref, 'fix/operator-lightmaps-metric-')
        with:
          name: lightmap-clothes-only-phone-screenshots
          path: operator-lightmap-clothes-only/
          if-no-files-found: ignore
      - name: Phone Operator Lab appearance cards and playback navigation
        run: node scripts/smoke-armor-r1-ui.mjs
      - name: Coupled AR/AK low-ready mobile Pose Fit screenshots
        if: ${{ github.event_name == 'workflow_dispatch' || ((startsWith(github.head_ref, 'feature/breach-coupled-low-ready-pose-') || (startsWith(github.head_ref, 'feature/breach-low-ready-pose-v2-') || startsWith(github.head_ref, 'feature/breach-unified-pose-v3-')))) }}
        run: |
          if [[ "$GITHUB_HEAD_REF" == feature/breach-unified-pose-v3-* ]]; then
            POSE_V3=1 node scripts/capture-breach-pose-fit.mjs
          else
            node scripts/capture-breach-pose-fit.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (startsWith(github.head_ref, 'feature/breach-coupled-low-ready-pose-') || (startsWith(github.head_ref, 'feature/breach-low-ready-pose-v2-') || startsWith(github.head_ref, 'feature/breach-unified-pose-v3-')))
        with:
          name: breach-pose-fit-phone-views
          path: breach-pose-fit-captures/
          if-no-files-found: warn
      - name: Gameplay-zoom armor and chest rig silhouette captures
        run: node scripts/capture-operator-armor-rig.mjs
      - name: R4 phone armor/rig/uniform cast-shadow comparisons
        if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'feature/gear-shadow-receiver-precision-')) }}
        run: node scripts/capture-operator-r4-contact-shadows.mjs
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.head_ref, 'feature/gear-shadow-receiver-precision-')
        with:
          name: operator-r4-contact-shadow-phone-captures
          path: operator-r4-contact-shadows/
          if-no-files-found: ignore
      - name: R9 camo scale comparison at studio and gameplay zoom
        run: node scripts/capture-operator-camo-r9.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-r9-camo-comparison
          path: operator-r9-camo-comparison/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-armor-rig-phone-silhouettes
          path: operator-armor-rig-captures/
          if-no-files-found: ignore
