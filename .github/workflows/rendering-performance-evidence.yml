            (cd "$RUNNER_TEMP/w2-base" && FIELDWORK_WALL_WEAR=legacy FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/base-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs)
            for mode in packed default; do
              FIELDWORK_WALL_WEAR="$mode" FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/$mode-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs
            done
          done
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const read=(mode,desktop)=>JSON.parse(readFileSync('artifacts/w2-live/'+mode+'-'+desktop+'/summary.json','utf8'));
          for(const desktop of [0,1]){
            const base=read('base',desktop);
            for(const mode of ['packed','default']){
              const test=read(mode,desktop);
              for(const key of ['initialKnowledge','initialVisible','secondVisible']){
                if(base.wallProbe[key]!==test.wallProbe[key])throw Error('W2 disclosure changed: '+mode+' '+key);
              }
              if(test.wallProbe.depthMismatches!==0)throw Error('W2 depth mismatch');
              if(test.runs.some((run,i)=>run.drawCallsP95>base.runs[i].drawCallsP95))throw Error('W2 increased live draws');
            }
          }
          JS
      - name: W4 same-site structural audition
        if: ${{ startsWith(github.head_ref, 'refactor/w4-') }}
        env:
          FIELDWORK_CI_CHROME: '1'
          FIELDWORK_W4_STRUCTURE: '1'
        run: node scripts/verification/w2-wall-audition-browser.mjs
      - name: W4 exact-base W3 vs compiled trim
        if: ${{ startsWith(github.head_ref, 'refactor/w4-') }}
        env:
          FIELDWORK_CI_CHROME: '1'
          FIELDWORK_W2_PROBE: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/w4-base" "$BASE_SHA"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/w4-base/node_modules"
          cp scripts/verification/e6-19-transparent-role-browser.mjs "$RUNNER_TEMP/w4-base/scripts/verification/"
          OUT="$PWD/artifacts/w4-live"
          mkdir -p "$OUT"
          for desktop in 0 1; do
            (cd "$RUNNER_TEMP/w4-base" && FIELDWORK_WALL_WEAR=separate FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/base-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs)
            for mode in compiled unified; do
              FIELDWORK_WALL_WEAR="$mode" FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/$mode-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs
            done
            # Counterbalance run order for the selected unified architecture.
            FIELDWORK_WALL_WEAR=unified FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/unified-repeat-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs
            (cd "$RUNNER_TEMP/w4-base" && FIELDWORK_WALL_WEAR=separate FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/base-repeat-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs)
          done
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const read=(mode,d)=>JSON.parse(readFileSync('artifacts/w4-live/'+mode+'-'+d+'/summary.json','utf8'));
          for(const d of [0,1]){
            const base=read('base',d);
            const repeatBase=read('base-repeat',d);
            for(const mode of ['compiled','unified','unified-repeat']){
            const test=read(mode,d),reference=mode==='unified-repeat'?repeatBase:base;
            for(const key of ['initialKnowledge','initialVisible','secondVisible'])
              if(reference.wallProbe[key]!==test.wallProbe[key])throw Error('W4 disclosure changed: '+key);
            if(test.wallProbe.depthMismatches!==0)throw Error('W4 depth mismatch');
            for(const [i,run] of test.runs.entries()){
              if(run.drawCallsP95>=reference.runs[i].drawCallsP95)throw Error('W4 failed to reduce live draws');
              if(run.renderSubmission.shadowDrawCallsP95!==reference.runs[i].renderSubmission.shadowDrawCallsP95)throw Error('W4 changed shadow draws');
            }
            }
            for(const [i,run] of read('unified',d).runs.entries()){
              const repeat=read('unified-repeat',d).runs[i];
              const ratios=[run.sceneP95Ms/base.runs[i].sceneP95Ms,repeat.sceneP95Ms/repeatBase.runs[i].sceneP95Ms];
              console.log('W4_REPEAT_TIMING '+JSON.stringify({desktop:d,seed:run.seed,ratios,repeatRegression:ratios.every(r=>r>1.05)}));
            }
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e6-19-transparent-role-evidence
          path: |
            artifacts/refactor-e6-19/live-scene/
            artifacts/w0-wall/
            artifacts/w2-wall-audition/
            artifacts/w2-live/
            artifacts/w4-live/
            artifacts/w5-fog/
            artifacts/w6-story/
            artifacts/w7-surfaces/
          if-no-files-found: ignore
          retention-days: 14

  rig-parity:
    needs: route
    if: ${{ needs.route.outputs.rig-parity == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: bbe8efede791767d7b9cc74082ac20f41fa11a9c
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Compare pre-footwear baseline with strict non-footwear parity and bounded artwork
        run: |
          mkdir -p baseline/scripts/verification artifacts/refactor-e6-7
          cp scripts/verification/e6-7-cold-rig-bench.mjs baseline/scripts/verification/e6-7-cold-rig-bench.mjs
          node --experimental-strip-types baseline/scripts/verification/e6-7-cold-rig-bench.mjs --out artifacts/refactor-e6-7/baseline.json
          node --experimental-strip-types scripts/verification/e6-7-cold-rig-bench.mjs --out artifacts/refactor-e6-7/current.json
          node scripts/verification/e6-7-compare-rig-bench.mjs artifacts/refactor-e6-7/baseline.json artifacts/refactor-e6-7/current.json artifacts/refactor-e6-7/comparison.json
      - name: Real rig articulation, pose, appearance, first contact and fog contracts
        run: |
          node --experimental-strip-types --test \
            tests/refactor-e6-7-rig-geometry.test.mjs \
            tests/refactor-e6-4-attribution.test.mjs \
            tests/refactor-e6cd-pose-fog.test.mjs \
            tests/performance-p2-6-contact-prewarm.test.mjs
      - name: Production typecheck and asset build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e6-7-cold-rig-paired-cpu-and-mesh-parity
          path: artifacts/refactor-e6-7/
          retention-days: 14
