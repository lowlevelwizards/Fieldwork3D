name: Arsenal A2 material unification (feature branch)
on:
  push:
    branches: [feat/arsenal-a2-material-unification]
  workflow_dispatch:
jobs:
  arsenal-a2:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Focused registry, swatch, geometry and gameplay tests
        run: node --experimental-strip-types --test tests/arsenal-a2-material-unification.test.mjs tests/arsenal-a1-baseline.test.mjs tests/arsenal-r15-finishes.test.mjs tests/visual-foundation-f2-weapon-finishes.test.mjs tests/visual-foundation-f5-arsenal-parity.test.mjs tests/equipment-20-12-weapon-light.test.mjs tests/weapon-fnc-p30-front-sight-inset.test.mjs tests/weapon-fal-p11-p13-variants.test.mjs
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Generate A2 material and geometry inventory
        run: npm run audit:arsenal-a1
      - name: Install headless browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture all 35 real weapon models after shared finish changes
        run: node scripts/capture-arsenal-a1.mjs
      - name: Capture six equipped real 3D accessory variants
        run: node scripts/capture-arsenal-a2.mjs
      - name: Upload inspectable A2 review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-a2-material-and-equipped-visual-review
          path: |
            reports/arsenal-a1-manifest.json
            reports/arsenal-a1-contact-sheet.png
            reports/arsenal-a2-equipped-sheet.png
          if-no-files-found: ignore
          retention-days: 21
