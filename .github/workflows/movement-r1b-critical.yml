name: Movement R1.B passage and feedback critical
on:
  push:
    branches: [feature/movement-reliability-r1b-20261120]
    paths:
      - 'src/breach-passage-plan.ts'
      - 'src/breach-passage-coordinator.ts'
      - 'src/breach-passage-visual-ranks.ts'
      - 'src/breach-queue-trace.ts'
      - 'src/breach-motor-passage.ts'
      - 'tests/release-d3-r1-*.test.mjs'
      - '.github/workflows/movement-r1b-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: movement-r1b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - name: TypeScript and exact passage contracts
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/release-d3-r1-repeated-passage.test.mjs \
            tests/release-d3-r1-passage-feedback.test.mjs \
            tests/passage-q2-coordinator.test.mjs \
            tests/passage-q3-ranks.test.mjs \
            tests/doorway-planned-sequence.test.mjs
      - name: Build smoke
        run: |
          npm run build
          test -s dist/fieldwork-build.json
