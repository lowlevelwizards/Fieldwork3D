name: D3.13H2 fifth independent 22-map paired acceptance
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: d3-13h2-fresh22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  historical-versus-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Candidate from exact PR head
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: G2C movement baseline (released immutable SHA)
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: 45001502bfb729e5ac8d08446af153237d359da5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure identical 22-map harness and install dependencies
        run: |
          cp candidate/scripts/audit-r7-squad-execution.mjs baseline/scripts/audit-r7-squad-execution.mjs
          cp candidate/scripts/lib/d3-13h2-fresh22-manifest.mjs baseline/scripts/lib/d3-13h2-fresh22-manifest.mjs
          npm --prefix baseline install --no-audit --no-fund
          npm --prefix candidate install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/d3-13h2"
      - name: Released G2C baseline · 22 blind maps × 2 modes × four × 45s
        run: |
          cd baseline
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --h2-fresh-22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-13h2/baseline.json"
      - name: H2B candidate · identical 22 maps, doors, orders and physics
        run: |
          cd candidate
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --h2-fresh-22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-13h2/candidate.json"
      - name: Check every difference against the released physical baseline
        run: |
          cd candidate
          node scripts/report-d3-13h2-fresh22.mjs \
            "$RUNNER_TEMP/d3-13h2/baseline.json" \
            "$RUNNER_TEMP/d3-13h2/candidate.json"
      - name: Preserve both raw runs, all 44 squads and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-13h2-fifth-fresh22-paired-45s
          path: ${{ runner.temp }}/d3-13h2/*.json
          if-no-files-found: ignore
          retention-days: 90
