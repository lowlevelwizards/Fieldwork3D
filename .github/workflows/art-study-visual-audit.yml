name: Fieldwork Art Study — Mobile Visual Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'study.html'
      - 'src/study-*.ts'
      - 'src/study-style.css'
      - 'tests/art-study-051.test.mjs'
      - 'scripts/capture-art-study.mjs'
      - '.github/workflows/art-study-visual-audit.yml'
      - 'vite.config.ts'
jobs:
  mobile-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-art-study.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldwork-art-study-051
          path: study-051-captures/
          if-no-files-found: ignore
          retention-days: 14
