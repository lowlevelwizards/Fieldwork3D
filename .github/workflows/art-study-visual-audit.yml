name: Fieldwork Art Study — Mobile Visual Audit
on:
  workflow_dispatch:
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  mobile-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm install --no-package-lock
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-art-study.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldwork-art-study-051
          path: study-051-captures/
          if-no-files-found: ignore
          retention-days: 14
