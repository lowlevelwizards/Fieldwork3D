name: Breach Architecture — Critical Integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: breach-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  critical:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Curated authoritative scenario and architecture regressions
        run: node scripts/verification/breach-critical-suite.mjs
      - name: Stage 2 full generated-site physical-integrity matrix (four orientations, eleven archetypes, five scales)
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage2-') }}
        run: node --experimental-strip-types scripts/audit-roadmap2-physical-integrity.mjs 44 all
      - name: Stage 3 full visibility, fog and historical disclosure regression sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage3-') }}
        run: node scripts/verification/breach-stage3-visibility-suite.mjs
      - name: Stage 4 replay, pointer and feedback composition regression sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage4-') }}
        run: node scripts/verification/breach-stage4-composition-suite.mjs
      - name: Architecture dependency boundary check
        run: node scripts/verification/breach-architecture-boundaries.mjs
      - name: Production TypeScript and asset build
        if: ${{ always() }}
        run: npm run build
      - name: Verify previous Pages build is successfully served
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
