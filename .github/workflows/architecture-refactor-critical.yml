name: Breach Architecture — Critical Integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: breach-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A9: maintain one authoritative architecture/replay regression gate.
# Older named roadmap-stage suites remain runnable from scripts/verification,
# individual test files, and npm test. No branch-specific dead gates.
jobs:
  critical:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Authoritative simulation, fog, motor, replay and architecture suite
        run: node scripts/verification/breach-critical-suite.mjs
      - name: A10 — Complete Package A0–A10 consolidation acceptance
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/consolidation-') }}
        run: node scripts/verification/package-a-closeout-suite.mjs --run
      - name: Inventory source reachability and protect compatibility candidates
        run: |
          node --test tests/consolidation-inventory.test.mjs
          node scripts/verification/consolidation-inventory.mjs --check --json artifacts/consolidation/inventory.json --markdown artifacts/consolidation/inventory.md
      - name: Explicit architecture and CI ownership boundaries
        run: |
          node scripts/verification/breach-architecture-boundaries.mjs
          node scripts/verification/ci-workflow-contract.mjs
      - name: Typecheck, production build, and Pages build stamp
        run: npm run build
      - name: Retain architecture census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-architecture-inventory
          path: artifacts/consolidation/
          if-no-files-found: warn
          retention-days: 14

  # Independently report release readiness. This must succeed before merging,
  # but a deployment already in progress must not invalidate code regression
  # results or enqueue another production run.
  release-readiness:
    needs: critical
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify prior production Pages run completed and exact build served
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
