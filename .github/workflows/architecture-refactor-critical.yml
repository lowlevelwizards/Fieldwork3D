name: Breach Architecture — Critical Integration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: breach-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A9: maintain one authoritative architecture/replay regression gate.
# Older named roadmap-stage suites remain runnable from scripts/verification,
# individual test files, and npm test. No branch-specific dead gates.
jobs:
  critical:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/') || (startsWith(github.head_ref, 'feature/release1-') || startsWith(github.head_ref, 'feature/release2-') || startsWith(github.head_ref, 'feature/release3-') || startsWith(github.head_ref, 'feature/release4-') || startsWith(github.head_ref, 'feature/release5-') || startsWith(github.head_ref, 'feature/release6-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Authoritative simulation, fog, motor, replay and architecture suite
        run: node scripts/verification/breach-critical-suite.mjs
      - name: A10 — Complete Package A0–A10 consolidation acceptance
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/consolidation-') }}
        run: node scripts/verification/package-a-closeout-suite.mjs --run
      - name: Inventory source reachability and protect compatibility candidates
        run: |
          node --test tests/consolidation-inventory.test.mjs
          node scripts/verification/consolidation-inventory.mjs --check --json artifacts/consolidation/inventory.json --markdown artifacts/consolidation/inventory.md
      - name: Explicit architecture and CI ownership boundaries
        run: |
          node scripts/verification/breach-architecture-boundaries.mjs
          node scripts/verification/ci-workflow-contract.mjs
      - name: E0 integrated read-only refactor evidence and regression contracts
        run: |
          node --test tests/refactor-e0-audit.test.mjs
          node scripts/verification/refactor-e0-audit.mjs --check --out artifacts/refactor-e0
      - name: R7.0 read-only UI orchestration and equipment ownership census
        run: |
          node --test tests/r7-0-ui-orchestration-audit.test.mjs
          node scripts/verification/r7-0-ui-orchestration-audit.mjs --check --out artifacts/refactor-r7-0
      - name: R7.1 actual Session lifecycle, replay and HUD split
        run: |
          node --experimental-strip-types --test tests/r7-1-session-lifecycle.test.mjs
          node --experimental-strip-types --test tests/breach-runtime-loop-step12.test.mjs
      - name: R7.2 targeted UI invalidation and committed DOM setter evidence
        run: |
          node --experimental-strip-types --test tests/r7-2-targeted-ui-invalidation.test.mjs
          node --experimental-strip-types scripts/verification/r7-2-ui-evidence.mjs --check --out artifacts/refactor-r7-2
      - name: R7.3 shared equipment view ownership and retained transaction boundaries
        run: |
          node --experimental-strip-types --test tests/r7-3-equipment-workspace.test.mjs tests/outfitter-gallery-lifecycle.test.mjs tests/performance-p7-gallery-noop.test.mjs tests/performance-p3-async-thumbnails.test.mjs tests/loadout-quickplay-preview-integration.test.mjs tests/loadout-quickplay-carry-selector.test.mjs tests/loadout-carry-selector-integration.test.mjs
      - name: R7.4 Campaign home view continuity
        run: node --experimental-strip-types --test tests/r7-4-campaign-home-view.test.mjs tests/operations-landing-navigation.test.mjs
      - name: E4 combined replay and event-feed closeout evidence
        run: node --experimental-strip-types scripts/verification/refactor-e4-closeout.mjs --out artifacts/refactor-e4/closeout.json
      - name: E5 capture and long-session retention evidence
        run: node --experimental-strip-types scripts/verification/refactor-e5-replay-memory.mjs --frames 120 --out artifacts/refactor-e5/memory.json
      - name: E6 cold-contact rig/appearance CPU baseline and staged allocation evidence
        run: node --experimental-strip-types scripts/verification/e6-cold-contact-prewarm.mjs --hostiles 4 --out artifacts/refactor-e6/cold-contact.json
      - name: E6.2–E6.3 pose-neighbor, fog fingerprint and first-contact parity
        run: node --experimental-strip-types --test tests/refactor-e6cd-pose-fog.test.mjs
      - name: E6.4 measured pose/appearance and real fog texture upload attribution
        run: node --experimental-strip-types --test tests/refactor-e6-4-attribution.test.mjs
      - name: E6.5 one-pass teammate context parity and observational CPU A/B
        run: |
          node --experimental-strip-types --test tests/refactor-e6-5-ally-context.test.mjs
          node --experimental-strip-types scripts/verification/e6-5-ally-scan-bench.mjs --out artifacts/refactor-e6/e6-5-ally-scan.json
      - name: Typecheck, production build, and Pages build stamp
        run: npm run build
      - name: Retain architecture census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-architecture-inventory
          path: |
            artifacts/consolidation/
            artifacts/refactor-e0/
            artifacts/refactor-r7-0/
            artifacts/refactor-r7-2/
            artifacts/refactor-e4/
            artifacts/refactor-e5/
            artifacts/refactor-e6/
          if-no-files-found: warn
          retention-days: 14

  # Independently report release readiness. This must succeed before merging,
  # but a deployment already in progress must not invalidate code regression
  # results or enqueue another production run.
  release-readiness:
    needs: critical
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/') || (startsWith(github.head_ref, 'feature/release1-') || startsWith(github.head_ref, 'feature/release2-') || startsWith(github.head_ref, 'feature/release3-') || startsWith(github.head_ref, 'feature/release4-') || startsWith(github.head_ref, 'feature/release5-') || startsWith(github.head_ref, 'feature/release6-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify prior production Pages run completed and exact build served
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
