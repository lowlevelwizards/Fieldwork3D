name: Breach Architecture — Critical Integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: breach-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  critical:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Curated authoritative scenario and architecture regressions
        run: node scripts/verification/breach-critical-suite.mjs
      - name: Stage 2 full generated-site physical-integrity matrix (four orientations, eleven archetypes, five scales)
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage2-') }}
        run: node --experimental-strip-types scripts/audit-roadmap2-physical-integrity.mjs 44 all
      - name: Stage 3 full visibility, fog and historical disclosure regression sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage3-') }}
        run: node scripts/verification/breach-stage3-visibility-suite.mjs
      - name: Stage 4 replay, pointer and feedback composition regression sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage4-') }}
        run: node scripts/verification/breach-stage4-composition-suite.mjs
      - name: Stage 5 deeper deterministic, replay retention and hot-path regression sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage5-') }}
        run: |
          node --experimental-strip-types --test tests/breach-roadmap2-stage1-soak.test.mjs tests/breach-ground-view-performance.test.mjs tests/breach-fog-ray-broadphase-performance.test.mjs tests/breach-round-lifetime-events.test.mjs tests/breach-p7-replay-sharing.test.mjs tests/doorway-right-of-way-session.test.mjs
          node scripts/verification/breach-stage4-composition-suite.mjs
      - name: Stage 5 performance baseline and retention contract
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage5-') }}
        run: node scripts/verification/breach-stage5-performance-gate.mjs
      - name: Upload Stage 5 host performance evidence (NOT device FPS)
        if: ${{ always() && startsWith(github.head_ref, 'refactor/roadmap2-stage5-') }}
        uses: actions/upload-artifact@v4
        with:
          name: breach-roadmap2-stage5-host
          path: artifacts/performance/roadmap2-stage5-host.json
          if-no-files-found: warn
      - name: Stage 6 generated and legacy site construction, registration and resource lifetime
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage6-') }}
        run: |
          node --experimental-strip-types --test tests/breach-roadmap2-stage6-site-builder.test.mjs tests/breach-roadmap2-site-builder.test.mjs tests/breach-site-material-lifetime.test.mjs tests/breach-scene-memory-lifecycle-p6.test.mjs tests/map-04-fixture-renderer.test.mjs tests/breach-roadmap3-site-exterior.test.mjs tests/visibility-10-architectural-fog.test.mjs tests/fog-exterior-facade-regression.test.mjs tests/fog-exterior-unseen-apertures-regression.test.mjs tests/breach-roadmap2-stage2-physical-integrity.test.mjs tests/breach-roadmap2-stage3-integration.test.mjs tests/door-hinge-neighborhood-cache.test.mjs
      - name: Stage 7 full motor, doorway, collision, squeeze, traversal and recovery sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage7-') }}
        run: node scripts/verification/breach-stage7-motor-suite.mjs
      - name: Stage 8 complete tactical orders, medical, civilian, door and replay sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage8-') }}
        run: node scripts/verification/breach-stage8-order-suite.mjs
      - name: Stage 10 authoritative firing, projectile, environment and casualty regression sweep
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage10-') }}
        run: |
          node --experimental-strip-types --test tests/breach-roadmap2-stage10-combat.test.mjs tests/gameplay-g3-fire-lanes.test.mjs tests/breach-171.test.mjs tests/breach-179.test.mjs tests/breach-muzzle-lane-hotfix.test.mjs tests/breach-two-sided-fire-recovery.test.mjs tests/breach-roadmap2-impact-evidence.test.mjs tests/breach-roadmap3-shot-ignition.test.mjs tests/breach-roadmap4-ballistic-resolution.test.mjs tests/civilian-b5b-ballistics.test.mjs tests/civilian-c3c-harm-attribution.test.mjs tests/civilian-d2-fire-safety.test.mjs tests/phase-a-shot-pressure.test.mjs tests/equipment-09-armor.test.mjs tests/lw-glass-impact.test.mjs tests/lw-penetration.test.mjs tests/replay-r2-ballistics.test.mjs
      - name: Stage 11 operator frame, rig, IK, replay and handling ownership parity
        if: ${{ success() && startsWith(github.head_ref, 'refactor/roadmap2-stage11-') }}
        run: |
          node --experimental-strip-types --test tests/breach-roadmap2-stage11-animation.test.mjs tests/breach-unified-pose-stability.test.mjs tests/breach-pose-transition-director.test.mjs tests/breach-pose-v3-coordinated.test.mjs tests/breach-ik-scratch-performance.test.mjs tests/breach-pose-v3-reload-replay.test.mjs tests/breach-coupled-rig-smoke.test.mjs tests/breach-roadmap2-pose-locomotion.test.mjs tests/breach-pose-v3-action-matrix.test.mjs tests/operator-lab-unified-poses.test.mjs tests/breach-171.test.mjs tests/breach-179.test.mjs
      - name: Architecture dependency boundary check
        run: node scripts/verification/breach-architecture-boundaries.mjs
      - name: Production TypeScript and asset build
        if: ${{ always() }}
        run: npm run build
      - name: Verify previous Pages build is successfully served
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
