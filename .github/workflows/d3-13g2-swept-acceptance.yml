name: D3.13G2 swept route rejoin acceptance
on:
  pull_request:
    paths:
      - src/breach-door-escape-rejoin.ts
      - src/breach-door-escape-stage.ts
      - src/breach-motor-route.ts
      - src/breach-motor-collision.ts
      - src/breach-route-transition.ts
      - tests/release-d3-13g2-swept-rejoin.test.mjs
      - .github/workflows/d3-13g2-swept-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: d3-13g2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safety-and-movement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Focused D3.13G2 and authoritative door regressions
        run: |
          node --experimental-strip-types --test \
            tests/release-d3-13g2-swept-rejoin.test.mjs \
            tests/release-d3-11d-portal-handoff.test.mjs \
            tests/door-leaf-overlap-recovery.test.mjs
          npm run check
      - name: Frozen full 11-site 45-second physical acceptance
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress --route-quality > "$RUNNER_TEMP/d313g2-main.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d313g2-main.json','utf8'));
          const s=x.summary,p=x.progressSummary,q=x.routeQualitySummary;
          console.log('D313G2_MAIN',JSON.stringify({summary:s,progress:p,route:q}));
          if(s.exceptions||s.invalidPositions||s.corruptedPlans||s.physicsStepViolations||
             s.unboundedManeuverAttempts)throw Error('physics integrity');
          if(s.acceptedFour!==22||s.physicalArrivals<79||s.physicalCompletedFour<18||
             s.completedFour<21)throw Error('physical arrival or completion regression');
          if(s.stallEpisodes>9||s.retries>6||p.sustainedStill||p.suspectedLoops)
            throw Error('new loop, still or stall regression');
          if(q.searches>4070)throw Error('A* search regression');
          NODE
      - name: Independent 45-second small motel witness
        if: success()
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --site-index=8 --audit-seed=1855967 --audit-scale=small \
            --route-transitions --route-quality --progress --trace-actor=rook \
            --trace-mode=authored > "$RUNNER_TEMP/d313g2-small.json"
      - name: Independent 45-second standard motel witness
        if: success()
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --site-index=8 --audit-seed=2069994 --audit-scale=standard \
            --route-transitions --route-quality --progress --trace-actor=rook \
            --trace-mode=authored > "$RUNNER_TEMP/d313g2-standard.json"
      - name: Compare independent physical arrivals and rejoin sources
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const [file,min] of [['small',2],['standard',3]]){
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d313g2-'+file+'.json','utf8'));
            const authored=x.rows[0].modes.find(m=>m.mode==='authored');
            const rook=authored.operators.find(a=>a.id==='rook');
            const events=authored.routeTransitions;
            const report={file,arrivals:authored.arrivals,rookRemaining:rook.remaining,
              transitions:events.counts,rejections:events.rejectReasons,
              searches:x.routeQualitySummary.searches,
              physicsViolations:x.summary.physicsStepViolations};
            console.log('D313G2_HOLDOUT',JSON.stringify(report));
            if(x.summary.exceptions||x.summary.invalidPositions||
               x.summary.corruptedPlans||x.summary.physicsStepViolations||
               authored.arrivals<min)throw Error(file+' holdout regression');
          }
          NODE
      - name: Retain actual raw simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-13g2-45second-physical
          path: ${{ runner.temp }}/d313g2-*.json
          if-no-files-found: ignore
          retention-days: 90
