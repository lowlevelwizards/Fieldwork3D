name: Arsenal M2.6 persistent mounting and transaction contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/arsenal/**'
      - 'src/equipment-weapon-assemblies.ts'
      - 'src/equipment-weapon-inventory.ts'
      - 'src/equipment-weapon-transactions.ts'
      - 'src/weapons/geometry/weapon-mount-*.ts'
      - 'src/weapons/geometry/mounted-accessory-layout.ts'
      - 'src/campaign-state.ts'
      - 'tests/arsenal-m26-*.test.mjs'
      - 'arsenal-m26-capture.html'
      - 'src/arsenal-m26-capture.ts'
      - 'scripts/smoke-arsenal-m26-visual.mjs'
      - '.github/workflows/arsenal-m26.yml'
permissions:
  contents: read
  actions: read
# Isolate each PR from manual acceptance and cancel obsolete revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  critical:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: M2.6 saves, physical choice, Arsenal transactions and legacy gates
        run: |
          node --experimental-strip-types --test \
            tests/arsenal-m26-persistent-mounts.test.mjs \
            tests/arsenal-m26-transactions.test.mjs \
            tests/arsenal-m26-stock-transfer.test.mjs \
            tests/arsenal-m26-kit-quickplay.test.mjs \
            tests/equipment-19-09-campaign-armory.test.mjs \
            tests/arsenal-v2-assembly.test.mjs \
            tests/arsenal-m2-accessory-integration.test.mjs \
            tests/arsenal-m2-optic-identities-eye-box.test.mjs \
            tests/arsenal-v2-campaign-adapter.test.mjs \
            tests/arsenal-v2-saved-builds.test.mjs \
            tests/equipment-19-08-campaign-attachment-stock.test.mjs
      - name: TypeScript
        run: npm run check
      - name: Production compile
        run: npm run build
  visual:
    needs: critical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: M2.6 real WebGL persisted right/left optic and light positions
        run: node scripts/smoke-arsenal-m26-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arsenal-m26-saved-mounts-webgl-acceptance
          path: |
            reports/arsenal-m26-mounted-desktop.png
            reports/arsenal-m26-mounted-mobile.png
            reports/arsenal-m26-mesh-stats.json
          if-no-files-found: ignore
          retention-days: 14
  release-preflight:
    needs: [critical, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no pending Pages, last publish success and served build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
