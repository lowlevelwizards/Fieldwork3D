name: D3.10B fixed authored-goal hold and 45s progress parity
on:
  pull_request:
    branches: [feature/d3-2-r2-physical-hinge-body-recovery-20261114]
    paths:
      - src/breach-authored-goal-block.ts
      - src/breach-motor-route.ts
      - tests/release-d3-10b-authored-obstruction.test.mjs
      - .github/workflows/d3-10b-authored-obstruction.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-10b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: D3.10B exact-source regressions
        run: node --experimental-strip-types --test tests/release-d3-10b-authored-obstruction.test.mjs tests/release-d3-9c-progress.test.mjs
      - name: Typecheck and production build
        run: npm run build
      - name: Paired frozen 45-second full physical session corpus
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress > "$RUNNER_TEMP/current45.json"
          git worktree add --detach "$RUNNER_TEMP/d310a" 7f692d7413c881127ad5d4b3f27b09f361e36b07
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/d310a/node_modules"
          node --experimental-strip-types "$RUNNER_TEMP/d310a/scripts/audit-r7-squad-execution.mjs" 11 2700 --progress > "$RUNNER_TEMP/prior45.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const old=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const current=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const find=(r,seed,mode,id)=>r.rows.find(s=>s.seed===seed)?.modes.find(m=>m.mode===mode)?.operators.find(a=>a.id===id);
            const a=find(old,31149,"authored","ash"),b=find(current,31149,"authored","ash");
            const output={baseline:old.summary,current:current.summary,
              progressBaseline:old.progressSummary,progressCurrent:current.progressSummary,
              motelAsh:{before:a,after:b}};
            console.log("D3.10B45",JSON.stringify(output,null,2));
            if(!a||!b)throw Error("missing frozen motel Ash witness");
            if(!b.orderIssue?.reason?.includes("DESTINATION OBSTRUCTED"))
              throw Error("authored impossible target did not report a truthful retained-order issue");
            if(b.remainingOrders!==1||b.arrived)
              throw Error("authored blocked goal changed or falsely arrived");
            if(current.summary.exceptions||
               current.summary.invalidPositions||
               current.summary.physicsStepViolations||
               current.summary.corruptedPlans||
               current.summary.unboundedManeuverAttempts)
              throw Error("unsafe motion or authored-plan corruption");
            if(current.summary.physicalArrivals<old.summary.physicalArrivals)
              throw Error("D3.10B regressed legitimate 45s arrivals");
          ' "$RUNNER_TEMP/prior45.json" "$RUNNER_TEMP/current45.json"
      - name: Retain paired per-operator evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-10b-45s-paired-evidence
          path: |
            ${{ runner.temp }}/prior45.json
            ${{ runner.temp }}/current45.json
          if-no-files-found: ignore
