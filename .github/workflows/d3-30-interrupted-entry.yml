name: D3.30A safe interrupted entry order snapshots
on:
  push:
    branches: [feature/d3-30-interrupted-entry-recovery-20261118]
    paths:
      - '.github/workflows/d3-30-interrupted-entry.yml'
      - 'src/breach-door-interruption.ts'
      - 'src/breach-game.ts'
      - 'src/breach-order-lifecycle.ts'
      - 'src/breach-motor-door.ts'
      - 'src/breach-order-wait.ts'
      - 'tests/release-d3-30-interrupted-entry.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d330-interrupted-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interrupted-door-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Typecheck and critical door entry preservation
        run: |
          npm run check
          node --experimental-strip-types --test tests/release-d3-30-interrupted-entry.test.mjs tests/release-d3-25b-terminal-entry-gate.test.mjs tests/release-d3-29-motor-lock-gate.test.mjs
