name: D3.11C route handoff and frozen 45-second safety
on:
  pull_request:
    branches: [feature/d3-2-r2-physical-hinge-body-recovery-20261114]
    paths:
      - 'src/breach-route-transition.ts'
      - 'src/breach-door-traversal-episode.ts'
      - 'src/breach-door-traversal-maneuver.ts'
      - 'src/breach-actor-motor.ts'
      - 'src/breach-motor-collision.ts'
      - 'src/breach-motor-route.ts'
      - 'src/breach-motor-passage.ts'
      - 'scripts/audit-r7-squad-execution.mjs'
      - 'tests/release-d3-11c-route-handoff.test.mjs'
      - '.github/workflows/d3-11c-route-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-11c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: D3.11C targeted tests + prior safeguards
        run: |
          node --experimental-strip-types --test tests/release-d3-11c-route-handoff.test.mjs tests/release-d3-11ab-route-quality.test.mjs tests/door-traversal-d2.test.mjs tests/tactical-integration-01-recovery.test.mjs tests/release-d3-10b-authored-obstruction.test.mjs tests/release4-cornering.test.mjs
      - run: npm run build
      - name: Utility 31162 high-resolution handoff attribution
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --site-index=9 --progress --route-quality --utility-trace --route-transitions > "$RUNNER_TEMP/utility.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const m=data.rows[0].modes.find(x=>x.mode==="authored");
            const events=m.routeTransitions.events;
            console.log("D311C_UTILITY",JSON.stringify({
              summary:data.summary,quality:data.routeQualitySummary,
              rook:m.routeQuality.actors.find(x=>x.id==="rook"),
              handoffs:m.routeTransitions.counts,
              escapeReacquirePairs:m.routeTransitions.escapeReacquirePairs,
              pairsByDoor:m.routeTransitions.pairsByDoor,
              rookHandoffs:m.routeTransitions.byActor,
              episodeTransitions:events.filter(e=>e.seconds>=9&&e.seconds<=25)
               .map(e=>({at:e.seconds,source:e.source,
                before:e.prior[0],after:e.next[0],
                maneuver:e.doorManeuver,phase:e.doorPhase,
                squeeze:e.squeeze,blocker:e.blocker,blocked:e.blockedTime})),
              suspicious:m.progressEvidence.filter(e=>e.actor==="rook"&&e.suspicious)
            },null,2));
            if(data.summary.exceptions||data.summary.invalidPositions||
               data.summary.physicsStepViolations||data.summary.corruptedPlans)
              throw Error("invalid Utility");
          ' "$RUNNER_TEMP/utility.json"
      - name: Paired 45-second full-corpus gate against verified D3.11B
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress --route-quality --route-transitions > "$RUNNER_TEMP/current.json"
          git worktree add --detach "$RUNNER_TEMP/baseline" d90f9c1e243e058513050404891abf09d848e13a
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/baseline/node_modules"
          node --experimental-strip-types "$RUNNER_TEMP/baseline/scripts/audit-r7-squad-execution.mjs" 11 2700 --progress --route-quality > "$RUNNER_TEMP/baseline.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const before=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const after=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const keys=["acceptedFour","physicalArrivals",
             "physicalCompletedFour","completedFour","stallEpisodes","retries",
             "physicsStepViolations","invalidPositions","corruptedPlans"];
            console.log("D311C_PAIRED",JSON.stringify({
             baseline:Object.fromEntries(keys.map(k=>[k,before.summary[k]])),
             current:Object.fromEntries(keys.map(k=>[k,after.summary[k]])),
             searchBefore:before.routeQualitySummary,
             searchAfter:after.routeQualitySummary,
             routeTransitionSummary:after.transitionSummary,
             progressBefore:before.progressSummary,
             progressAfter:after.progressSummary},null,2));
            for(const k of ["acceptedFour","physicalArrivals",
               "physicalCompletedFour","completedFour"])
              if(after.summary[k]<before.summary[k])
               throw Error("outcome regression: "+k);
            for(const k of ["exceptions","invalidPositions",
              "physicsStepViolations","corruptedPlans","unboundedManeuverAttempts"])
              if(after.summary[k]>0)throw Error("unsafe regression: "+k);
          ' "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/current.json"
      - name: Upload exact traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-11c-utility-and-paired45
          path: |
            ${{ runner.temp }}/utility.json
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/current.json
          if-no-files-found: ignore
