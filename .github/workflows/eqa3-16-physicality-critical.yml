name: EQA3.16 physicality and replay critical
on:
  push:
    branches: [release/eqa3-12-16-encounter-physicality-20261119]
    paths:
      - 'src/breach-encounter-physicality.ts'
      - 'src/breach-civilian-visuals.ts'
      - 'src/breach-civilian-types.ts'
      - 'src/breach-order-interactions.ts'
      - 'src/breach-civilian-pose.ts'
      - 'src/breach-2d-actor-renderer.ts'
      - 'src/breach-replay.ts'
      - 'src/breach-idle-life.ts'
      - 'src/breach-hostile-physicality.ts'
      - 'src/breach-3d.ts'
      - 'tests/eqa3-16-*.test.mjs'
      - '.github/workflows/eqa3-16-physicality-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physicality:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript and exact physicality critical paths
        run: |
          npm run check
          npx vite build
          node --experimental-strip-types --test \
            tests/eqa3-16-physicality-contract.test.mjs \
            tests/eqa3-16-contact-replay.test.mjs \
            tests/eqa3-16-hostile-intent.test.mjs \
            tests/eqa3-16-organic-presentation.test.mjs \
            tests/eqa3-9-civilian-animation.test.mjs \
            tests/civilian-r2-presentation.test.mjs \
            tests/civilian-c5-unified-pose.test.mjs \
            tests/eqa3-10-civilian-response.test.mjs \
            tests/eqa3-15-moving-rescue-intel.test.mjs \
            tests/eqa3-15-rescue-handoff.test.mjs \
            tests/eqa3-9-auto-secure.test.mjs \
            tests/eqa3-10-restrain.test.mjs \
            tests/eqa3-14-organic-contact.test.mjs
