name: EQA3.16K NPC visual continuity critical
on:
  push:
    branches:
      - feature/eqa3-16k-npc-lab-pose-continuity-20261119
  workflow_dispatch:
concurrency:
  group: eqa3-16k-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npc-visual-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: TypeScript
        run: npm run check
      - name: Focused NPC, replay and visual rig regressions
        run: >-
          node --experimental-strip-types --test
          tests/eqa3-16k-npc-lab-continuity.test.mjs
          tests/eqa3-16j-npc-lab.test.mjs
          tests/eqa3-16-physicality-contract.test.mjs
          tests/eqa3-16-contact-replay.test.mjs
