name: Performance P6.E runtime listener lifecycle
on:
  pull_request:
    paths:
      - 'src/breach-runtime-loop.ts'
      - 'tests/performance-p6-runtime-listener-lifecycle.test.mjs'
      - '.github/workflows/performance-p6-runtime-listener.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: 30-cycle listener ownership, tactical RAF and idle cadence
        run: >-
          node --experimental-strip-types --test
          tests/performance-p6-runtime-listener-lifecycle.test.mjs
          tests/performance-p2-2-idle-3d-cadence.test.mjs
          tests/breach-runtime-loop-step12.test.mjs
      - name: Typecheck and production bundle
        run: npm run check && npx vite build
