name: D15 R1 Pages hotfix critical baseline
on:
  push:
    branches: [release/d15-pages-hotfix-20261120]
    paths:
      - '.github/workflows/d15-pages-hotfix-check.yml'
      - 'tests/breach-roadmap2-stage1-contracts.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d15-pages-hotfix
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Investigate actual D15 contact outcome and surrendered actors
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import {runStage1Scenario,stage1ContactSite} from './tests/fixtures/breach-stage1-contract-runner.mjs';
          import {team,enemies} from './src/breach-game.ts';
          const setup=s=>{
            const friendly=team(s),hostiles=enemies(s);
            for(const a of friendly){
              const b=hostiles[0];
              a.heading=Math.atan2(b.p.y-a.p.y,b.p.x-a.p.x);
              a.weaponYaw=a.heading;a.firePolicy='engage';a.aim=.7;
            }
            for(const e of hostiles){
              const b=friendly[0];
              e.heading=Math.atan2(b.p.y-e.p.y,b.p.x-e.p.x);
              e.weaponYaw=e.heading;
            }
          };
          const out=runStage1Scenario({site:stage1ContactSite(),mission:'hold',ticks:420,sampleEvery:30,configure:setup});
          console.log('D15 combat audit',JSON.stringify({
            hash:out.fingerprint,surrenders:out.events.filter(e=>e.kind==='surrender'),
            shotsFired:out.shotsFired,
            lastRed:out.last.actors.filter(a=>a.side==='red').map(a=>({
              id:a.id,health:a.health,injuryStage:a.injuryStage,shots:a.shots}))
          }));
          NODE
      - name: Exact predeploy Pages tactical regressions
        run: |
          node --experimental-strip-types --test \
            tests/breach-roadmap2-stage1-contracts.test.mjs \
            tests/passage-q5-approaches.test.mjs \
            tests/animation-a3-10-close-stack-fire.test.mjs \
            tests/animation-a3-11-progressive-urgency.test.mjs \
            tests/fog-exterior-unseen-apertures-regression.test.mjs \
            tests/operator-studio-main-menu.test.mjs \
            tests/performance-p8-replay-memory.test.mjs
      - name: Exact production TypeScript bundle and Pages stamp
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/fieldwork-build.json
