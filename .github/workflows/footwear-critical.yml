name: Footwear critical
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: footwear-critical-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  footwear:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/operator-footwear-options.test.mjs tests/breach-motion-boot-forefoot.test.mjs tests/operator-garment-readability-20261103.test.mjs tests/operator-wardrobe-unified.test.mjs tests/operator-wardrobe-pattern-ui.test.mjs
