name: E6.26 Arsenal immutable part geometry pool
on:
  pull_request:
    paths:
      - 'src/arsenal/weapon-geometry-pool.ts'
      - 'src/arsenal/viewport.ts'
      - 'src/arsenal/thumbnailer.ts'
      - 'tests/refactor-e6-26-arsenal-geometry-pool.test.mjs'
      - 'scripts/verification/e6-26-arsenal-browser.mjs'
      - '.github/workflows/refactor-e6-26-arsenal-geometry-pool.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e6-26-arsenal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  arsenal-pool:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Actual M4 part identities, stock sockets, dedup ownership and prior stage regressions
        run: |
          node --experimental-strip-types --test \
            tests/refactor-e6-26-arsenal-geometry-pool.test.mjs \
            tests/refactor-e6-25-character-fixture-template.test.mjs \
            tests/refactor-e6-24-service-prop-template.test.mjs \
            tests/refactor-e6-23-rigid-fixture-template.test.mjs
      - name: Production TypeScript and bundle
        run: npm run build
      - name: Browser A/B dependencies and parser check
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 pngjs@7.0.0
          node --check scripts/verification/e6-26-arsenal-browser.mjs
      - name: Live Arsenal mobile hero and Workbench screenshot parity
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/verification/e6-26-arsenal-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e6-26-arsenal-visual-ab
          path: artifacts/refactor-e6-26/arsenal-ab/
          if-no-files-found: ignore
          retention-days: 14
