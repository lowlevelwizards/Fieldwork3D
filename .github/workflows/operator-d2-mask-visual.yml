name: D2 Masks — Mobile silhouette review
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  mask-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps chromium
      - name: WebGL front-side-back and thumbnail contact captures
        run: node scripts/capture-operator-d2-masks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2-mask-orthographic-captures
          path: operator-d2-mask-review/
          if-no-files-found: ignore
