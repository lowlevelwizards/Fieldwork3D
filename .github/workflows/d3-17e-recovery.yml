name: D3.17E productive recovery acceptance
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d317e-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - name: Typecheck and known recovery invariants
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/release-d3-17e-recovery-accounting.test.mjs \
            tests/release-d3-17e-physical-leaf-rejoin.test.mjs \
            tests/release-d3-17e-operator-status.test.mjs \
            tests/release-d3-17d-door-route-join.test.mjs \
            tests/release-d3-17c-physical-departure.test.mjs \
            tests/release-d3-17b-route-recurrence.test.mjs \
            tests/release-d3-14d2-retail-rehearsal.test.mjs
      - name: Exact 4 persistent cases — physical motor and transitions
        run: |
          for case in "motel 8 14136777 small authored ash" \
                      "retail 3 14299875 standard entry rook" \
                      "garage 5 14354241 standard authored rook" \
                      "clinic 10 14490156 standard authored rook"; do
            set -- $case
            node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
              11 2700 --site-index="$2" --audit-seed="$3" \
              --audit-scale="$4" --progress --route-transitions \
              --leaf-rejoin-diagnostic \
              --trace-actor="$6" --trace-mode="$5" \
              > "$RUNNER_TEMP/d317e-$1.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const site of ['motel','retail','garage','clinic']){
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d317e-'+site+'.json','utf8'));
            const mode=site==='retail'?'entry':'authored';
            const m=x.rows[0].modes.find(m=>m.mode===mode);
            console.log('D317E_EXACT '+JSON.stringify({
              site,mode,seed:x.rows[0].seed,operators:m.operators.map(a=>({
                id:a.id,arrived:a.arrived,remaining:a.remaining,
                blocker:a.lastBlocker,stalls:a.stallEpisodes,retries:a.retries,
                blockedSeconds:a.blockedSeconds,
                waiting:a.activeOrder,remainingOrders:a.remainingOrders
              })),
              transitions:m.routeTransitions.byActor,
              leafRecoveryEvidence:m.leafRecoveryEvidence,
              summary:x.summary,progress:x.progressSummary
            }));
            if(x.summary.invalidPositions||x.summary.physicsStepViolations||
               x.summary.corruptedPlans||x.summary.unboundedManeuverAttempts||
               x.summary.exceptions)throw Error('D3.17E real-physics regression '+site);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d317e-four-exact-physical
          path: ${{ runner.temp }}/d317e-*.json
          retention-days: 90
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - name: Historical 11-site body truth
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --progress --route-quality --d329-cancellation-door-witness > "$RUNNER_TEMP/d317e-history.json"
      - name: Frozen tenth 22-site physical truth and actual route-search cost
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --d315b4-blind22 --progress --route-quality \
            --route-transitions --d329-cancellation-door-witness \
            --trace-cases=13919313:entry:ash,14136777:entry:ash,14462973:authored:ash \
            > "$RUNNER_TEMP/d317e-frozen.json"
      - name: A8 independent real-body, event-matched locked-door and recovered-loop truth
        run: |
          # 80 historic arrivals would require passing through twelve
          # event-verified LOCKED doors. This test demands 76 true
          # arrivals, 12 authentic locked cancellations, ZERO pending,
          # full physical collision and route-search limits instead.
          node scripts/verification/ci-a8-physical-acceptance.mjs \
            historical11 "$RUNNER_TEMP/d317e-history.json"
          # Frozen D3.15B4 is a DIFFERENT 176-body cohort. Preserve all
          # 22 real locks, eight unplanned outcomes and zero pending,
          # require 146 real arrivals / 31 complete squads, and demand
          # event-by-event evidence that its one flagged loop RECOVERED.
          # A real unarrived loop, a new lock, route or 0.3u step breach
          # still fails this independent job.
          node scripts/verification/ci-a8-physical-acceptance.mjs \
            frozen22 "$RUNNER_TEMP/d317e-frozen.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d317e-physical-performance
          path: ${{ runner.temp }}/d317e-*.json
          retention-days: 90
