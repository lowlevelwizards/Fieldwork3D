name: D15.5F captive transport presentation critical
on:
  push:
    branches: [release/d15-5f-presentation-critical-20261120]
    paths:
      - '.github/workflows/d15-5f-captive-presentation-validation.yml'
      - 'src/**'
      - 'tests/dispatch-d15*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d15-5f-captive-presentation
  cancel-in-progress: true
jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - name: Live GO custody, physical body and replay visual invariants
        run: |
          node --experimental-strip-types --test \
            tests/dispatch-d15-capture-transport-presentation.test.mjs \
            tests/dispatch-d15-capture-transport-eligibility.test.mjs \
            tests/dispatch-d15-capture-transport-go.test.mjs \
            tests/dispatch-d15-suspect-escort-go.test.mjs \
            tests/civilian-r2-transport-replay.test.mjs \
            tests/civilian-r2-presentation.test.mjs \
            tests/equipment-22-07-transport.test.mjs
      - name: Render anatomy and M3/M4 doorway carry regression
        run: |
          node --experimental-strip-types --test \
            tests/breach-156.test.mjs \
            tests/package-b6-frame-body-output.test.mjs \
            tests/eqa3-16j-npc-lab.test.mjs \
            tests/movement-m3-door-lifecycle.test.mjs \
            tests/movement-m4-queue-formation.test.mjs
      - name: Exact tactical Pages preflight
        run: |
          node --experimental-strip-types --test \
            tests/breach-roadmap2-stage1-contracts.test.mjs \
            tests/passage-q5-approaches.test.mjs \
            tests/animation-a3-10-close-stack-fire.test.mjs \
            tests/animation-a3-11-progressive-urgency.test.mjs \
            tests/fog-exterior-unseen-apertures-regression.test.mjs \
            tests/operator-studio-main-menu.test.mjs \
            tests/performance-p8-replay-memory.test.mjs
      - name: TypeScript, production build and Pages stamp
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/fieldwork-build.json
