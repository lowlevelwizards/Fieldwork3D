name: EA enemy AI foundation critical
on:
  push:
    branches: [feature/ea-enemy-ai-consolidation-20261126]
    paths:
      - 'src/breach-ai-*.ts'
      - 'src/breach-enemy-decision-controller.ts'
      - 'src/breach-awareness.ts'
      - 'src/breach-defense.ts'
      - 'src/breach-ai-site-index.ts'
      - 'tests/ea-*.test.mjs'
      - 'scripts/audit-ea0-enemy-baseline.mjs'
      - '.github/workflows/ea-foundation-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ea-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Foundation regressions
        run: |
          npm run check
          node --experimental-strip-types --test tests/ea-foundation.test.mjs tests/awareness-ai-policy.test.mjs tests/breach-roadmap4-ai-reconciliation.test.mjs tests/breach-roadmap2-stage9-enemy-ai.test.mjs tests/breach-ai-work-scheduler-performance.test.mjs tests/breach-perception-cache-performance.test.mjs tests/performance-p2-8-cover-los.test.mjs
      - uses: actions/checkout@v4
        with:
          ref: d5b195275c7311ef72dc7fac3adcdd33133d3e4b
          path: ea-base
      - name: Capture frozen base and candidate with identical read-only harness
        run: |
          mkdir -p artifacts/ea
          cp scripts/audit-ea0-enemy-baseline.mjs ea-base/scripts/
          ln -s "$PWD/node_modules" ea-base/node_modules
          set +e
          (cd ea-base && EA_REVISION=d5b195275c7311ef72dc7fac3adcdd33133d3e4b EA_OUTPUT="$GITHUB_WORKSPACE/artifacts/ea/base.json" node --experimental-strip-types scripts/audit-ea0-enemy-baseline.mjs)
          base_status=$?
          EA_REVISION="$GITHUB_SHA" EA_OUTPUT=artifacts/ea/candidate.json node --experimental-strip-types scripts/audit-ea0-enemy-baseline.mjs
          candidate_status=$?
          echo "baseline exit=$base_status candidate exit=$candidate_status"
          test "$base_status" -eq 0 && test "$candidate_status" -eq 0
      - name: Verify generated scenario parity against exact EA base
        run: |
          (cd ea-base && node --experimental-strip-types scripts/audit-release-c11-missions.mjs ../artifacts/ea/base-world.json)
          node --experimental-strip-types scripts/audit-release-c11-missions.mjs artifacts/ea/candidate-world.json
          node scripts/compare-release-c11-missions.mjs artifacts/ea/base-world.json artifacts/ea/candidate-world.json artifacts/ea/world-delta.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ea-foundation-comparison
          path: artifacts/ea/*.json
          if-no-files-found: warn
