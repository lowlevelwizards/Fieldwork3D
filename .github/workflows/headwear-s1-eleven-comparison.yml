name: S1 eleven-headgear visual comparison (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/headwear-s1-eleven-comparison.mjs
      - .github/workflows/headwear-s1-eleven-comparison.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: headwear-s1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matched-studio-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Studio dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture all 11 headgear choices with matched cameras
        run: node scripts/headwear-s1-eleven-comparison.mjs
        env:
          HEADWEAR_S1_CAPTURE_DIR: headwear-s1-eleven-captures
      - name: Keep all 44 in-game Studio images and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headwear-s1-eleven-choice-44-matched-views
          path: headwear-s1-eleven-captures/
          if-no-files-found: error
          retention-days: 14
