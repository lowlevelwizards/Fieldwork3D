name: Operation Visual Audit
on:
  pull_request:
    paths:
      - 'src/operation-*.ts'
      - 'operation.html'
      - 'src/vegetation-*.ts'
      - 'src/terrain-model.ts'
      - 'scripts/capture-operation.mjs'
      - '.github/workflows/operation-visual-audit.yml'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-operation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldwork-operation-mobile-captures
          path: operation-captures/
          if-no-files-found: ignore
          retention-days: 14
