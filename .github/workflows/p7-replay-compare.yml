name: P7-B same-runner replay comparison
on:
  pull_request:
    paths:
      - '.github/workflows/p7-replay-compare.yml'
      - 'src/breach-replay-sharing.ts'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 19cb77e1590226104d0c79bbf804405847ade45b
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install each revision independently
        run: |
          (cd baseline && npm install --no-audit --no-fund)
          (cd candidate && npm install --no-audit --no-fund)
      - name: Compare identical simulation and replay workloads
        run: |
          (cd baseline && node --experimental-strip-types scripts/bench-breach-performance.mjs) > baseline.log
          (cd candidate && node --experimental-strip-types scripts/bench-breach-performance.mjs) > candidate.log
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const parse=file=>readFileSync(file,'utf8').split('\n')
            .filter(line=>line.startsWith('COMBAT {')||line.startsWith('SIMULATION {'))
            .map(line=>JSON.parse(line.slice(line.indexOf('{'))));
          const base=parse('baseline.log'),next=parse('candidate.log');
          if(base.length!==next.length||!base.length)throw Error('Mismatched benchmark cases');
          for(let i=0;i<base.length;i++){
            const a=base[i],b=next[i];
            console.log((a.seed??'combat')+'/'+(a.scale??'legacy')+
              ' record='+!!a.record+' | P7A avg='+a.sim.avg+
              'ms P7B avg='+b.sim.avg+'ms ratio='+
              (b.sim.avg/a.sim.avg).toFixed(2)+'x | P7A p95='+
              a.sim.p95+' P7B p95='+b.sim.p95+
              ' | P7A max='+a.sim.max+' P7B max='+b.sim.max);
          }
          NODE
