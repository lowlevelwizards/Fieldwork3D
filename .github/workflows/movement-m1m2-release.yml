name: Movement M1-M2 final physical release acceptance
on:
  push:
    branches: [release/movement-m1m2-20261120]
    paths:
      - '.github/workflows/movement-m1m2-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: movement-m1m2-final-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - name: Exact-head focused M1 M2, R1, and physical contracts
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/movement-m1-quality-survey.test.mjs \
            tests/movement-m2-recovery-ownership.test.mjs \
            tests/movement-m2-entry-squeeze.test.mjs \
            tests/release-d3-r1-entry-lead.test.mjs \
            tests/release-d3-r1-committed-progress.test.mjs \
            tests/release-d3-r1-route-adoption.test.mjs \
            tests/release-d3-r1-repeated-passage.test.mjs \
            tests/release-d3-r1-passage-feedback.test.mjs \
            tests/release-d3-r1-door-topology.test.mjs \
            tests/release-d3-r1-frame-actor-recovery.test.mjs \
            tests/passage-q2-coordinator.test.mjs \
            tests/breach-roadmap2-stage2-physical-integrity.test.mjs
          npm run build
          test -s dist/index.html
          test -s dist/fieldwork-build.json
      - name: Q5 strict real-motor full door range (55 passages, 15 expected blocks)
        run: node --experimental-strip-types scripts/audit-passage-q5.mjs --extended --strict
      - name: Historical 11-site physical locked-door truth
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --d329-cancellation-door-witness --progress --route-quality > "$RUNNER_TEMP/m1m2-historical11.json"
          node scripts/verify-d3-30-mainline.mjs "$RUNNER_TEMP/m1m2-historical11.json"
      - name: Independent 22-map 176-operator physical holdout
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 22 2700 --d318-fresh22 --d329-cancellation-door-witness --progress --route-quality > "$RUNNER_TEMP/m1m2-fresh22.json"
          node scripts/report-d3-29-terminal-cancellations.mjs "$RUNNER_TEMP/m1m2-fresh22.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movement-m1m2-release-physical-evidence
          path: ${{ runner.temp }}/m1m2-*.json
          retention-days: 30
