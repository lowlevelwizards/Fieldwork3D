name: Fieldwork after-action acceptance
on:
  workflow_call:
    inputs:
      lanes:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      lane:
        description: After-action acceptance lane
        required: true
        type: choice
        default: debriefV5
        options:
          - all
          - debriefV41
          - debriefV42
          - debriefV43
          - debriefV44
          - debriefV45
          - debriefV5
permissions:
  contents: read
concurrency:
  group: after-action-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  navigation-and-browser:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.lane == 'all' || inputs.lane == 'debriefV41')) || (github.event_name != 'workflow_dispatch' && fromJSON(inputs.lanes).debriefV41) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Compile / typecheck
        run: npm run check
      - name: Replay and after-action regression suite
        run: |
          node --experimental-strip-types --test \
            tests/after-action-v4-stage1-navigation.test.mjs \
            tests/breach-after-action-v2-evidence.test.mjs \
            tests/breach-after-action-v2-scoped-replay.test.mjs \
            tests/consolidation-stage3-app-flow.test.mjs \
            tests/replay-library-controller-step4.test.mjs \
            tests/consolidation-stage5-replay-presentation.test.mjs
      - name: Install browser driver without re-downloading Chrome
        run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Four viewport debrief return and operator record acceptance
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/smoke-after-action-v3.mjs
      - name: Attach browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-action-v4-stage1-viewport-evidence
          path: artifacts/after-action-v3/
          if-no-files-found: warn
          retention-days: 14

  summary-and-squad:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.lane == 'all' || inputs.lane == 'debriefV42')) || (github.event_name != 'workflow_dispatch' && fromJSON(inputs.lanes).debriefV42) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Compile and check static typing
        run: npm run check
      - name: Mission debrief and replay regression suite
        run: |
          node --experimental-strip-types --test \
            tests/after-action-v4-stage2-hierarchy.test.mjs \
            tests/after-action-v4-stage1-navigation.test.mjs \
            tests/breach-after-action-v2-evidence.test.mjs \
            tests/breach-after-action-v2-scoped-replay.test.mjs \
            tests/consolidation-stage3-app-flow.test.mjs \
            tests/replay-library-controller-step4.test.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium driver (system Chrome)
        run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Summary, ranking, operator inspection and replay return on four viewports
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/smoke-after-action-v3.mjs
      - name: Retain viewport captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-action-v4-stage2-viewport-evidence
          path: artifacts/after-action-v3/
          if-no-files-found: warn
          retention-days: 14

  retained-models:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.lane == 'all' || inputs.lane == 'debriefV43')) || (github.event_name != 'workflow_dispatch' && fromJSON(inputs.lanes).debriefV43) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Compile and typecheck
        run: npm run check
      - name: Stage 3, Stage 2, Stage 1 and replay regression suite
        run: |
          node --experimental-strip-types --test \
            tests/after-action-v4-stage3-persistent-models.test.mjs \
            tests/after-action-v4-stage2-hierarchy.test.mjs \
            tests/after-action-v4-stage1-navigation.test.mjs \
            tests/breach-after-action-v2-evidence.test.mjs \
            tests/breach-after-action-v2-scoped-replay.test.mjs \
            tests/consolidation-stage3-app-flow.test.mjs \
            tests/replay-library-controller-step4.test.mjs
      - name: Production build
        run: npm run build
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Four viewport authentic WebGL and retained renderer acceptance
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/smoke-after-action-v4-stage3.mjs
      - name: Capture 3D viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-action-v4-stage3-webgl-captures
          path: artifacts/after-action-v4-stage3/
          if-no-files-found: warn
          retention-days: 14

  forensic:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.lane == 'all' || inputs.lane == 'debriefV44')) || (github.event_name != 'workflow_dispatch' && fromJSON(inputs.lanes).debriefV44) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run check
      - name: Forensic, stage 1-3, archive, and combat regression suite
        run: |
          node --experimental-strip-types --test \
            tests/after-action-v4-stage4-forensic.test.mjs \
            tests/after-action-v4-stage3-persistent-models.test.mjs \
            tests/after-action-v4-stage2-hierarchy.test.mjs \
            tests/after-action-v4-stage1-navigation.test.mjs \
            tests/breach-after-action-v2-evidence.test.mjs \
            tests/breach-after-action-v2-scoped-replay.test.mjs \
            tests/replay-r3-archive.test.mjs \
            tests/replay-r3-portable.test.mjs \
            tests/consolidation-stage3-app-flow.test.mjs
      - name: Production bundle
        run: npm run build
      - name: Browser driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Forensic 2D/3D parity on four browser viewports
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/smoke-after-action-v4-stage4.mjs
      - name: Save forensic evidence captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-action-v4-stage4-forensic
          path: artifacts/after-action-v4-stage4/
          if-no-files-found: warn
          retention-days: 14

  mission-investigation:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.lane == 'all' || inputs.lane == 'debriefV45')) || (github.event_name != 'workflow_dispatch' && fromJSON(inputs.lanes).debriefV45) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript and architecture contract
        run: npm run check
      - name: Stage 5, Stage 4, Stage 3 and navigation regression suite
        run: |
          node --experimental-strip-types --test \
            tests/after-action-v4-stage5-timeline.test.mjs \
            tests/after-action-v4-stage4-forensic.test.mjs \
            tests/after-action-v4-stage3-persistent-models.test.mjs \
            tests/after-action-v4-stage2-hierarchy.test.mjs \
            tests/after-action-v4-stage1-navigation.test.mjs \
            tests/breach-after-action-v2-evidence.test.mjs \
            tests/breach-after-action-v2-scoped-replay.test.mjs \
            tests/replay-r3-archive.test.mjs \
            tests/consolidation-stage3-app-flow.test.mjs
      - name: Production build
        run: npm run build
      - name: Install browser driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Stage 5 structured Details and lossless timeline across four viewports
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/smoke-after-action-v4-stage5.mjs
      - name: Capture investigation sheet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-action-v4-stage5-investigation
          path: artifacts/after-action-v4-stage5/
          if-no-files-found: warn
          retention-days: 14

  browser-smoke:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.lane == 'all' || inputs.lane == 'debriefV5')) || (github.event_name != 'workflow_dispatch' && fromJSON(inputs.lanes).debriefV5) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: V5 and existing essential regressions
        run: |
          node --experimental-strip-types --test \
            tests/after-action-v5-*.test.mjs \
            tests/after-action-v6-*.test.mjs \
            tests/after-action-v4-stage1-navigation.test.mjs \
            tests/after-action-v4-stage2-hierarchy.test.mjs \
            tests/after-action-v4-stage4-forensic.test.mjs \
            tests/after-action-v4-stage5-timeline.test.mjs
      - name: Browser driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: V5 compact browser journey on three viewports
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/smoke-after-action-v5.mjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: after-action-v5-browser-evidence
          path: artifacts/after-action-v5/
          if-no-files-found: warn
          retention-days: 14

