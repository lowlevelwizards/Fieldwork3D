name: D3.10A retail squad near-goal diagnostic
on:
  pull_request:
    branches: [feature/d3-2-r2-physical-hinge-body-recovery-20261114]
    paths:
      - scripts/audit-d3-10a-retail-vale.mjs
      - src/breach-entry-lanes.ts
      - src/breach-game.ts
      - .github/workflows/d3-10a-retail-quick.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-10a-retail-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Diagnose real physical retail formation
        run: |
          node --experimental-strip-types scripts/audit-d3-10a-retail-vale.mjs > "$RUNNER_TEMP/retail.json"
          node -e '
            const r=require(process.argv[1]);
            console.log("RETAIL SQUAD",JSON.stringify({initial:r.initial,
              observations:r.observations.filter(o=>[6,8,10,12,14,16,18,20,24,30,40,44].includes(o.t)).map(o=>({t:o.t,squad:o.squad})),
              nearCover:r.nearCover,nearWalls:r.nearWalls,nearestDoors:r.nearestDoors},null,2));
          ' "$RUNNER_TEMP/retail.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-10a-retail-squad-witness
          path: ${{ runner.temp }}/retail.json
          if-no-files-found: ignore
