name: Arsenal A1 factory baseline (feature branch)
on:
  push:
    branches: [feat/arsenal-a1-visual-baseline]
    paths:
      - 'scripts/audit-arsenal-a1.mjs'
      - 'scripts/capture-arsenal-a1.mjs'
      - 'arsenal-a1-capture.html'
      - 'src/arsenal/a1-capture.ts'
      - 'tests/arsenal-a1-baseline.test.mjs'
      - 'tests/visual-foundation-f5-arsenal-parity.test.mjs'
      - 'tests/rendering-r7-light-lab.test.mjs'
      - 'package.json'
      - '.github/workflows/arsenal-a1-baseline.yml'
  workflow_dispatch:
jobs:
  arsenal-a1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Focused material and art baseline tests
        run: node --experimental-strip-types --test tests/arsenal-a1-baseline.test.mjs tests/visual-foundation-f5-arsenal-parity.test.mjs tests/rendering-r7-light-lab.test.mjs tests/weapon-fnc-p30-front-sight-inset.test.mjs
      - name: Static typecheck
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Generate complete factory inventory
        run: npm run audit:arsenal-a1
      - name: Install browser capture dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture all current factory models in four fixed views
        run: node --experimental-strip-types scripts/capture-arsenal-a1.mjs
      - name: Upload reviewable visual baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-a1-factory-baseline
          path: |
            reports/arsenal-a1-manifest.json
            reports/arsenal-a1-contact-sheet.png
          if-no-files-found: ignore
          retention-days: 21
