name: Visual Armory V1 model cards critical
on:
  pull_request:
    paths:
      - 'src/equipment-preview.ts'
      - 'src/campaign-ui.ts'
      - 'src/campaign-style.css'
      - 'src/ui/campaign-gear-picker.ts'
      - 'src/ui/field-gadget-editor.ts'
      - 'src/ui/loadout-prep.css'
      - 'scripts/smoke-visual-armory-v1.mjs'
      - '.github/workflows/visual-armory-v1-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Critical TypeScript
        run: npm run check
      - name: Real equipment and placement authority
        run: >-
          node --experimental-strip-types --test
          tests/equipment-visual-inspection.test.mjs
          tests/equipment-physical-board.test.mjs
          tests/equipment-field-transfer.test.mjs
      - name: Actual mobile rendered models
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/smoke-visual-armory-v1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-armory-3d-phone-previews
          path: visual-armory-captures/
          if-no-files-found: ignore
