name: D3.14A read-only three-loop cause classification
on:
  pull_request:
    paths:
      - .github/workflows/d3-14a-three-incident-witness.yml
      - docs/d3-14a-unseen-loop-triage-20261115.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-incident-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Housekeeping — original fifth holdout manifest and test harness
        run: |
          node --experimental-strip-types --test tests/release-d3-13g2-swept-rejoin.test.mjs
          mkdir -p "$RUNNER_TEMP/d3-14a"
      - name: Townhouse standard entry Vale — D9 persistent squeeze
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --site-index=1 --audit-seed=5532875 --audit-scale=standard \
            --progress --route-quality --route-transitions \
            --trace-actor=vale --trace-mode=entry \
            > "$RUNNER_TEMP/d3-14a/townhouse-entry-vale.json"
      - name: P0 D9 Vale — bounded real squeeze-step route rejoin feasibility
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --site-index=1 --audit-seed=5532875 --audit-scale=standard \
            --d314b-clearance-probe --progress \
            > "$RUNNER_TEMP/d3-14a/d9-vale-clearance.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+
            '/d3-14a/d9-vale-clearance.json','utf8'));
          const mode=report.rows[0].modes.find(m=>m.mode==='entry');
          console.log('D314B_VALE_CLEARANCE',JSON.stringify(
            mode.d314bClearanceEvidence));
          if(!mode.d314bClearanceEvidence||report.summary.exceptions||
             report.summary.physicsStepViolations||report.summary.corruptedPlans)
            throw Error('invalid read-only clearance witness');
          NODE
      - name: Townhouse small authored Rook — FRONT oscillating route
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --site-index=1 --audit-seed=5386234 --audit-scale=small \
            --progress --route-quality --route-transitions \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/d3-14a/townhouse-authored-rook.json"
      - name: Retail small authored Rook — D2 outside-leaf ownership
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --site-index=3 --audit-seed=5412896 --audit-scale=small \
            --progress --route-quality --route-transitions \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/d3-14a/retail-authored-rook.json"
      - name: Report selected actor route sources, progress and actual physics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=process.env.RUNNER_TEMP+'/d3-14a/';
          const cases=[
            ['townhouse-entry-vale','entry','vale',5532875],
            ['townhouse-authored-rook','authored','rook',5386234],
            ['retail-authored-rook','authored','rook',5412896]
          ];
          const report=[];
          for(const [file,modeName,actorId,seed] of cases){
            const d=JSON.parse(fs.readFileSync(root+file+'.json','utf8'));
            if(d.rows.length!==1||d.rows[0].seed!==seed)
              throw Error('unexpected map or seed '+file);
            const m=d.rows[0].modes.find(x=>x.mode===modeName);
            const a=m.operators.find(x=>x.id===actorId);
            const progress=m.progressEvidence.filter(x=>x.actor===actorId);
            const witness=m.routeTransitions;
            if(!a||!witness)throw Error('missing actor or witness '+file);
            const bySource=Object.fromEntries(Object.entries(witness.byActor)
              .filter(([k])=>k.startsWith(actorId+':')));
            const rejections=Object.fromEntries(
              Object.entries(witness.rejectsByActor??{})
                .filter(([k])=>k.startsWith(actorId+':')));
            const row={file,seed,mode:modeName,actor:actorId,
              arrived:a.arrived,remaining:a.remaining,
              goal:a.goal,position:a.position,
              blocker:a.lastBlocker,doorEpisode:a.doorEpisode,
              squeezeSeconds:m.squeezeSeconds,
              progress,bySource,rejections,
              escapeReacquirePairs:witness.pairsByActor?.[actorId]??0,
              traceTruncated:witness.events.length>=600,
              first:witness.events.slice(0,6),
              last:witness.events.slice(-6),
              physicsViolations:m.physicsStepViolations};
            report.push(row);
            console.log('D314A_LOOP_WITNESS',JSON.stringify(row));
          }
          const physics=report.reduce((v,x)=>v+x.physicsViolations,0);
          const dump=root+'triage.json';
          fs.writeFileSync(dump,JSON.stringify(report,null,2)+'\n');
          if(physics||report.some(x=>!Number.isFinite(x.remaining)))
            throw Error('read-only audit failed physical safety');
          NODE
      - name: Save full real-session incident traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-14a-three-unseen-loop-sources
          path: ${{ runner.temp }}/d3-14a/*.json
          retention-days: 90
