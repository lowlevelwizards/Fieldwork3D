name: D3.16A forensic 88-operator physical vs logical truth
on:
  pull_request:
    paths:
      - '.github/workflows/d3-16a-historical-truth.yml'
      - 'scripts/audit-r7-squad-execution.mjs'
      - 'src/breach-order-lifecycle.ts'
      - 'src/breach-execution-state.ts'
      - 'src/breach-order-outcome.ts'
      - 'tests/release-d3-16a-honest-order-outcomes.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Typecheck and critical order lifecycle, status and new truth contracts
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/release-d3-16a-honest-order-outcomes.test.mjs \
            tests/breach-roadmap2-stage8-orders.test.mjs \
            tests/tactical-integration-13-execution-status.test.mjs \
            tests/release7-mobile-clarity.test.mjs
      - name: Exact historical baseline 11 sites 2 modes 4 actors x 2700 real ticks
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --progress > "$RUNNER_TEMP/d316a-historical.json"
      - name: Print every physical non-arrival with cancelled orders and final gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d316a-historical.json','utf8'));
          for(const site of r.rows)for(const mode of site.modes){
            const nonarrival=mode.operators.filter(x=>!x.arrived);
            if(!nonarrival.length)continue;
            console.log('D316A_CASE',JSON.stringify({
              archetype:site.archetype,seed:site.seed,scale:site.scale,
              mode:mode.mode,arrivals:mode.arrivals,complete:mode.complete,
              orderCancelledEvents:mode.orderCancelledEvents,
              operators:nonarrival,doors:mode.endDoorStates?.filter(x=>
                x.locked||x.heldBy||x.fraction>.1),
              triage:mode.triage,progress:mode.progressEvidence?.slice(-10)
            }));
          }
          console.log('D316A_TOTAL',JSON.stringify(r.summary));
          // D3.25H paired exact 88-actor replay on published production main
          // 9249dc70 (2026-11-18) and feature: all 88 operator outcomes,
          // cancellations and every summary truth field were identical.
          // Current main is 81 arrivals, 22 logically completed fours,
          // 18 physically successful fours, 7 cancellations, ZERO pending.
          // Preserve every strict physical/truth invariant, including
          // 0 arrived despite cancellation and no drained-unreached orders.
          if(r.summary.physicalArrivals!==81||
             r.summary.physicalCompletedFour!==18||
             r.summary.completedFour!==22||
             r.summary.successfulFour!==18||
             r.summary.terminallyCancelledOrders!==7||
             r.summary.cancelledOperators!==7||
             r.summary.cancelledAndNotArrived!==7||
             r.summary.arrivedDespiteCancellation!==0||
             r.summary.physicallyPendingOperators!==0||
             r.summary.unreachedDrainedOperators!==0)
            throw Error('D3.16A historical terminal truth disagrees with real 88-actor physics');
          if(r.rows.flatMap(x=>x.modes).some(m=>
             m.successful&&(m.operators.some(o=>o.failedOrders||!o.arrived||o.remainingOrders))))
            throw Error('false physically successful four-person order result');

          if(r.summary.exceptions||r.summary.invalidPositions||
             r.summary.corruptedPlans||r.summary.physicsStepViolations)
             throw Error('invalid physical historical corpus');
          NODE
      - name: Preserve entire actual 60Hz physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d316a-historical-mismatch-evidence
          path: ${{ runner.temp }}/d316a-historical.json
          retention-days: 90
