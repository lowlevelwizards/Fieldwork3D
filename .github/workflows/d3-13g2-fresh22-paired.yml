name: D3.13G2 fourth independent 22-map paired acceptance
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: d3-13g2-fresh22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-versus-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Candidate code (unmerged pull request head)
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Unchanged movement baseline from PR target
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || '0d69bf139a5b8a4c6e0a7be923547ff67d39f7f4' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use identical read-only 22-map observation harness
        run: |
          cp candidate/scripts/audit-r7-squad-execution.mjs baseline/scripts/audit-r7-squad-execution.mjs
          cp candidate/scripts/lib/d3-13g2-fresh-22-manifest.mjs baseline/scripts/lib/d3-13g2-fresh-22-manifest.mjs
          npm --prefix baseline install --no-audit --no-fund
          npm --prefix candidate install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/d3-13g2"
      - name: Unchanged baseline · 22 new maps × 2 modes × four operators × 45s
        run: |
          cd baseline
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --g2-fresh-22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-13g2/baseline.json"
      - name: G2C candidate · identical 22 maps, orders and physics
        run: |
          cd candidate
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --g2-fresh-22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-13g2/candidate.json"
      - name: Compare all fresh cases and enforce physical no-regression
        run: |
          cd candidate
          node scripts/report-d3-13g2-fresh22.mjs \
            "$RUNNER_TEMP/d3-13g2/baseline.json" \
            "$RUNNER_TEMP/d3-13g2/candidate.json"
      - name: Retain both raw simulations and full case-by-case comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-13g2-fourth-fresh22-paired
          path: ${{ runner.temp }}/d3-13g2/*.json
          if-no-files-found: ignore
          retention-days: 90
