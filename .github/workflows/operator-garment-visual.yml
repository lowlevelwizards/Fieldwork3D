name: Operator Garments — Critical Silhouette Captures
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  garment-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps chromium
      - name: Mobile Operator Studio appearance and local save smoke
        run: node scripts/smoke-operator-studio.mjs
      - run: node scripts/capture-operator-garment-5.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-garments-5-visual-review
          path: operator-garment-captures/
          if-no-files-found: ignore
