name: Loadout Bench R1 critical
on:
  pull_request:
    paths:
      - 'src/equipment-thumbnail-color.ts'
      - 'src/equipment-preview.ts'
      - 'src/campaign-ui.ts'
      - 'src/campaign-style.css'
      - 'src/ui/campaign-gear-picker.ts'
      - 'src/ui/field-gadget-editor.ts'
      - 'src/ui/loadout-prep.css'
      - 'scripts/smoke-loadout-bench-r1.mjs'
      - 'tests/equipment-thumbnail-color.test.mjs'
      - '.github/workflows/loadout-bench-r1-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
# Isolate each PR from manual acceptance and cancel obsolete revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Real carry and thumbnail contracts
        run: >-
          node --experimental-strip-types --test
          tests/equipment-thumbnail-color.test.mjs
          tests/equipment-thumbnail-camera.test.mjs
          tests/equipment-field-transfer.test.mjs
          tests/equipment-physical-board.test.mjs
          tests/equipment-visual-inspection.test.mjs
      - name: Phone outfitting bench and model contrast
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/smoke-loadout-bench-r1.mjs
