name: Architecture Roadmap 2 — Critical Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: roadmap2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  critical:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/architecture-roadmap-2-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Seeded simulation, visibility, mobility and extraction contracts
        run: |
          node --experimental-strip-types --test \
            tests/breach-roadmap2-deterministic.test.mjs \
            tests/breach-roadmap2-site-mobility.test.mjs \
            tests/breach-roadmap2-visibility-contract.test.mjs \
            tests/breach-roadmap2-debrief-extraction.test.mjs \
            tests/breach-roadmap2-site-builder.test.mjs \
            tests/breach-roadmap2-door-pressure.test.mjs \
            tests/breach-roadmap2-order-wait.test.mjs \
            tests/breach-physical-interactions-nov8.test.mjs \
            tests/doorway-right-of-way-session.test.mjs \
            tests/breach-fog-visibility.test.mjs \
            tests/breach-runtime-loop-step12.test.mjs
      - name: Typecheck and production artifact
        run: npm run build
      - name: Verify previous Pages release before integrating
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
