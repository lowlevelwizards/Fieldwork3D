name: K1 Training Critical
on:
  pull_request:
    paths:
      - 'src/training/**'
      - 'src/ui/breach-training-*'
      - 'tests/training-k1-*.test.mjs'
      - '.github/workflows/k1-training-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Real-session training site, lifecycle and hit evidence
        run: node --experimental-strip-types --test tests/training-k1-*.test.mjs
