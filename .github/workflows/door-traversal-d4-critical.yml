name: D4 physical support-hand contact critical
on:
  push:
    branches:
      - 'feature/door-traversal-d4-support-grip-*'
  pull_request:
    paths:
      - 'src/breach-door-grip.ts'
      - 'src/breach-operator-animation-controller.ts'
      - 'src/breach-pose-action-state.ts'
      - 'src/breach-3d.ts'
      - 'tests/door-traversal-d4*.test.mjs'
      - '.github/workflows/door-traversal-d4-critical.yml'
  workflow_dispatch:
concurrency:
  group: d4-door-grip-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: D4 grip, pose ownership and physical doorway regressions
        run: |
          node --experimental-strip-types --test tests/door-traversal-d4.test.mjs tests/door-traversal-d4-pose.test.mjs tests/breach-pose-action-state.test.mjs tests/door-traversal-d2.test.mjs tests/door-traversal-d3.test.mjs tests/door-traversal-episode.test.mjs tests/release7-outward-four.test.mjs tests/release7-door-intent.test.mjs tests/doorway-right-of-way-session.test.mjs
      - name: D4 real four-operator door-map diagnostic
        run: node --experimental-strip-types scripts/audit-door-traversal-baseline.mjs 4 900
      - name: TypeScript + production build
        run: npm run build
