name: Operator Pose Workbench — mobile authoring smoke
on:
  pull_request:
    paths:
      - 'pose-workbench.html'
      - 'operator-lab.html'
      - 'src/operator-pose-workbench.ts'
      - 'src/operator-pose-workbench-ui.ts'
      - 'scripts/smoke-pose-workbench.mjs'
      - 'tests/operator-pose-workbench.test.mjs'
      - '.github/workflows/operator-pose-workbench-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/operator-pose-workbench.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-pose-workbench.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pose-workbench-mobile-and-desktop
          path: pose-workbench-captures/
          if-no-files-found: ignore
