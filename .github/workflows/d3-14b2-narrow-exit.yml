name: D3.14B2 bounded physical squeeze-leaf exit acceptance
on:
  pull_request:
    paths:
      - src/breach-squeeze-leaf-exit.ts
      - src/breach-motor-route.ts
      - src/breach-motor-local-detour.ts
      - src/breach-route-transition.ts
      - tests/release-d3-14b2-narrow-leaf-exit.test.mjs
      - .github/workflows/d3-14b2-narrow-exit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-14b2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physically-swept:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Typecheck, first-stage physical bounds and historical GO contracts
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/release-d3-14b2-narrow-leaf-exit.test.mjs \
            tests/release-d3-13g2-swept-rejoin.test.mjs \
            tests/release-d3-13h2-frame-stage.test.mjs \
            tests/release-d3-11d-portal-handoff.test.mjs
      - name: P0 Vale D9 true 60Hz generated entry motor (45 seconds)
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --site-index=1 --audit-seed=5532875 --audit-scale=standard \
            --progress --route-quality --route-transitions \
            --trace-actor=vale --trace-mode=entry \
            > "$RUNNER_TEMP/d314b2-vale.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d314b2-vale.json','utf8'));
          const m=r.rows[0].modes.find(m=>m.mode==='entry');
          const a=m.operators.find(a=>a.id==='vale');
          console.log('D314B2_VALE',JSON.stringify({
            arrivals:m.arrivals,valeRemaining:a.remaining,valeArrived:a.arrived,
            valePosition:a.position,episode:a.doorEpisode,
            source:m.routeTransitions.counts,
            actorSources:Object.fromEntries(Object.entries(m.routeTransitions.byActor)
              .filter(([k])=>k.startsWith('vale:'))),
            stats:r.summary,route:r.routeQualitySummary,progress:r.progressSummary}));
          if(r.summary.exceptions||r.summary.invalidPositions||
             r.summary.corruptedPlans||r.summary.physicsStepViolations||
             r.summary.unboundedManeuverAttempts)
            throw Error('invalid real 60Hz physical movement');
          if(a.remaining>=180.72)
            throw Error('B2 did not improve P0 Vale real physical GO distance');
          NODE
      - name: Historical 11-site fixed 45s motor must preserve released H4
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --progress --route-quality > "$RUNNER_TEMP/d314b2-historical.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d314b2-historical.json','utf8'));
          const s=r.summary,q=r.routeQualitySummary,p=r.progressSummary;
          console.log('D314B2_HISTORICAL',JSON.stringify({
            summary:s,route:q,progress:p}));
          if(s.exceptions||s.invalidPositions||s.corruptedPlans||
             s.physicsStepViolations||s.unboundedManeuverAttempts||
             s.physicalArrivals<80||s.physicalCompletedFour<18||
             s.completedFour<21||s.stallEpisodes>8||s.retries>5||
             p.suspectedLoops||p.sustainedStill||q.searches>2760)
            throw Error('B2 regresses released H4 physical baseline');
          NODE
      - name: Preserve actual P0 and frozen historical physical traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-14b2-narrow-real-motor-and-11-site
          path: ${{ runner.temp }}/d314b2-*.json
          retention-days: 90
