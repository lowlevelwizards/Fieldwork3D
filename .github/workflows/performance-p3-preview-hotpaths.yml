name: Performance P3 preview hotpaths
on:
  pull_request:
    paths:
      - 'src/equipment-preview.ts'
      - 'src/ui/campaign-outfitter-gallery.ts'
      - 'src/campaign-ui.ts'
      - 'src/ui/quick-play-configurator.ts'
      - 'src/breach-operations-board-controller.ts'
      - 'src/arsenal/gallery-main.ts'
      - 'src/arsenal/glock-viewport.ts'
      - 'tests/performance-p3-preview-hotpaths.test.mjs'
      - 'tests/performance-p3-async-thumbnails.test.mjs'
      - '.github/workflows/performance-p3-preview-hotpaths.yml'
  workflow_dispatch:
permissions:
  contents: read
# Isolate each PR from manual acceptance and cancel obsolete revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Equipment and arsenal preview hotpath contracts
        run: >
          node --experimental-strip-types --test
          tests/performance-p3-preview-hotpaths.test.mjs
          tests/performance-p3-async-thumbnails.test.mjs
      - name: Typecheck and production bundle
        run: npm run check && npx vite build
