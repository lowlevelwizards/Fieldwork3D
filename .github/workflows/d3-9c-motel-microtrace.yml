name: D3.9C motel entry oscillation microtrace
on:
  push:
    branches: [feature/d3-9-clean-single-opener-20261114]
    paths:
      - 'scripts/audit-d3-9c-motel.mjs'
      - '.github/workflows/d3-9c-motel-microtrace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Half-second real motor trace
        run: |
          node --experimental-strip-types scripts/audit-d3-9c-motel.mjs > "$RUNNER_TEMP/motel.json"
          node -e 'const x=require(process.argv[1]);console.log("MOTEL MICRO",JSON.stringify({...x,rows:x.rows.filter(r=>r.t>=8&&r.t<=22)}));' "$RUNNER_TEMP/motel.json"
      - name: Preserve full 35 seconds
        uses: actions/upload-artifact@v4
        with:
          name: d3-9c-motel-microtrace
          path: ${{ runner.temp }}/motel.json
