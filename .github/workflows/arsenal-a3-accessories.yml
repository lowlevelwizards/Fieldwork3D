name: Arsenal A3 accessory geometry (feature branch)
on:
  push:
    branches: [feat/arsenal-a3-accessory-unification, fix/arsenal-a3-reflex-forward-facing, fix/arsenal-a3-optic-seating-hk-claw]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a3:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Critical accessory, saved equipment, HK and weapon light regressions
        run: |
          node --experimental-strip-types --test \
            tests/arsenal-a3-accessory-geometry.test.mjs \
            tests/arsenal-a3-reflex-axis.test.mjs \
            tests/arsenal-a3-h3-optic-mount-contact.test.mjs \
            tests/arsenal-a2-material-unification.test.mjs \
            tests/weapon-fnc-p30-front-sight-inset.test.mjs \
            tests/equipment-20-12-weapon-light.test.mjs \
            tests/equipment-19-02-weapon-silhouettes.test.mjs \
            tests/arsenal-v2-assembly.test.mjs
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Inventory nine-platform draw-call and triangle cost
        run: node scripts/audit-arsenal-a3.mjs
      - name: Install Chromium for real WebGL validation
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture nine actual accepted accessory configurations
        run: node scripts/capture-arsenal-a3.mjs
      - name: Upload A3 visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-a3-equipped-visual-review
          path: |
            reports/arsenal-a3-equipped-sheet.png
            reports/arsenal-a3-cost-inventory.json
          if-no-files-found: ignore
          retention-days: 21
