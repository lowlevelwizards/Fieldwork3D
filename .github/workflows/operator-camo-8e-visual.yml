name: Camouflage 8E–9B — Mobile Print Review
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  print-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - name: Install lightweight Chromium capture tooling
        run: |
          npm exec -- playwright install --with-deps chromium
      - name: Fixed-light BDU jacket/trouser views and master thumbnails
        run: |
          if [[ "$GITHUB_HEAD_REF" == feature/operator-camo-9a-9b-* ]]; then
            node scripts/capture-operator-camo-9a-9b.mjs
          elif [[ "$GITHUB_HEAD_REF" == feature/operator-camo-8h-* ]]; then
            node scripts/capture-operator-camo-8h.mjs
          elif [[ "$GITHUB_HEAD_REF" == feature/operator-camo-8g-* ]]; then
            node scripts/capture-operator-camo-8g.mjs
          elif [[ "$GITHUB_HEAD_REF" == feature/operator-camo-8f-* ]]; then
            node scripts/capture-operator-camo-8f.mjs
          else
            node scripts/capture-operator-camo-8e.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-camo-mobile-comparison
          path: |
            operator-8e-camo-comparison/
            operator-8f-camo-comparison/
            operator-8g-m98-density-comparison/
            operator-8h-m98-density-comparison/
            operator-camo-9a-9b-review/
          if-no-files-found: warn
