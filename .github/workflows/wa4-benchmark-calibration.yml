name: WA4 FAL FNC artwork calibration
# Historical stage checkpoint; later stages use their own incremental gate.
on:
  workflow_dispatch:
concurrency:
  group: wa4-benchmark-historical-${{ github.run_id }}
  cancel-in-progress: true
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: a532c644bb6d619eafe5d9e7f1e9e0310417571d
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/wa3-shared-art-vocabulary.test.mjs tests/arsenal-a2-material-unification.test.mjs tests/arsenal-a4-surface-detail.test.mjs tests/weapon-fal-p6-geometry-budget.test.mjs tests/weapon-fnc-p10-stock-finish.test.mjs tests/weapon-fnc-p21-pixel-surfaces.test.mjs tests/wa0-weapon-art-geometry.test.mjs
      - name: Verify color-only scoped delta against WA3
        run: |
          mkdir -p reports/wa4
          git worktree add --detach /tmp/wa3-art 0b136a2cac9406940c9f6022f26f0ae6b61aa272
          ln -s "$PWD/node_modules" /tmp/wa3-art/node_modules
          cp scripts/audit-wa4-art-delta.mjs scripts/capture-weapon-art-baseline.mjs scripts/capture-wa0-operator-context.mjs /tmp/wa3-art/scripts/
          node --experimental-strip-types scripts/audit-wa4-art-delta.mjs reports/wa4/candidate.json
          (cd /tmp/wa3-art && node --experimental-strip-types scripts/audit-wa4-art-delta.mjs "$GITHUB_WORKSPACE/reports/wa4/baseline.json")
          node scripts/verify-wa4-art-delta.mjs reports/wa4/baseline.json reports/wa4/candidate.json reports/wa4/delta.json
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render pinned before and actual candidate
        env:
          WA0_PLATFORMS: fal,fnc,custom-fal,custom-fnc,accessory-samples
          WA0_OPERATOR_IDS: fal-5000,fal-5000-classic,fal-5061,fal-5063,fnc-service
        run: |
          WA0_OUTPUT="$PWD/reports/wa4/after" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs
          WA0_OPERATOR_OUTPUT="$PWD/reports/wa4/after/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs
          (cd /tmp/wa3-art && WA0_OUTPUT="$GITHUB_WORKSPACE/reports/wa4/before" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs)
          (cd /tmp/wa3-art && WA0_OPERATOR_OUTPUT="$GITHUB_WORKSPACE/reports/wa4/before/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs)
          node scripts/verify-wa4-capture-pairs.mjs reports/wa4/before reports/wa4/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa4-benchmark-evidence
          path: reports/wa4/
          if-no-files-found: ignore
