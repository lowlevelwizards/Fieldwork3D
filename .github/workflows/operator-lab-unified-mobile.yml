name: Operator Lab — Unified Poses iPhone smoke
on:
  pull_request:
    paths:
      - 'operator-lab.html'
      - 'src/breach-operator-lab.ts'
      - 'src/operator-lab-pose-browser.ts'
      - 'src/operator-lab-pistol-tracks.ts'
      - 'src/operator-lab-pistol-contacts.ts'
      - 'src/secondary-upper-body-pose.ts'
      - 'src/secondary-holster-visual.ts'
      - 'tests/operator-lab-sidearms.test.mjs'
      - 'scripts/smoke-operator-lab-unified.mjs'
      - '.github/workflows/operator-lab-unified-mobile.yml'
permissions:
  contents: read
jobs:
  unified-poses-mobile:
    if: ${{ startsWith(github.head_ref, 'feature/operator-lab-unified-poses-') || startsWith(github.head_ref, 'feature/breach-stock-contact-authored-transitions-') || startsWith(github.head_ref, 'feature/arsenal-v2-operator-recipes-r9-') || startsWith(github.head_ref, 'feature/arsenal-r13-model-switch-') || startsWith(github.head_ref, 'feature/arsenal-r15-finishes-') || startsWith(github.head_ref, 'feature/operator-lab-sidearms-') || startsWith(github.head_ref, 'fix/operator-lab-pistol-scale-stances-') || startsWith(github.head_ref, 'fix/operator-lab-pistol-poses-grip-rack-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      # Ubuntu GitHub runners already ship Chrome. Reuse it rather than
      # repeatedly downloading Chromium and apt dependencies on each PR.
      # The shared smoke script explicitly supports FIELDWORK_CI_CHROME.
      - run: node --experimental-strip-types --test tests/operator-lab-unified-poses.test.mjs tests/operator-lab-sidearms.test.mjs
      - run: npm run build
      - run: node scripts/smoke-operator-lab-unified.mjs
        env:
          FIELDWORK_CI_CHROME: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-lab-unified-poses-iphone
          path: operator-lab-pose-captures/
          if-no-files-found: ignore
