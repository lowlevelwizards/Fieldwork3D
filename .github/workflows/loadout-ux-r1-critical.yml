name: Loadout UX R1 mobile critical
on:
  workflow_call:
  pull_request:
    branches-ignore: [main]
    paths:
      - 'src/campaign-ui.ts'
      - 'src/campaign-style.css'
      - 'src/ui/field-gadget-editor.ts'
      - 'src/ui/campaign-outfitter-gallery.ts'
      - 'src/ui/outfitter-choice-sources.ts'
      - 'src/ui/outfitter-zone-nav.ts'
      - 'src/ui/quick-play-configurator.ts'
      - 'src/breach-operations-board-controller.ts'
      - 'tests/consolidation-p8-outfitter-zones.test.mjs'
      - 'src/ui/loadout-prep.css'
      - '.github/actions/outfitter-mobile-smoke/action.yml'
      - '.github/workflows/loadout-ux-r1-critical.yml'
      - 'src/equipment-preview.ts'
      - 'src/ui/campaign-gear-picker.ts'
      - 'src/equipment-thumbnail-camera.ts'
      - 'tests/equipment-thumbnail-camera.test.mjs'
      - 'scripts/smoke-loadout-bench-r1.mjs'
      - 'tests/equipment-visual-inspection.test.mjs'
      - 'tests/equipment-physical-board.test.mjs'
      - 'tests/equipment-field-transfer.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
# Isolate each PR from manual acceptance and cancel obsolete revisions.
concurrency:
  group: loadout-ux-r1-critical-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  armory-critical:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Critical TypeScript
        run: npm run check
      - name: Physical carry authority and layout regressions
        run: >-
          node --experimental-strip-types --test
          tests/equipment-field-inventory.test.mjs
          tests/equipment-field-transfer.test.mjs
          tests/equipment-physical-board.test.mjs
          tests/equipment-magazine-transfer.test.mjs
          tests/loadout-magazine-editor-integration.test.mjs
          tests/equipment-visual-inspection.test.mjs
      - name: Shared P8 equipment-zone interaction and owning-screen regressions
        run: >-
          node --experimental-strip-types --test
          tests/consolidation-p8-outfitter-zones.test.mjs
          tests/consolidation-4-to-7-integration.test.mjs
          tests/loadout-quickplay-carry-selector.test.mjs
          tests/loadout-quickplay-preview-integration.test.mjs
          tests/outfitter-gallery-lifecycle.test.mjs
      - name: Retained armory camera bounds
        run: node --experimental-strip-types --test tests/equipment-thumbnail-camera.test.mjs
      - name: Production build
        run: npm run build
      - name: Actual iPhone-sized armory interaction
        uses: ./.github/actions/outfitter-mobile-smoke
