name: EQA3.14 organic encounter critical
on:
  push:
    branches: [feature/eqa3-14-organic-contact-forensics-20261119]
    paths:
      - 'tests/eqa3-14-*.test.mjs'
      - 'src/breach-civilian-response.ts'
      - 'src/breach-civilian-refuge.ts'
      - '.github/workflows/eqa3-14-organic-contacts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  organic-contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: EQA3.14 real encounters plus directly affected prior contracts
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/eqa3-14-organic-contact.test.mjs \
            tests/eqa3-13-changing-threat-route.test.mjs \
            tests/eqa3-13-civilian-heavy-session.test.mjs \
            tests/eqa3-13-operator-civilian-contact.test.mjs \
            tests/eqa3-12-civilian-firefight.test.mjs \
            tests/eqa3-12-refuge-exit.test.mjs \
            tests/performance-p2-7-live-routing.test.mjs
