name: EQA3.1 exact physically paced rescue custody witness
on:
  push:
    branches: [feature/eqa3-1-rescue-escort-pacing-20261118]
    paths:
      - '.github/workflows/eqa3-1-escort-causality.yml'
      - 'src/breach-civilian-mission.ts'
      - 'src/breach-order-movement.ts'
      - 'tests/eqa3-1-rescue-escort-pacing.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-real-rescue:
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 23]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Real 90s rescue person state, FOLLOW, injury and separation timeline
        run: |
          mkdir -p artifacts/eqa3
          EQA3_OUTPUT=artifacts/eqa3/rescue-${{ matrix.seed }}.json node --experimental-strip-types scripts/audit-eqa3-scout.mjs --forensic --seed=${{ matrix.seed }} --intel=confirmed --seconds=90 > artifacts/eqa3/console-${{ matrix.seed }}.txt
          node - <<'NODE'
          const a=require('./artifacts/eqa3/rescue-${{ matrix.seed }}.json');
          console.log(JSON.stringify({summary:a.summary,cases:a.rows.filter(r=>r.mission==='rescue').map(r=>{
           const snaps=r.forensic??[],prior={};
           const transitions=[];
           for(const e of snaps)if(e.person){
            const sig=[e.person.state,e.person.following,e.escort].join('|');
            if(sig!==prior.sig){
             transitions.push({at:e.at,kind:e.type,stage:e.stage,state:e.person.state,
              personHealth:e.person.carrier??null,following:e.person.following,
              distance:e.person.distance,escort:e.escort,player:e.player.p});
             prior.sig=sig;
            }
           }
           return {entry:r.insertion,stage:r.missionStage,completed:r.phase==='won',
            aborts:r.routeAbort,rejected:r.rejected,transitions,
            last:snaps.at(-1)&&{at:snaps.at(-1).at,
             person:snaps.at(-1).person,player:snaps.at(-1).player.p}};
          })},null,2));
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqa3-1-actual-escort-witness-${{ matrix.seed }}
          path: artifacts/eqa3/
