name: Animation A3.1 height-aware teammate safety
on:
  pull_request:
    paths:
      - 'src/breach-friendly-safety-volume.ts'
      - 'src/breach-fire-safety.ts'
      - 'src/breach-weapon-clearance.ts'
      - 'src/breach-firing-pipeline.ts'
      - 'src/breach-shot-resolution.ts'
      - 'src/breach-defense.ts'
      - 'src/breach-enemy-decision-controller.ts'
      - 'src/breach-3d.ts'
      - 'src/a3-physicality-*'
      - 'a3-physicality-lab.html'
      - 'tests/animation-a3-*'
      - 'scripts/audit-animation-a3-1.mjs'
      - 'scripts/smoke-animation-a3-0.mjs'
      - 'docs/animation-a3-1-*'
      - '.github/workflows/animation-a3-1-friendly-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: A3.1 body volumes, actual session and legacy safety
        run: node --experimental-strip-types --test tests/animation-a3-1-friendly-volume.test.mjs tests/animation-a3-0-physicality.test.mjs tests/breach-muzzle-lane-hotfix.test.mjs tests/gameplay-g3-fire-lanes.test.mjs tests/civilian-d2-fire-safety.test.mjs tests/physicality-door-and-glass.test.mjs
      - name: Legacy point-only clearance compatibility (exclude stale C18 entry-motion fixture)
        run: node --experimental-strip-types --test --test-name-pattern='^(?!C18:)' tests/breach-clearing-fire-c.test.mjs
      - name: Existing operator friendly-fire physical recovery regressions
        run: node --experimental-strip-types --test --test-name-pattern='short step-back|ally in lane|real player operator' tests/breach-two-sided-fire-recovery.test.mjs
      - name: A3.1 height-aware seeded current vs legacy performance audit
        run: node --experimental-strip-types scripts/audit-animation-a3-1.mjs --out artifacts/animation-a3-1/height-aware-baseline.json
      - name: TypeScript and production build
        run: npm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-a3-1-safety-report
          path: artifacts/animation-a3-1/
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: A3.1 mobile and desktop actual-session lab
        run: node scripts/smoke-animation-a3-0.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-a3-1-browser-gallery
          path: artifacts/animation-a3-0/gallery/
          if-no-files-found: ignore
