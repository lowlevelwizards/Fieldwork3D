name: Package C — Presentation Ownership Baseline
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/consolidation-package-c-*.md'
      - 'scripts/verification/package-c0-presentation-audit.mjs'
      - 'tests/package-c0-presentation-audit.test.mjs'
      - 'tests/package-c1-scene-lifecycle.test.mjs'
      - 'tests/package-c2-render-composition.test.mjs'
      - 'tests/package-c3-cross-view-disclosure.test.mjs'
      - 'tests/package-c4-tactical-ui-consolidation.test.mjs'
      - 'tests/package-c5-replay-view-ownership.test.mjs'
      - 'src/ui/breach-replay-hud-controller.ts'
      - 'src/ui/breach-replay-timeline-controller.ts'
      - 'src/ui/tactical-command-affordances.ts'
      - 'src/ui/tactical-selection-presentation.ts'
      - 'src/ui/tactical-hud-controller.ts'
      - 'src/ui/tactical-palette-controller.ts'
      - 'src/rendering/breach-site-render-composition.ts'
      - 'src/rendering/breach-fog-mesh-composition.ts'
      - 'src/rendering/site-scene-lifecycle.ts'
      - '.github/workflows/package-c-presentation-baseline.yml'
      - 'src/breach-3d.ts'
      - 'src/breach-main.ts'
      - 'src/breach-2d-*.ts'
      - 'src/breach-fog-*.ts'
      - 'src/breach-world-context.ts'
      - 'src/breach-presentation-world-ownership.ts'
      - 'src/breach-replay-*.ts'
      - 'src/operator-studio*.ts'
      - 'src/breach-operator-lab.ts'
      - 'src/rendering/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-c-presentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/consolidation-c') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for real Three.js lifecycle fixtures
        run: npm install --no-audit --no-fund
      - name: C1 site graph, material lifetime, memory and frame regression
        run: |
          node --experimental-strip-types --test \
            tests/package-c1-scene-lifecycle.test.mjs \
            tests/breach-scene-memory-lifecycle-p6.test.mjs \
            tests/breach-site-material-lifetime.test.mjs \
            tests/breach-scene-frame-p7.test.mjs
      - name: C2 first-paint, site-replacement and fog footprint geometry parity
        run: |
          node --experimental-strip-types --test \
            tests/package-c2-render-composition.test.mjs \
            tests/breach-roadmap2-stage6-site-builder.test.mjs \
            tests/visual-foundation-f1-lighting.test.mjs \
            tests/rendering-r718-parity.test.mjs
      - name: C3 live/replay model visibility and personal-ground cache parity
        run: |
          node --experimental-strip-types --test \
            tests/package-c3-cross-view-disclosure.test.mjs \
            tests/breach-roadmap2-stage3-integration.test.mjs \
            tests/replay-r42c-civilian-sight.test.mjs \
            tests/breach-2d-renderer-extraction.test.mjs
      - name: C4 HUD/palette eligibility, selection and mobile interaction boundaries
        run: |
          node --experimental-strip-types --test \
            tests/package-c4-tactical-ui-consolidation.test.mjs \
            tests/tactical-hud-palette-controller-step7.test.mjs \
            tests/consolidation-a6-main-composition.test.mjs \
            tests/breach-active-watch-marker.test.mjs \
            tests/breach-canvas-gestures.test.mjs
      - name: C5 replay follow, director, historical sight and transport UI
        run: |
          node --experimental-strip-types --test \
            tests/package-c5-replay-view-ownership.test.mjs \
            tests/breach-roadmap2-stage4-replay-hud.test.mjs \
            tests/consolidation-stage5-replay-presentation.test.mjs \
            tests/replay-knowledge-controller-20261109.test.mjs \
            tests/replay-camera-controller-20261109.test.mjs \
            tests/replay-bodycam-controller-20261109.test.mjs
      - name: Validate C0 read-only scene and presentation ownership contracts
        run: node --test tests/package-c0-presentation-audit.test.mjs
      - name: Generate reproducible C0 evidence
        run: |
          node scripts/verification/package-c0-presentation-audit.mjs --check \
            --json artifacts/package-c0/audit.json \
            --markdown artifacts/package-c0/audit.md
      - name: Preserve C0 evidence for later C stages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-c0-presentation-ownership
          path: artifacts/package-c0/
          if-no-files-found: warn
          retention-days: 30
