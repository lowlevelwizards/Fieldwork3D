name: FN FNC P7 continuity and shared-family geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/weapons/geometry/fnc-stage1-blockout.ts'
      - 'src/weapons/geometry/fn-crowned-shell.ts'
      - 'src/weapons/geometry/fal-receiver-form.ts'
      - 'src/weapons/geometry/fnc-silhouettes.ts'
      - 'src/equipment-weapon-families.ts'
      - 'src/equipment-weapon-assemblies.ts'
      - 'src/breach-modular-weapon-geometry.ts'
      - 'src/breach-weapon-contact-zones.ts'
      - 'src/breach-weapon-presentation.ts'
      - 'src/arsenal/catalog.ts'
      - 'src/arsenal/magazine-identities.ts'
      - 'src/arsenal/naming.ts'
      - 'src/operator-carried-magazines.ts'
      - 'src/weapons/geometry/fnc-handguard-profiles.ts'
      - 'src/fnc-stage1-lab.ts'
      - 'fnc-stage1-lab.html'
      - 'tests/weapon-fnc-stage1-blockout.test.mjs'
      - 'tests/weapon-fnc-p2-forms.test.mjs'
      - 'tests/weapon-fnc-p3-style.test.mjs'
      - 'tests/weapon-fnc-p6-silhouette.test.mjs'
      - 'tests/weapon-fnc-p7-integration.test.mjs'
      - 'tests/weapon-fnc-arsenal-live.test.mjs'
      - 'scripts/smoke-fnc-arsenal.mjs'
      - 'vite.config.ts'
      - 'scripts/smoke-fnc-p1-visual.mjs'
      - '.github/workflows/fnc-p1-silhouette.yml'
jobs:
  isolated-fnc-p1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/weapon-fnc-stage1-blockout.test.mjs tests/weapon-fnc-p2-forms.test.mjs tests/weapon-fnc-p3-style.test.mjs tests/weapon-fnc-p6-silhouette.test.mjs tests/weapon-fnc-p7-integration.test.mjs tests/weapon-fnc-arsenal-live.test.mjs tests/weapon-fal-p5-triangle.test.mjs tests/weapon-fal-p6-geometry-budget.test.mjs tests/arsenal-v2-catalog.test.mjs tests/arsenal-v2-catalog.test.mjs
      - run: npm run check
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture five-rifle real WebGL comparison in four views
        run: node scripts/smoke-fnc-p1-visual.mjs
      - name: Render FN FNC Arsenal desktop and mobile Workbench
        run: node scripts/smoke-fnc-arsenal.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnc-p7-family-coherence-review
          path: |
            fnc-p1-captures/
            fnc-arsenal-captures/
          if-no-files-found: ignore
          retention-days: 14
