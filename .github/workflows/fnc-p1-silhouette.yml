name: FNC P2 isolated exterior modeling acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/weapons/geometry/fnc-stage1-blockout.ts'
      - 'src/weapons/geometry/fnc-handguard-profiles.ts'
      - 'src/fnc-stage1-lab.ts'
      - 'fnc-stage1-lab.html'
      - 'tests/weapon-fnc-stage1-blockout.test.mjs'
      - 'tests/weapon-fnc-p2-forms.test.mjs'
      - 'vite.config.ts'
      - 'scripts/smoke-fnc-p1-visual.mjs'
      - '.github/workflows/fnc-p1-silhouette.yml'
jobs:
  isolated-fnc-p1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/weapon-fnc-stage1-blockout.test.mjs tests/weapon-fnc-p2-forms.test.mjs
      - run: npm run check
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture five-rifle real WebGL comparison in four views
        run: node scripts/smoke-fnc-p1-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fnc-p2-exterior-forms-webgl-views
          path: fnc-p1-captures/
          if-no-files-found: ignore
          retention-days: 14
