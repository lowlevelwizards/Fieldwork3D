name: D3.14C2 bounded circular full-body lane recovery
on:
  pull_request:
    paths:
      - src/breach-cycle-lane-recovery.ts
      - src/breach-motor-collision.ts
      - src/breach-route-transition.ts
      - tests/release-d3-14c2-cycle-world-lane.test.mjs
      - .github/workflows/d3-14c2-cycle-lane.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-14c2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physically-swept-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Typecheck and actual first-leg/GO ownership contracts
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/release-d3-14c2-cycle-world-lane.test.mjs \
            tests/release-d3-14b2-narrow-leaf-exit.test.mjs \
            tests/release-d3-11d-portal-handoff.test.mjs
      - name: Exact townhouse FRONT Rook 45s physical-world progress
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --site-index=1 --audit-seed=5386234 --audit-scale=small \
            --progress --route-quality --route-transitions \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/d314c2-front.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d314c2-front.json','utf8'));
          const m=r.rows[0].modes.find(m=>m.mode==='authored');
          const a=m.operators.find(a=>a.id==='rook');
          console.log('D314C2_FRONT',JSON.stringify({
            arrived:a.arrived,remaining:a.remaining,position:a.position,
            episode:a.doorEpisode,
            sources:Object.fromEntries(Object.entries(m.routeTransitions.byActor)
              .filter(([k])=>k.startsWith('rook:'))),
            safety:{exceptions:r.summary.exceptions,
             physics:r.summary.physicsStepViolations,
             corrupt:r.summary.corruptedPlans},route:r.routeQualitySummary}));
          if(r.summary.exceptions||r.summary.invalidPositions||
             r.summary.corruptedPlans||r.summary.physicsStepViolations)
            throw Error('invalid physical movement');
          if(a.remaining>=399.02)
            throw Error('C2 failed to improve actual loop-bound Rook');
          NODE
      - name: Frozen 11-site 88-operator 45s H4/B2 regression gate
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --progress --route-quality > "$RUNNER_TEMP/d314c2-historical.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d314c2-historical.json','utf8'));
          const s=r.summary,p=r.progressSummary,q=r.routeQualitySummary;
          console.log('D314C2_HISTORICAL',JSON.stringify({summary:s,progress:p,route:q}));
          if(s.exceptions||s.invalidPositions||s.corruptedPlans||
             s.physicsStepViolations||s.unboundedManeuverAttempts||
             s.physicalArrivals<80||s.physicalCompletedFour<18||
             s.completedFour<21||s.stallEpisodes>8||s.retries>5||
             p.suspectedLoops||p.sustainedStill||q.searches>2850)
            throw Error('C2 historical movement / physics regression');
          NODE
      - name: Save both real physics traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-14c2-front-and-11-site-45s
          path: ${{ runner.temp }}/d314c2-*.json
          retention-days: 90
