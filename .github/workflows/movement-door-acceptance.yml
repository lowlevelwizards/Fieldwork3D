name: A7 movement and door physical acceptance
on:
  workflow_call:
    inputs:
      lanes:
        description: Source-selected R7, door and independent historical/fresh/frozen physical cohorts
        required: true
        type: string
  workflow_dispatch:
    inputs:
      lanes:
        description: JSON suite selection for manual physical audits
        required: true
        type: string
        default: '{"release7":true,"doorD5":true,"doorD2D3":true,"passageQ5":true,"performanceP28":true,"recovery17e":true,"physical25":true}'
permissions:
  contents: read
jobs:
  release7:
    if: ${{ fromJSON(inputs.lanes).release7 }}
    uses: ./.github/workflows/release7-critical.yml
    permissions:
      contents: read
  door-d5:
    if: ${{ fromJSON(inputs.lanes).doorD5 }}
    uses: ./.github/workflows/door-traversal-d5.yml
    permissions:
      contents: read
  door-d2d3:
    if: ${{ fromJSON(inputs.lanes).doorD2D3 }}
    uses: ./.github/workflows/door-traversal-d2-d3.yml
    permissions:
      contents: read
  passageQ5:
    if: ${{ fromJSON(inputs.lanes).passageQ5 }}
    uses: ./.github/workflows/passage-q5-matrix.yml
    permissions:
      contents: read
  performanceP28:
    if: ${{ fromJSON(inputs.lanes).performanceP28 }}
    uses: ./.github/workflows/performance-p2-8-critical.yml
    permissions:
      contents: read
  recovery17e:
    if: ${{ fromJSON(inputs.lanes).recovery17e }}
    uses: ./.github/workflows/d3-17e-recovery.yml
    permissions:
      contents: read
  physical25:
    if: ${{ fromJSON(inputs.lanes).physical25 }}
    uses: ./.github/workflows/d3-25-physical-acceptance.yml
    permissions:
      contents: read
