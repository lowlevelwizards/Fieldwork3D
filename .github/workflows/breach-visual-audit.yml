name: Breach 052 — Mobile Tactical Audit
# Deep visual audit is opt-in, not a deployment gate for routine changes.
# It requires two browser engines, screenshot captures and long interaction flows.
on:
  workflow_dispatch:
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  mobile-breach:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm install --no-package-lock
      - run: npm exec -- playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Operator Lab first-frame startup (Chromium and WebKit)
        run: node scripts/smoke-operator-lab.mjs
      - run: node scripts/capture-breach.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldwork-breach-052
          path: breach-052-captures/
          if-no-files-found: ignore
          retention-days: 14
