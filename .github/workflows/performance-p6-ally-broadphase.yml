name: Performance P6.H local ally context
on:
  pull_request:
    paths:
      - 'src/breach-actor-neighborhood.ts'
      - 'src/breach-3d.ts'
      - 'tests/performance-p6-local-ally-broadphase.test.mjs'
      - '.github/workflows/performance-p6-ally-broadphase.yml'
  workflow_dispatch:
permissions:
  contents: read
# Isolate each PR from manual acceptance and cancel obsolete revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Seeded 16/88/180 actor, exact safety and existing E6.5 parity
        run: >-
          node --experimental-strip-types --test
          tests/performance-p6-local-ally-broadphase.test.mjs
          tests/refactor-e6-5-ally-context.test.mjs
          tests/performance-p6-frame-indices.test.mjs
      - name: Diagnostic baseline versus indexed peer scan at 4/16/32/88/180 actors
        run: node --experimental-strip-types scripts/verification/performance-p6-ally-broadphase-bench.mjs
      - name: Typecheck and production bundle
        run: npm run check && npx vite build
