name: A3.2-A3.4 contact-aware fire and footwork release gate
on:
  pull_request:
    paths:
      - 'src/breach-physical-micro-aim.ts'
      - 'src/breach-contextual-crouch.ts'
      - 'src/breach-combat-reactions.ts'
      - 'src/breach-firing-pipeline.ts'
      - 'src/breach-shot-resolution.ts'
      - 'src/breach-muzzle.ts'
      - 'src/breach-weapon-pose.ts'
      - 'src/breach-game.ts'
      - 'src/breach-3d.ts'
      - 'src/breach-replay.ts'
      - 'src/breach-operator-animation-*'
      - 'src/breach-actor-initial-state.ts'
      - 'src/breach-tactical-control-commands.ts'
      - 'src/breach-order-movement.ts'
      - 'src/a3-physicality-*'
      - 'a3-physicality-lab.html'
      - 'tests/animation-a3-*'
      - 'tests/breach-two-sided-fire-recovery.test.mjs'
      - 'docs/animation-a3-*'
      - '.github/workflows/animation-a3-2-4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Stage 2 — Canonical aim/hand/weapon and deterministic safety
        run: node --experimental-strip-types --test tests/animation-a3-2-micro-aim.test.mjs tests/animation-a3-1-friendly-volume.test.mjs
      - name: Stage 3 — Physical contextual stance and authored policy
        run: node --experimental-strip-types --test tests/animation-a3-3-contextual-crouch.test.mjs
      - name: Stage 4 — Minimal physical motor corrections
        run: node --experimental-strip-types --test tests/animation-a3-4-micro-footwork.test.mjs
      - name: Physical player-side recovery preserves planned orders at A3.4 step sizes
        run: node --experimental-strip-types --test --test-name-pattern='short step-back|ally in lane|real player operator' tests/breach-two-sided-fire-recovery.test.mjs
      - name: Critical actual gameplay and replay regressions
        run: node --experimental-strip-types --test tests/animation-a3-0-physicality.test.mjs tests/breach-muzzle-lane-hotfix.test.mjs tests/gameplay-g3-fire-lanes.test.mjs tests/breach-179.test.mjs tests/animation-a2-5-continuity.test.mjs
      - name: Production typecheck and build
        run: npm run build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: A3 physicality actual-session mobile and desktop inspector
        run: node scripts/smoke-animation-a3-0.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-2-4-mobile-desktop-physicality
          path: artifacts/animation-a3-0/gallery/
          if-no-files-found: ignore
