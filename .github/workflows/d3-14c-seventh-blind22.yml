name: D3.14C seventh blind 22-map paired physical acceptance
on:
  pull_request:
    paths:
      - src/breach-cycle-lane-recovery.ts
      - src/breach-motor-collision.ts
      - scripts/audit-r7-squad-execution.mjs
      - scripts/lib/d3-14c-seventh-blind22.mjs
      - scripts/report-d3-14c-blind22.mjs
      - .github/workflows/d3-14c-seventh-blind22.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-14c-seventh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Candidate exact PR head
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Immutable deployed B2 baseline (only visual FAL changes after)
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: fdc0a3f5c744e4a745885ca4739d99c45d5db883
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Freeze identical seventh cohort and audit harness in both versions
        run: |
          cp candidate/scripts/audit-r7-squad-execution.mjs baseline/scripts/audit-r7-squad-execution.mjs
          cp candidate/scripts/lib/d3-14c-seventh-blind22.mjs baseline/scripts/lib/d3-14c-seventh-blind22.mjs
          npm --prefix baseline install --no-audit --no-fund
          npm --prefix candidate install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/d3-14c"
      - name: Released B2 · seventh blind 22 maps × two modes × four × 45s
        run: |
          cd baseline
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --d314c-blind22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-14c/baseline.json"
      - name: C2 candidate · identical seeds, doors, orders and physics
        run: |
          cd candidate
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --d314c-blind22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-14c/candidate.json"
      - name: Enforce no per-squad arrivals lost, loops, or expensive A* regressions
        run: |
          cd candidate
          node scripts/report-d3-14c-blind22.mjs \
            "$RUNNER_TEMP/d3-14c/baseline.json" \
            "$RUNNER_TEMP/d3-14c/candidate.json"
      - name: Retain both full real 60Hz simulations and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-14c-seventh-blind22-paired
          path: ${{ runner.temp }}/d3-14c/*.json
          retention-days: 90
          if-no-files-found: ignore
