name: Replay R2 — Critical Video Browser Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-r2-video-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  video-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install chromium
      - name: Chromium replay video + sound integration smoke
        run: node scripts/smoke-replay-r2-video.mjs
