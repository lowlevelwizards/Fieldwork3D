name: Replay R2 — Critical Video Browser Smoke
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-r2-video-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  video-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'refactor/ci-replay-archive-visual-') || startsWith(github.head_ref, 'feature/replay-r2-audio-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Chromium replay video + sound integration smoke
        run: node scripts/smoke-replay-r2-video.mjs
