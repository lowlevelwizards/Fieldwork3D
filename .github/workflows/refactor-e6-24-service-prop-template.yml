name: E6.24 static service prop cache pilot
on:
  pull_request:
    paths:
      - 'src/rendering/breach-fixture-template.ts'
      - 'src/rendering/breach-site-scene-builder.ts'
      - 'src/breach-3d.ts'
      - 'tests/refactor-e6-24-service-prop-template.test.mjs'
      - 'scripts/verification/e6-24-service-prop-node-bench.mjs'
      - '.github/workflows/refactor-e6-24-service-prop-template.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e6-24-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  service-props:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Service prop parity, material lifetime and predecessor regression
        run: |
          node --experimental-strip-types --test \
            tests/refactor-e6-24-service-prop-template.test.mjs \
            tests/refactor-e6-23-rigid-fixture-template.test.mjs \
            tests/refactor-e6-22-visual-template-library.test.mjs \
            tests/refactor-e6-22-template-budget.test.mjs \
            tests/refactor-e6-22-architecture-template-integration.test.mjs
      - name: Cold/warm 200-instance service prop build reuse
        run: node --experimental-strip-types scripts/verification/e6-24-service-prop-node-bench.mjs
      - name: Production typecheck and bundle
        run: npm run build
