name: Deploy Fieldwork Ground Zero
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Release gate: typecheck, compile, stamp the build, and verify deployable output.
      # Behavioral regressions belong in focused PR checks; full suite is manual.
      - name: Build and verify Pages output
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/fieldwork-build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
