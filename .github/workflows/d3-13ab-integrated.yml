name: D3.13A+B integrated general movement regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/breach-door-opening-progress.ts'
      - 'src/breach-route-loop-recovery.ts'
      - 'src/breach-motor-door.ts'
      - 'src/breach-motor-route.ts'
      - 'src/breach-route-transition.ts'
      - 'tests/release-d3-13a-opening-progress.test.mjs'
      - 'tests/release-d3-13b-route-loop.test.mjs'
      - '.github/workflows/d3-13ab-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-13ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: A and B mechanism, doorway, order and collision safety contracts
        run: |
          node --experimental-strip-types --test \
            tests/release-d3-13a-opening-progress.test.mjs \
            tests/release-d3-13b-route-loop.test.mjs \
            tests/release-d3-9-single-opener.test.mjs \
            tests/release-d3-11d-portal-handoff.test.mjs \
            tests/release-d3-10b-authored-obstruction.test.mjs
      - name: Production TS and Vite build
        run: npm run build
      - name: Paired 45s old and independent dev map comparison
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" b8ed3d6100582ef8a5a8acd0cc3dee0fff98adbd
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          cp scripts/audit-r7-squad-execution.mjs "$RUNNER_TEMP/base/scripts/audit-r7-squad-execution.mjs"
          for label in old dev; do
            if [[ "$label" == dev ]];then args=(--dev-seed-base=520701 --dev-seed-stride=7013);else args=();fi
            node --experimental-strip-types "$RUNNER_TEMP/base/scripts/audit-r7-squad-execution.mjs" 11 2700 \
              --progress --route-quality "${args[@]}" > "$RUNNER_TEMP/${label}-before.json"
            node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
              --progress --route-quality "${args[@]}" > "$RUNNER_TEMP/${label}-after.json"
          done
      - name: Safeguard physicality and print measured differences
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const get=x=>JSON.parse(fs.readFileSync(x,"utf8"));
            const pick=r=>({arrivals:r.summary.physicalArrivals,
              squads:r.summary.physicalCompletedFour,
              logical:r.summary.completedFour,
              stalls:r.summary.stallEpisodes,retries:r.summary.retries,
              loops:r.progressSummary.suspectedLoops,
              still:r.progressSummary.sustainedStill,
              doorFlips:r.summary.doorStateFlips,
              searches:r.routeQualitySummary.searches});
            for(const label of ["old","dev"]){
              const b=get(process.argv[1]+"/"+label+"-before.json");
              const a=get(process.argv[1]+"/"+label+"-after.json");
              console.log("D313AB_"+label.toUpperCase(),
                JSON.stringify({before:pick(b),after:pick(a)}));
              for(const r of [a,b])
                for(const k of ["exceptions","invalidPositions",
                  "physicsStepViolations","corruptedPlans","unboundedManeuverAttempts"])
                  if(r.summary[k])throw Error("unsafe "+label+" "+k);
              if(a.summary.physicalArrivals<b.summary.physicalArrivals||
                 a.summary.physicalCompletedFour<b.summary.physicalCompletedFour||
                 a.progressSummary.sustainedStill>b.progressSummary.sustainedStill)
                throw Error("reduced physical arrivals or new still "+label);
              if(a.routeQualitySummary.searches>b.routeQualitySummary.searches*1.1+5)
                throw Error("pathfinding overhead "+label);
              if(a.summary.doorStateFlips>b.summary.doorStateFlips*1.1+2)
                throw Error("door oscillation "+label);
            }
          ' "$RUNNER_TEMP"
      - name: Keep deterministic comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-13ab-development-45s-paired
          path: |
            ${{ runner.temp }}/old-before.json
            ${{ runner.temp }}/old-after.json
            ${{ runner.temp }}/dev-before.json
            ${{ runner.temp }}/dev-after.json
          if-no-files-found: ignore
