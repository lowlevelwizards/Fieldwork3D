name: D3.31B ambiguous doorway provenance isolation
on:
  push:
    branches: [feature/d3-31b-ambiguous-side-recovery-20261118]
    paths:
      - '.github/workflows/d3-31b-ambiguous-side.yml'
      - 'src/breach-interruption-recovery.ts'
      - 'tests/release-d3-31b-ambiguous-side.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d331b-ambiguous-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - name: Typecheck and critical recovery cohorts
        run: |
          npm run check
          node --experimental-strip-types --test tests/release-d3-31b-ambiguous-side.test.mjs tests/release-d3-31a-entry-side.test.mjs tests/release-d3-30-atomic-squad-resume.test.mjs tests/release-d3-30-interrupted-entry.test.mjs
