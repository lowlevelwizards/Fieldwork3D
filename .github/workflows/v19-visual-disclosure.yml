name: V19 visual disclosure
on:
  pull_request:
    paths:
      - 'src/breach-2d-actor-renderer.ts'
      - 'src/breach-2d-world-renderer.ts'
      - 'src/rendering/breach-evidence-owner.ts'
      - 'src/breach-3d.ts'
      - 'src/rendering/breach-presentation-sight-memo.ts'
      - 'src/rendering/breach-3d-disclosure-presenter.ts'
      - 'tests/v19-visual-disclosure.test.mjs'
      - 'docs/vfx-v19-unified-disclosure-scope.md'
      - '.github/workflows/v19-visual-disclosure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/v19-visual-disclosure.test.mjs tests/performance-p1-baseline.test.mjs tests/performance-p1-presentation-integration.test.mjs tests/replay-r43-personal-visibility.test.mjs tests/package-c3-cross-view-disclosure.test.mjs tests/breach-2d-renderer-extraction.test.mjs tests/vfx-v*.test.mjs tests/visibility-04-surface.test.mjs
      - run: npm run check
