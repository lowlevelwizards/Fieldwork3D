name: Asset Library contact sheets (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/capture-asset-contact-sheets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fieldwork-art-contact-sheets
          path: asset-art-audit/
          retention-days: 14
