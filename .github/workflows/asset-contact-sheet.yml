name: Asset Library contact sheets (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/capture-asset-contact-sheets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fieldwork-art-contact-sheets
          path: asset-art-audit/
          retention-days: 14
