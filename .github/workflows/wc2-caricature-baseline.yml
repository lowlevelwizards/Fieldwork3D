name: WC2 current sculptural comparison baseline
on:
  push:
    branches: [art/wc2-caricature-sculptural-unification]
    paths:
      - '.github/workflows/wc2-caricature-baseline.yml'
      - 'scripts/compose-wc2-comparison-plates.py'
      - 'src/weapons/geometry/hk-mp5-silhouettes.ts'
      - 'src/weapons/geometry/hk-retractable-stock.ts'
      - 'tests/weapon-hk-modular-r1.test.mjs'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: HK stock and pose regression gates
        run: node --experimental-strip-types --test tests/weapon-hk-modular-r1.test.mjs tests/weapon-hk-mp5-family.test.mjs tests/weapon-hk-expansion.test.mjs
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/audit-weapon-art-inventory.mjs
      - run: node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs
      - run: node --experimental-strip-types scripts/capture-wa0-operator-context.mjs
      - run: |
          python -m pip install --user pillow
          python scripts/compose-wc2-comparison-plates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc2-current-comparison
          path: |
            reports/wa0-visual/
            reports/wa0-source-inventory.json
          if-no-files-found: error
          retention-days: 90
