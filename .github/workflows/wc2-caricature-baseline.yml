name: WC2 current sculptural comparison baseline
on:
  push:
    branches: [art/wc24-ak-fixed-furniture]
    paths:
      - '.github/workflows/wc2-caricature-baseline.yml'
      - 'scripts/compose-wc2-comparison-plates.py'
      - 'src/weapons/geometry/ak-silhouettes.ts'
      - 'src/weapons/geometry/ak-solid-furniture-art.ts'
      - 'src/arsenal/wa0-capture.ts'
      - 'scripts/capture-weapon-art-baseline.mjs'
      - 'tests/weapon-ak-*.test.mjs'
  workflow_dispatch:
concurrency:
  group: wc2-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/audit-weapon-art-inventory.mjs
      - run: node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs
      - run: node --experimental-strip-types scripts/capture-wa0-operator-context.mjs
      - name: Retrieve pinned WC2.4 first candidate
        uses: actions/download-artifact@v4
        with:
          name: wc2-current-comparison
          run-id: 46024391398
          github-token: ${{ github.token }}
          path: reports/wc2-before
      - run: |
          python -m pip install --user pillow
          python scripts/compose-wc2-comparison-plates.py
      - name: AK stock and pose regression gates
        run: node --experimental-strip-types --test tests/weapon-ak-*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc2-current-comparison
          path: |
            reports/wa0-visual/
            reports/wa0-source-inventory.json
          if-no-files-found: error
          retention-days: 90
