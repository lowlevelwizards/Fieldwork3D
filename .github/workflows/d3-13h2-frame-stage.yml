name: D3.13H4 cold future-door physical recovery acceptance
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: d3-13h2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-motor-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Physical stage, original GO and TypeScript
        run: |
          npm run check
          node --experimental-strip-types --test \
            tests/release-d3-13h2-frame-stage.test.mjs \
            tests/release-d3-13g2-swept-rejoin.test.mjs \
            tests/release-d3-11d-portal-handoff.test.mjs
      - name: Full 45-second historical physical motor must match released G2C
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --progress --route-quality > "$RUNNER_TEMP/d313h2-main.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d313h2-main.json','utf8'));
          const x=s.summary,q=s.routeQualitySummary,p=s.progressSummary;
          console.log('D313H2_HISTORICAL',JSON.stringify({summary:x,route:q,progress:p}));
          if(x.exceptions||x.invalidPositions||x.corruptedPlans||x.physicsStepViolations||
             x.unboundedManeuverAttempts||x.physicalArrivals<80||
             x.physicalCompletedFour<18||x.completedFour<21||
             x.stallEpisodes>8||x.retries>5||p.suspectedLoops||p.sustainedStill||
             q.searches>3150)throw Error('H2 historical physics or movement regression');
          NODE
      - name: Test small motel Rook reaches a new physical waypoint via future portal
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --site-index=8 --audit-seed=1855967 --audit-scale=small \
            --route-transitions --route-quality --progress \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/d313h2-small.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d313h2-small.json','utf8'));
          const m=s.rows[0].modes.find(m=>m.mode==='authored');
          const rook=m.operators.find(a=>a.id==='rook');
          console.log('D313H2_SMALL',JSON.stringify({
            arrivals:m.arrivals,remaining:rook.remaining,doorEpisode:rook.doorEpisode,
            sources:m.routeTransitions.counts,
            rejects:Object.fromEntries(Object.entries(m.routeTransitions.rejectsByActor??{})
              .filter(([k])=>k.startsWith('rook:'))),
            searches:s.routeQualitySummary.searches,
            physicalViolations:s.summary.physicsStepViolations}));
          if(s.summary.exceptions||s.summary.invalidPositions||
             s.summary.corruptedPlans||s.summary.physicsStepViolations||
             m.arrivals<3||rook.remaining>=290)
            throw Error('H4 failed to recover actual Rook progress');
          NODE
      - name: Previously resolved standard motel must stay fully physical
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --site-index=8 --audit-seed=2069994 --audit-scale=standard \
            --route-transitions --route-quality --progress \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/d313h2-standard.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d313h2-standard.json','utf8'));
          const m=s.rows[0].modes.find(m=>m.mode==='authored');
          const rook=m.operators.find(a=>a.id==='rook');
          console.log('D313H4_STANDARD',JSON.stringify({
            arrivals:m.arrivals,rookRemaining:rook.remaining,
            sources:m.routeTransitions.counts}));
          if(s.summary.exceptions||s.summary.invalidPositions||
             s.summary.corruptedPlans||s.summary.physicsStepViolations||
             m.arrivals<4||rook.remaining>5)
            throw Error('H4 regressed established G2C standard motel recovery');
          NODE
      - name: Retain both complete 60Hz simulation traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-13h2-physical-frame-stage-45s
          path: ${{ runner.temp }}/d313h2-*.json
          if-no-files-found: ignore
          retention-days: 90
