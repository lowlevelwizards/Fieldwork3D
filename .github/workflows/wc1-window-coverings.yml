name: WC1 window coverings critical checks
on:
  pull_request:
    paths:
      - 'src/breach-window-coverings.ts'
      - 'src/rendering/window-covering-visual.ts'
      - 'src/asset-lab-main.ts'
      - 'tests/wc1-window-coverings.test.mjs'
      - '.github/workflows/wc1-window-coverings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/wc1-window-coverings.test.mjs tests/map-14-window-security.test.mjs tests/map-11-window-styles.test.mjs tests/asset-lab-preview-alignment.test.mjs
      - run: npm run check
