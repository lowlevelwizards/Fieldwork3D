name: D3.31A physical approach-side group provenance
on:
  push:
    branches: [feature/d3-31-entry-side-provenance-20261118]
    paths:
      - '.github/workflows/d3-31a-entry-side.yml'
      - 'src/breach-door-interruption.ts'
      - 'src/breach-order-lifecycle.ts'
      - 'src/breach-interruption-recovery.ts'
      - 'tests/release-d3-31a-entry-side.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d331a-side-${{ github.ref }}
  cancel-in-progress: true
jobs:
  entry-side:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - name: Critical provenance and existing retry regression
        run: |
          npm run check
          node --experimental-strip-types --test tests/release-d3-31a-entry-side.test.mjs tests/release-d3-30-atomic-squad-resume.test.mjs tests/release-d3-30-threshold-coordination.test.mjs tests/release-d3-30-interrupted-entry.test.mjs
