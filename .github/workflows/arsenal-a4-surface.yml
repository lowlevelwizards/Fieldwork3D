name: Arsenal A4 surface detail and WebGL review
on:
  push:
    branches: [feat/arsenal-a4-surface-detail-unification]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arsenal-a4-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a4:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Audit all factory detail costs
        run: node --experimental-strip-types scripts/audit-arsenal-a4.mjs
      - name: Critical A4 surface and family regressions
        run: |
          node --experimental-strip-types --test \
            tests/arsenal-a4-surface-detail.test.mjs \
            tests/weapon-ar-r48-silhouettes.test.mjs \
            tests/weapon-ar-r47-silhouettes.test.mjs \
            tests/weapon-ak-r47-final-polish.test.mjs \
            tests/weapon-hk-r4-material-selector.test.mjs \
            tests/weapon-fal-p6-geometry-budget.test.mjs \
            tests/weapon-fnc-p21-pixel-surfaces.test.mjs \
            tests/arsenal-a1-baseline.test.mjs \
            tests/arsenal-a2-material-unification.test.mjs \
            tests/arsenal-a3-accessory-geometry.test.mjs
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install Chromium for actual WebGL inspection
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture all 35 factory presets
        run: node scripts/capture-arsenal-a1.mjs
      - name: Capture native scale 128px and 64px comparisons
        run: node scripts/capture-arsenal-a4-native.mjs
      - name: Upload current A4 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-a4-surface-review
          path: |
            reports/arsenal-a4-surface-census.json
            reports/arsenal-a1-contact-sheet.png
            reports/arsenal-a4-native-128px.png
            reports/arsenal-a4-native-64px.png
          if-no-files-found: ignore
          retention-days: 21
