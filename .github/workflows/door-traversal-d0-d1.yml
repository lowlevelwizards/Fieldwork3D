name: D0-D1 physical door foundation
on:
  push:
    branches: ['feature/door-traversal-d0-d1-*']
  pull_request:
    paths:
      - 'src/breach-door-traversal-episode.ts'
      - 'src/breach-entry-coordination.ts'
      - 'src/breach-order-wait.ts'
      - 'src/breach-actor-motor.ts'
      - 'src/breach-door-test-cases.ts'
      - 'src/door-test-range-main.ts'
      - 'tests/door-traversal-d0-d1.test.mjs'
      - 'tests/door-traversal-episode.test.mjs'
      - '.github/workflows/door-traversal-d0-d1.yml'
  workflow_dispatch:
concurrency:
  group: door-foundation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: D0 and D1 focused regression
        run: |
          node --experimental-strip-types --test tests/door-traversal-d0-d1.test.mjs tests/door-traversal-episode.test.mjs tests/breach-roadmap2-order-wait.test.mjs tests/door-test-range-page.test.mjs tests/release7-outward-four.test.mjs tests/release7-obstructed-entry-gate.test.mjs tests/squad-entry-b-continuity.test.mjs tests/doorway-planned-sequence.test.mjs
      - name: D0 real-world diagnostic (no artificial completion claims)
        run: node --experimental-strip-types scripts/audit-door-traversal-baseline.mjs 4 600
      - name: TypeScript + Vite production build
        run: npm run build
