name: D3.14C FRONT circular full-body lane read-only feasibility
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  front-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Real 60Hz townhouse FRONT authored Rook 45s feasibility
        run: |
          node --check scripts/audit-r7-squad-execution.mjs
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            11 2700 --site-index=1 --audit-seed=5386234 --audit-scale=small \
            --d314c-front-probe --progress --route-transitions --route-quality \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/d314c-front.json"
      - name: Compare route topology and verify physical motor unchanged
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+
            '/d314c-front.json','utf8'));
          const m=r.rows[0].modes.find(m=>m.mode==='authored');
          const e=m.d314cFrontEvidence;
          console.log('D314C_FRONT_FEASIBILITY',JSON.stringify(e));
          console.log('D314C_FRONT_SOURCES',JSON.stringify({
            actorSources:Object.fromEntries(Object.entries(m.routeTransitions?.byActor??{})
              .filter(([k])=>k.startsWith('rook:'))),
            physicallyArrived:m.arrivals,remaining:e?.remaining,
            sourceCount:m.routeTransitions?.counts}));
          if(!e||r.summary.exceptions||r.summary.invalidPositions||
             r.summary.corruptedPlans||r.summary.physicsStepViolations)
            throw Error('forensic probe altered physical motor');
          NODE
      - name: Retain full real 45s route and world-truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-14c-townhouse-front-fullbody-lane-audit
          path: ${{ runner.temp }}/d314c-front.json
          retention-days: 90
