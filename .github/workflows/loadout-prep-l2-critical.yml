name: Loadout Prep L2 critical
on:
  push:
    branches:
      - feature/loadout-prep-l2-20261118
      - feature/loadout-prep-l2-6-campaign-polish-20261118
      - feature/loadout-prep-l2-7-prego-20261118
      - feature/loadout-prep-l2-8-wedge-physical-20261118
      - feature/loadout-prep-l2-9-medical-utility-20261118
      - feature/loadout-prep-l2-10-carry-feedback-20261118
      - feature/loadout-prep-l2-11-physical-20261118
      - feature/loadout-prep-l2-11-tap-place-20261118
      - feature/loadout-prep-l2-11-shared-preview-20261118
      - feature/loadout-prep-l2-11-feedback-mobile-20261118
      - feature/loadout-prep-l2-12-magazine-20261118
      - feature/loadout-prep-l2-12-magazine-interaction-20261118
  workflow_dispatch:
concurrency:
  group: loadout-prep-l2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Typecheck
        run: npm run check
      - name: Inventory regression tests
        run: node --experimental-strip-types --test tests/equipment-field-inventory.test.mjs tests/equipment-12-flash-supply.test.mjs tests/quickplay-field-preferences.test.mjs tests/equipment-field-undo.test.mjs tests/campaign-pre-go-inventory.test.mjs tests/equipment-field-visuals.test.mjs tests/equipment-field-visual-rig.test.mjs tests/equipment-13-visuals.test.mjs tests/operator-equipment-details.test.mjs tests/equipment-physical-board.test.mjs tests/equipment-field-transfer.test.mjs tests/equipment-preview-carry-focus.test.mjs tests/loadout-quickplay-preview-integration.test.mjs tests/equipment-magazine-transfer.test.mjs tests/loadout-magazine-editor-integration.test.mjs tests/equipment-magazine-authority.test.mjs
