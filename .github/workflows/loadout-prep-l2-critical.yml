name: Loadout Prep L2 critical
on:
  push:
    branches:
      - feature/loadout-prep-l2-20261118
      - feature/loadout-prep-l2-6-campaign-polish-20261118
      - feature/loadout-prep-l2-7-prego-20261118
      - feature/loadout-prep-l2-8-wedge-physical-20261118
      - feature/loadout-prep-l2-9-medical-utility-20261118
      - feature/loadout-prep-l2-10-carry-feedback-20261118
      - feature/loadout-prep-l2-11-physical-20261118
      - feature/loadout-prep-l2-11-tap-place-20261118
      - feature/loadout-prep-l2-11-shared-preview-20261118
      - feature/loadout-prep-l2-11-feedback-mobile-20261118
      - feature/loadout-prep-l2-12-magazine-20261118
      - feature/loadout-prep-l2-12-magazine-interaction-20261118
      - feature/loadout-prep-l2-12-medical-tools-20261118
      - feature/loadout-l212-c3-c4-gear-20261119
      - feature/loadout-l212-d2-magazine-drag-20261119
      - feature/loadout-l212-d3-placement-feedback-20261119
      - feature/loadout-l212-d1-quickplay-carry-20261119
      - feature/loadout-l212-release-b-20261119
      - feature/loadout-l212-release-c-20261119
      - feature/loadout-l212-f1-deployment-snapshot-20261119
      - feature/loadout-l212-f2-field-consumption-20261119
      - feature/loadout-l212-f3-mission-reconciliation-20261119
      - feature/loadout-l212-release-d-20261119
      - feature/loadout-l213-f4-after-action-readiness-20261119
      - feature/loadout-l212-e1-carry-undo-20261119
      - feature/loadout-l212-e2-layout-copy-20261119
  pull_request:
    branches:
      - feature/loadout-l212-f2-field-consumption-20261119
      - main
  workflow_dispatch:
concurrency:
  group: loadout-prep-l2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Typecheck
        run: npm run check
      - name: Inventory regression tests
        run: node --experimental-strip-types --test tests/equipment-field-inventory.test.mjs tests/equipment-12-flash-supply.test.mjs tests/quickplay-field-preferences.test.mjs tests/equipment-field-undo.test.mjs tests/campaign-pre-go-inventory.test.mjs tests/equipment-field-visuals.test.mjs tests/equipment-field-visual-rig.test.mjs tests/equipment-13-visuals.test.mjs tests/operator-equipment-details.test.mjs tests/equipment-physical-board.test.mjs tests/equipment-field-transfer.test.mjs tests/equipment-preview-carry-focus.test.mjs tests/loadout-quickplay-preview-integration.test.mjs tests/equipment-magazine-transfer.test.mjs tests/loadout-magazine-editor-integration.test.mjs tests/equipment-magazine-authority.test.mjs tests/equipment-carry-gear-change.test.mjs tests/equipment-carry-gear-authority.test.mjs tests/carry-gear-change-controls.test.mjs tests/loadout-carry-selector-integration.test.mjs tests/loadout-quickplay-carry-selector.test.mjs tests/equipment-carry-undo.test.mjs tests/equipment-carry-undo-authority.test.mjs tests/equipment-carry-layout-copy.test.mjs tests/equipment-carry-layout-copy-authority.test.mjs tests/loadout-carry-layout-copy-ui.test.mjs tests/loadout-carry-layout-integration.test.mjs tests/loadout-quickplay-layout-copy.test.mjs tests/loadout-carry-undo-ui.test.mjs tests/loadout-campaign-carry-undo-ui.test.mjs tests/equipment-deployment-snapshot.test.mjs tests/equipment-deployed-field-use.test.mjs tests/equipment-mission-field-reconciliation.test.mjs tests/equipment-16-quickplay-magazines.test.mjs tests/equipment-22-09-campaign-medical.test.mjs tests/equipment-10-flash.test.mjs tests/equipment-23-03-wedge-physics.test.mjs tests/eqa3-10-restrain.test.mjs tests/breach-roadmap3-order-utility.test.mjs tests/loadout-f4-after-action-inventory.test.mjs tests/after-action-v4-stage2-hierarchy.test.mjs
