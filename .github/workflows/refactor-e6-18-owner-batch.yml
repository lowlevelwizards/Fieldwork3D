name: E6.18 owner-scoped static draw optimization
on:
  pull_request:
    paths:
      - 'src/rendering/breach-owner-static-merge.ts'
      - 'src/rendering/breach-fixture-draw-batching.ts'
      - 'src/rendering/breach-site-scene-builder.ts'
      - 'src/rendering/breach-live-main-pass-profiler.ts'
      - 'src/rendering/breach-post-ready-attribution.ts'
      - 'tests/refactor-e6-18a-mesh-provenance.test.mjs'
      - 'tests/refactor-e6-18-owner-static-merge.test.mjs'
      - 'scripts/verification/e6-18-main-pass-browser.mjs'
      - '.github/workflows/refactor-e6-18-owner-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e6-18-owners-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  owner-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Batching, resource ownership, visual flags, fog and main-pass regression
        run: |
          node --experimental-strip-types --test \
            tests/refactor-e6-18-owner-static-merge.test.mjs \
            tests/refactor-e6-18a-mesh-provenance.test.mjs \
            tests/performance-p6-furniture-batching.test.mjs \
            tests/breach-static-batching-performance.test.mjs \
            tests/refactor-e6-17-main-pass.test.mjs \
            tests/refactor-e6-16-shadow-submission.test.mjs \
            tests/refactor-e6-15-live-scene-attribution.test.mjs \
            tests/refactor-e6-14-live-execution-cold.test.mjs \
            tests/refactor-e6-13-briefing-idle.test.mjs \
            tests/consolidation-stage2-config-persistence.test.mjs
      - name: Production typecheck and Vite build
        run: npm run build
      - name: Two fixed seeds batch on/off 90 executing frames each
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/verification/e6-18-main-pass-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e6-18-owner-batch-fixed-seed-ab-evidence
          path: artifacts/refactor-e6-18/live-scene/
          if-no-files-found: ignore
          retention-days: 14
