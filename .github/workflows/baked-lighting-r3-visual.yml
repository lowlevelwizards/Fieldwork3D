name: Baked Lighting R3 — Mobile Contact Shadow Review
on:
  pull_request:
    paths:
      - 'src/operator-baked-gear-ao.ts'
      - 'src/operator-baked-gear-cast.ts'
      - 'src/operator-baked-shadow-maps.ts'
      - 'tests/operator-baked-lighting-crisp.test.mjs'
      - 'scripts/smoke-lightmap-clothes-only.mjs'
      - '.github/workflows/baked-lighting-r3-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baked-lighting-r3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile-lighting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Phone Clothes Only IK silhouette guard
        run: node scripts/smoke-lightmap-clothes-only.mjs
      - name: UCP and equipment camo at Studio/gameplay zoom
        run: node scripts/capture-operator-camo-r9.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighting-r3-phone-comparison
          path: |
            operator-lightmap-clothes-only/
            operator-r9-camo-comparison/
          if-no-files-found: ignore
