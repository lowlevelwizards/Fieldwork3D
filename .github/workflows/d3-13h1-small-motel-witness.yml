name: D3.13H1 small motel physical handoff witness
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: d3-13h1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  small-motel-root-cause:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Verify typecheck and existing G2C portal contracts
        run: |
          npm run check
          node --experimental-strip-types --test tests/release-d3-13g2-swept-rejoin.test.mjs
      - name: Run untouched 45s small motel motor with extended rejection witness
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --site-index=8 --audit-seed=1855967 --audit-scale=small \
            --route-transitions --route-quality --progress \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/d3-13h1-small.json"
      - name: Report exact independent-case rejection and physical safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d3-13h1-small.json','utf8'));
          const m=d.rows[0].modes.find(m=>m.mode==='authored');
          const rook=m.operators.find(a=>a.id==='rook');
          const w=m.routeTransitions,onlyRook=Object.fromEntries(
            Object.entries(w.rejectsByActor??{}).filter(([key])=>key.startsWith('rook:')));
          const summary={seed:d.rows[0].seed,arrivals:m.arrivals,
            rookRemaining:rook.remaining,doorEpisode:rook.doorEpisode,
            actorRejections:onlyRook,
            allRejections:w.rejectReasons,
            routeSources:w.counts,
            first:w.events.slice(0,12),
            last:w.events.slice(-12)};
          console.log('D313H1_PHYSICAL_CAUSE',JSON.stringify(summary));
          if(d.summary.exceptions||d.summary.invalidPositions||
             d.summary.corruptedPlans||d.summary.physicsStepViolations)
            throw Error('forensic evidence must preserve physical safety');
          if(m.arrivals<2)throw Error('new physical arrivals regression');
          NODE
      - name: Archive exact actor/door geometry and 60Hz trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-13h1-small-motel-physical-rejection-trace
          path: ${{ runner.temp }}/d3-13h1-small.json
          if-no-files-found: ignore
          retention-days: 90
