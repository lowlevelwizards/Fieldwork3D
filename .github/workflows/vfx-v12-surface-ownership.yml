name: V12 surface ownership
on:
  pull_request:
    paths:
      - 'src/breach-impact-surface.ts'
      - 'src/breach-ballistic-resolution.ts'
      - 'src/breach-shot-resolution.ts'
      - 'src/breach-firing-pipeline.ts'
      - 'src/breach-shot-environment.ts'
      - 'src/breach-3d.ts'
      - 'tests/vfx-v12-surface-ownership.test.mjs'
      - 'scripts/verification/vfx-v12-surface-browser.mjs'
      - '.github/workflows/vfx-v12-surface-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
# Isolate each PR from manual acceptance and cancel obsolete revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/vfx-v*.test.mjs tests/breach-roadmap4-ballistic-resolution.test.mjs tests/breach-roadmap2-impact-evidence.test.mjs tests/breach-roadmap2-stage10-combat.test.mjs tests/breach-window-blood-reactivity.test.mjs tests/replay-r2-ballistics.test.mjs tests/secondary-s7-live-shot.test.mjs tests/civilian-b5b-ballistics.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node scripts/verification/vfx-v12-surface-browser.mjs
        env:
          FIELDWORK_CI_CHROME: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v12-surface-witnesses
          path: artifacts/vfx-v12-surfaces/
          if-no-files-found: ignore
