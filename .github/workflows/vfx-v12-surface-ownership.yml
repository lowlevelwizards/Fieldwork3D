name: V12 surface ownership
on:
  pull_request:
    paths:
      - 'src/breach-impact-surface.ts'
      - 'src/breach-ballistic-resolution.ts'
      - 'src/breach-shot-resolution.ts'
      - 'src/breach-firing-pipeline.ts'
      - 'src/breach-shot-environment.ts'
      - 'src/breach-3d.ts'
      - 'tests/vfx-v12-surface-ownership.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/vfx-v*.test.mjs tests/breach-roadmap4-ballistic-resolution.test.mjs tests/breach-roadmap2-impact-evidence.test.mjs tests/breach-roadmap2-stage10-combat.test.mjs tests/breach-window-blood-reactivity.test.mjs tests/replay-r2-ballistics.test.mjs tests/secondary-s7-live-shot.test.mjs tests/civilian-b5b-ballistics.test.mjs
      - run: npm run build
