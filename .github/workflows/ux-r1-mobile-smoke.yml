name: UX R1 — Critical iPhone Navigation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fieldwork-ux-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  mobile-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps chromium
      - name: Phone Mission, Squad and Studio handoff
        run: node scripts/smoke-ux-r1.mjs
      - name: UX R3 Campaign roster, kit and Studio handoff
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/ux-r3-hud-campaign-polish-')) }}
        run: node scripts/smoke-ux-r3-campaign.mjs
