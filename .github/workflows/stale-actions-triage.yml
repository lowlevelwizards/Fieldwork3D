name: One-off orphaned Actions queue cleanup
on:
  push:
    branches: [ops/stale-actions-triage-20261120]
    paths:
      - '.github/workflows/stale-actions-triage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: stale-actions-triage-20261120
  cancel-in-progress: false
jobs:
  obsolete-queued-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cancel only November 11 superseded orphans
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const oldBranches = [
              'refactor/consolidation-b0-pose-baseline',
              'refactor/consolidation-b1-pose-decision',
            ];
            const cutoff = Date.parse('2026-11-12T00:00:00Z');
            const oldMainId = 43098274766;
            const oldMainSha = 'abd0dd14067ed6a9f6c4f45a0277a81eee943132';
            const verifiedDeployId = 44752587439;
            const current = new Map();
            for (const branch of ['main', ...oldBranches]) {
              const r = await github.rest.repos.getBranch({owner, repo, branch});
              current.set(branch, r.data.commit.sha);
              core.info('Protecting current ' + branch + ': ' + r.data.commit.sha);
            }
            const lastDeploy = (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: verifiedDeployId
            })).data;
            // The later main deployment succeeded and included a passing
            // public Pages build-id verification, making the 11/11 main run obsolete.
            const safeOldMain = lastDeploy.status === 'completed' &&
              lastDeploy.conclusion === 'success' &&
              lastDeploy.head_sha === current.get('main');
            if (!safeOldMain) {
              core.warning('Do not cancel historical main run: latest Pages release not proven current');
            }
            const runs = [];
            for (let page = 1; page <= 3; page++) {
              const p = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, status: 'queued', per_page: 100, page,
              });
              runs.push(...p.data.workflow_runs);
              if (p.data.workflow_runs.length < 100) break;
            }
            const candidate = r =>
              r.status === 'queued' &&
              Date.parse(r.created_at) < cutoff &&
              (
                (r.event === 'pull_request' &&
                  oldBranches.includes(r.head_branch) &&
                  r.head_sha !== current.get(r.head_branch)) ||
                (safeOldMain && r.id === oldMainId &&
                  r.head_branch === 'main' && r.event === 'push' &&
                  r.head_sha === oldMainSha &&
                  r.head_sha !== current.get('main'))
              );
            const matches = runs.filter(candidate);
            core.info('Queued snapshot: ' + runs.length +
              '; safely obsolete Nov 11 targets: ' + matches.length);
            let canceled = 0, alreadyGone = 0, protectedRuns = 0;
            for (const item of matches.slice(0, 40)) {
              const liveRun = (await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: item.id
              })).data;
              const branch = item.head_branch;
              const headNow = (await github.rest.repos.getBranch({
                owner, repo, branch
              })).data.commit.sha;
              const stillObsolete = liveRun.status === 'queued' &&
                liveRun.head_sha === item.head_sha &&
                Date.parse(liveRun.created_at) < cutoff &&
                (branch === 'main'
                  ? safeOldMain && liveRun.id === oldMainId &&
                    liveRun.event === 'push' && liveRun.head_sha === oldMainSha &&
                    headNow === current.get('main')
                  : oldBranches.includes(branch) &&
                    liveRun.event === 'pull_request' &&
                    liveRun.head_sha !== headNow);
              if (!stillObsolete) { protectedRuns++; continue; }
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner, repo, run_id: liveRun.id,
                });
                canceled++;
                core.info('Cancel requested: ' + liveRun.id + ' (' + branch + ')');
              } catch (e) {
                if ([404,409,422].includes(e.status)) {
                  alreadyGone++;
                  core.warning('Already completed / un-cancellable: ' + item.id);
                } else { throw e; }
              }
              await new Promise(resolve => setTimeout(resolve, 650));
            }
            core.summary.addHeading('November 11 queue recovery')
              .addTable([
                [{data:'Measure',header:true},{data:'Count',header:true}],
                ['Queued snapshot',String(runs.length)],
                ['Superseded candidates',String(matches.length)],
                ['Cancellation requests accepted',String(canceled)],
                ['Already finished or un-cancellable',String(alreadyGone)],
                ['Protected on recheck',String(protectedRuns)],
              ])
              .addRaw('Only historical pose-architecture PR runs on superseded commits and one expressly guarded obsolete November 11 main deployment were eligible. Newer builds and running jobs are preserved.')
              .write();
