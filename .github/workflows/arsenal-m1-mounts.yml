name: Arsenal M1 physical part mounting (feature)
on:
  push:
    branches: [feat/arsenal-m1-part-mount-interfaces]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arsenal-m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  m1:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Mount capability, optic seating, saved loadout and family checks
        run: |
          node --experimental-strip-types --test \
            tests/arsenal-m1-part-mount-interfaces.test.mjs \
            tests/arsenal-a3-h3-optic-mount-contact.test.mjs \
            tests/arsenal-a3-reflex-axis.test.mjs \
            tests/arsenal-a3-accessory-geometry.test.mjs \
            tests/arsenal-v2-assembly.test.mjs \
            tests/arsenal-a1-baseline.test.mjs \
            tests/equipment-19-02-weapon-silhouettes.test.mjs \
            tests/equipment-21-01-workbench.test.mjs \
            tests/weapon-workbench-mobile-sockets.test.mjs
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Audit unchanged factory geometry
        run: node --experimental-strip-types scripts/audit-arsenal-a4.mjs
      - name: Browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Nine actual optic and part-seat capture
        run: node scripts/capture-arsenal-a3-h3.mjs
      - name: Upload M1 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-m1-interface-review
          path: |
            reports/arsenal-a3-h3-optic-sheet.png
            reports/arsenal-a4-surface-census.json
          if-no-files-found: ignore
          retention-days: 21
