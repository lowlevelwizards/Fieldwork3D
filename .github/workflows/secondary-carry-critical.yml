name: Secondary S4 physical carry focused
on:
  workflow_call:
  pull_request:
    branches-ignore: [main]
    paths:
      - 'src/secondary-holster-visual.ts'
      - 'src/equipment-magazine-placement.ts'
      - 'src/secondary-equipment.ts'
      - 'src/equipment-loadouts.ts'
      - 'src/arsenal/glock-gallery.ts'
      - 'src/arsenal/arsenal.css'
      - 'src/breach-operator-appearance.ts'
      - 'tests/secondary-s4-holster-visual.test.mjs'
      - '.github/workflows/secondary-carry-critical.yml'
  workflow_dispatch:
concurrency:
  group: secondary-carry-critical-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Native holster, material ownership and carry tests
        run: node --experimental-strip-types --test tests/secondary-s4-holster-visual.test.mjs
      - name: Critical TypeScript and production build
        run: npm run build
