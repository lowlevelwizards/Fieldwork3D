name: Fieldwork verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify pull request
    uses: ./.github/workflows/verify.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || '' }}
