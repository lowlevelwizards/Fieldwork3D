name: Fieldwork Ground Zero checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused texture and world-scale regression tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'texture2/') }}
        run: node --experimental-strip-types --test tests/texture*.test.mjs tests/worldgen-prop-facing.test.mjs tests/worldgen-furniture-access.test.mjs tests/condition5-01.test.mjs tests/condition5-02.test.mjs tests/worldgen-condition-lab.test.mjs tests/map-07-building-palettes.test.mjs tests/map-10-environment-wear.test.mjs tests/map-20-world-scale.test.mjs
      - name: Focused worldgen architecture and Map Lab tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/') && !startsWith(github.head_ref, 'worldgen2/25a-') && !startsWith(github.head_ref, 'worldgen2/25b-') && !startsWith(github.head_ref, 'worldgen2/26a-') && !startsWith(github.head_ref, 'worldgen2/26b-') && !startsWith(github.head_ref, 'worldgen2/26c-') && !startsWith(github.head_ref, 'worldgen2/27a-') && !startsWith(github.head_ref, 'worldgen2/27b-') && !startsWith(github.head_ref, 'worldgen2/27c-') && !startsWith(github.head_ref, 'worldgen2/28a-') && !startsWith(github.head_ref, 'worldgen2/28b-') && !startsWith(github.head_ref, 'worldgen2/28c-') && !startsWith(github.head_ref, 'worldgen2/29a-') && !startsWith(github.head_ref, 'worldgen2/29b-') && !startsWith(github.head_ref, 'worldgen2/30-') && !startsWith(github.head_ref, 'worldgen2/31-') && !startsWith(github.head_ref, 'worldgen2/32-') && !startsWith(github.head_ref, 'worldgen2/33-') && !startsWith(github.head_ref, 'worldgen2/34-') && !startsWith(github.head_ref, 'worldgen2/35-') && !startsWith(github.head_ref, 'worldgen2/37-') && !startsWith(github.head_ref, 'worldgen2/variability-') }}
        run: node --experimental-strip-types --test tests/worldgen-map-lab-audit.test.mjs tests/worldgen-size-programs.test.mjs tests/worldgen-room-contracts.test.mjs tests/worldgen-furnishing-recovery.test.mjs tests/worldgen-activity-furnishing.test.mjs tests/worldgen-building-identity.test.mjs tests/worldgen-prop-facing.test.mjs tests/worldgen-operational-fixtures.test.mjs tests/worldgen-fixture-frame-origin.test.mjs tests/worldgen-facility-programs.test.mjs tests/worldgen-service-clearance.test.mjs tests/worldgen-subtype-plans.test.mjs tests/worldgen-contextual-wear.test.mjs tests/worldgen-relationships.test.mjs tests/worldgen-essential-recovery.test.mjs tests/worldgen-essential-priority.test.mjs tests/worldgen-spatial-fitting.test.mjs tests/worldgen-24a-room-contact-solver.test.mjs tests/worldgen-24b-private-circulation.test.mjs tests/worldgen-24c-physical-workflow-audit.test.mjs tests/worldgen-footprint-synthesis.test.mjs tests/worldgen-functional-bay-sizing.test.mjs tests/worldgen-essential-replan.test.mjs tests/worldgen-25a-serviceable-essentials.test.mjs tests/worldgen-site-completeness-selection.test.mjs tests/worldgen-window-collider-sync.test.mjs tests/worldgen-motel-suites.test.mjs tests/worldgen-apartment-units.test.mjs tests/worldgen-unit-contracts.test.mjs tests/worldgen-window-furnishing.test.mjs tests/worldgen-completeness-overlay.test.mjs tests/map-10-environment-wear.test.mjs tests/worldgen-unified-generation.test.mjs tests/worldgen-functional-furnishing.test.mjs tests/worldgen-quality-audit.test.mjs tests/worldgen-architectural-program.test.mjs
      - name: Focused essential-fixture release tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/25a-') }}
        run: node --experimental-strip-types --test tests/worldgen-25a-serviceable-essentials.test.mjs tests/worldgen-essential-recovery.test.mjs tests/worldgen-essential-priority.test.mjs tests/worldgen-essential-replan.test.mjs tests/worldgen-service-clearance.test.mjs tests/worldgen-site-completeness-selection.test.mjs tests/worldgen-room-contracts.test.mjs tests/worldgen-functional-furnishing.test.mjs tests/worldgen-unified-generation.test.mjs
      - name: Focused residential-unit release tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/25b-') }}
        run: node --experimental-strip-types --test tests/worldgen-unit-contracts.test.mjs tests/worldgen-apartment-units.test.mjs tests/worldgen-motel-suites.test.mjs tests/worldgen-room-contracts.test.mjs tests/worldgen-site-completeness-selection.test.mjs tests/worldgen-architectural-compiler.test.mjs
      - name: Focused two-sided service workstation tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/26a-') }}
        run: node --experimental-strip-types --test tests/worldgen-26a-two-sided-service.test.mjs tests/architecture-13d-service-access.test.mjs tests/architecture-13b-service-queues.test.mjs tests/worldgen-prop-facing.test.mjs tests/worldgen-service-clearance.test.mjs tests/worldgen-operational-fixtures.test.mjs
      - name: Focused operational navigation audit tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/26b-') }}
        run: node --experimental-strip-types --test tests/worldgen-26b-operational-routes.test.mjs tests/architecture-13d-service-access.test.mjs tests/worldgen-map-lab-audit.test.mjs tests/worldgen-service-clearance.test.mjs
      - name: Focused operational layout selection tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/26c-') }}
        run: node --experimental-strip-types --test tests/worldgen-26c-operational-rank.test.mjs tests/worldgen-site-completeness-selection.test.mjs tests/worldgen-26a-two-sided-service.test.mjs tests/worldgen-26b-operational-routes.test.mjs
      - name: Focused material-specific object wear tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/27a-') }}
        run: node --experimental-strip-types --test tests/worldgen-27a-object-wear-materials.test.mjs tests/texture4-03-object.test.mjs tests/texture-08-material-wear.test.mjs tests/worldgen-contextual-wear.test.mjs
      - name: Focused connected-room furnishing tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/27b-') }}
        run: node --experimental-strip-types --test tests/worldgen-27b-connected-compositions.test.mjs tests/worldgen-activity-furnishing.test.mjs tests/worldgen-prop-facing.test.mjs tests/worldgen-essential-recovery.test.mjs tests/worldgen-furnishing-recovery.test.mjs
      - name: Focused threshold wear and condition rendering tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/27c-') }}
        run: node --experimental-strip-types --test tests/worldgen-27c-threshold-traffic.test.mjs tests/worldgen-contextual-wear.test.mjs tests/texture2-07-wear-budget.test.mjs tests/texture4-03-object.test.mjs tests/texture3-05-wear.test.mjs
      - name: Focused functional exterior access tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/28a-') }}
        run: node --experimental-strip-types --test tests/worldgen-28a-entrance-lane.test.mjs tests/architecture-18a-property-access.test.mjs tests/map-16-property-surfaces.test.mjs tests/worldgen-orient-exteriors.test.mjs
      - name: Focused oriented parking and property tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/28b-') }}
        run: node --experimental-strip-types --test tests/worldgen-28b-parking-layout.test.mjs tests/worldgen-28a-entrance-lane.test.mjs tests/map-16-property-surfaces.test.mjs
      - name: Focused service yard access tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/28c-') }}
        run: node --experimental-strip-types --test tests/worldgen-28c-service-yards.test.mjs tests/worldgen-28a-entrance-lane.test.mjs tests/worldgen-28b-parking-layout.test.mjs
      - name: Focused functional layout variability
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/variability-') }}
        run: node --experimental-strip-types --test tests/worldgen-variability-*.test.mjs tests/worldgen-architectural-program.test.mjs tests/worldgen-unified-generation.test.mjs
      - name: Focused archetype fixture specialization
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/37-') }}
        run: node --experimental-strip-types --test tests/worldgen-37-*.test.mjs tests/worldgen-functional-furnishing.test.mjs
      - name: Focused exterior property and arrival flow tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/35-') }}
        run: node --experimental-strip-types --test tests/worldgen-35-*.test.mjs tests/architecture-18a-property-access.test.mjs
      - name: Focused shared environmental assets
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/34-') }}
        run: node --experimental-strip-types --test tests/worldgen-34-*.test.mjs tests/map-01-asset-registry.test.mjs tests/map-20-world-scale.test.mjs tests/map-22-asset-audit.test.mjs tests/worldgen-assets.test.mjs
      - name: Focused variable room programs and layout families
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/33-') }}
        run: node --experimental-strip-types --test tests/worldgen-33-*.test.mjs tests/worldgen-size-programs.test.mjs tests/worldgen-functional-bay-sizing.test.mjs tests/worldgen-architectural-program.test.mjs tests/worldgen-unified-generation.test.mjs
      - name: Focused activity-cluster and furniture-density tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/32-') }}
        run: node --experimental-strip-types --test tests/worldgen-32-*.test.mjs tests/worldgen-activity-furnishing.test.mjs tests/worldgen-functional-furnishing.test.mjs tests/worldgen-prop-facing.test.mjs tests/worldgen-furniture-access.test.mjs
      - name: Focused circulation and furnishing release tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/31-') }}
        run: node --experimental-strip-types --test tests/worldgen-31-*.test.mjs tests/worldgen-activity-furnishing.test.mjs tests/worldgen-furnishing.test.mjs tests/worldgen-furniture-access.test.mjs
      - name: Focused map realism rolling builds
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/30-') }}
        run: node --experimental-strip-types --test tests/worldgen-30-*.test.mjs tests/worldgen-29a-quality-matrix.test.mjs tests/worldgen-map-lab-audit.test.mjs
      - name: Focused seeded worldgen quality tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/29a-') }}
        run: node --experimental-strip-types --test tests/worldgen-29a-quality-matrix.test.mjs tests/worldgen-site-completeness-selection.test.mjs tests/worldgen-map-lab-audit.test.mjs
      - name: Focused generation budget and worker reporting tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/29b-') }}
        run: node --experimental-strip-types --test tests/worldgen-29b-generation-budget.test.mjs tests/worldgen-26b-operational-routes.test.mjs tests/worldgen-29a-quality-matrix.test.mjs tests/worldgen-map-lab-audit.test.mjs
      - name: Focused architectural expansion tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'architecture/') && !startsWith(github.head_ref, 'architecture/14b-') && !startsWith(github.head_ref, 'architecture/15a-') && !startsWith(github.head_ref, 'architecture/16a-') && !startsWith(github.head_ref, 'architecture/18a-') }}
        run: node --experimental-strip-types --test tests/architecture-*.test.mjs tests/worldgen-double-doors.test.mjs tests/worldgen-architectural-compiler.test.mjs tests/worldgen-map-lab-audit.test.mjs tests/lw-windows.test.mjs tests/lw-glass-impact.test.mjs tests/architecture-physical-contracts.test.mjs tests/breach-142b.test.mjs tests/map-11-window-styles.test.mjs tests/worldgen-visuals.test.mjs tests/map-13-door-families.test.mjs tests/worldgen-maplab-scale-consistency.test.mjs
      - name: Focused covered-entry release check
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'architecture/14b-') }}
        run: node --experimental-strip-types --test tests/architecture-14a-transition-rooms.test.mjs tests/architecture-14b-covered-entry.test.mjs tests/worldgen-architectural-compiler.test.mjs
      - name: Focused compact-building release check
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'architecture/15a-') }}
        run: node --experimental-strip-types --test tests/architecture-14b-covered-entry.test.mjs tests/architecture-15a-small-programs.test.mjs tests/worldgen-size-programs.test.mjs tests/worldgen-subtype-plans.test.mjs tests/worldgen-facility-programs.test.mjs
      - name: Focused grouped-furnishing release check
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'architecture/16a-') }}
        run: node --experimental-strip-types --test tests/architecture-14b-covered-entry.test.mjs tests/architecture-15a-small-programs.test.mjs tests/architecture-16a-diner-booths.test.mjs tests/worldgen-room-contracts.test.mjs tests/worldgen-operational-fixtures.test.mjs
      - name: Focused property access and Map Lab release check
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'architecture/18a-') }}
        run: node --experimental-strip-types --test tests/architecture-18a-property-access.test.mjs tests/worldgen-maplab-scale-consistency.test.mjs tests/worldgen-map-lab-audit.test.mjs
      - name: Focused campaign integration tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'campaign-') }}
        run: node --experimental-strip-types --test tests/campaign-*.test.mjs tests/lw-roster*.test.mjs tests/lw-operations-board.test.mjs tests/breach-155.test.mjs
      - name: Focused equipment and personnel tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'equipment/') }}
        run: node --experimental-strip-types --test tests/equipment-*.test.mjs tests/campaign-*.test.mjs tests/lw-roster*.test.mjs
      - name: Full game tests (main and other PRs)
        if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'texture2/') && !startsWith(github.head_ref, 'campaign-') && !startsWith(github.head_ref, 'worldgen2/') && !startsWith(github.head_ref, 'architecture/') && !startsWith(github.head_ref, 'equipment/')) }}
        run: npm test
      - name: Typecheck
        run: npm run check
      - name: Production build
        run: npm run build
