name: Fieldwork Ground Zero checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Critical checks, full historical regression, or release preflight"
        type: choice
        required: true
        default: critical
        options: [critical, full, release]
permissions:
  contents: read
  actions: read
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A9: tests belong to changed source domains, not historical branch-name gates.
# All historical test files remain executable through npm test / Full.
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || inputs.suite == 'critical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify CI workflow and regression ownership
        run: |
          node --test tests/ci-regression-plan.test.mjs
          node scripts/verification/ci-regression-plan.mjs --check
          node scripts/verification/ci-workflow-contract.mjs
      - name: Fixed-clock baseline plus changed-source domain regressions
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run
      - name: Verify extracted deterministic architecture boundaries
        run: node scripts/verification/breach-architecture-boundaries.mjs
      - name: Production typecheck, build and build-stamp integrity
        run: npm run build

  # Opt-in historical full suite, separate from bounded PR validation.
  full-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Full historical and current Node test suite
        run: npm test
      - name: Typecheck and production build
        run: npm run build

  # Release safety is a deliberate, independently executable checkpoint;
  # pending Pages deployment should not make ordinary PR test jobs red.
  release-checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse queued, failed or stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
