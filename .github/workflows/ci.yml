name: Fieldwork Ground Zero checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Each updated PR supersedes its own obsolete CI run; manual audits are independent.
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused Release B load-bearing mounts, family migrations and material independence
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/armor-rig-release-b-') }}
        run: node --experimental-strip-types --test tests/operator-armor-rig-release-b.test.mjs
      - name: Focused Release C automatic fabric and pouch material regressions
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/armor-rig-release-c-') }}
        run: node --experimental-strip-types --test tests/operator-armor-rig-release-c.test.mjs
      - name: Focused RIG R2 identity, mounting, rear geometry and hip contact
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/rig-r2-') }}
        run: node --experimental-strip-types --test tests/operator-rig-r2-identity.test.mjs tests/operator-rig-r1-contact.test.mjs tests/operator-rig-r4-webbing.test.mjs tests/operator-rig-r5-matrix.test.mjs tests/operator-harness-magazine.test.mjs
      - name: Focused RIG R3 chunky fit, rear suspension, magazines and P83 belt regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/rig-r3-') }}
        run: node --experimental-strip-types --test tests/operator-rig-r3-proportions.test.mjs tests/operator-rig-r2-identity.test.mjs tests/operator-rig-r1-contact.test.mjs tests/operator-rig-r2-light.test.mjs tests/operator-rig-r3-full.test.mjs tests/operator-rig-r4-webbing.test.mjs tests/operator-rig-r5-matrix.test.mjs tests/operator-harness-magazine.test.mjs
      - name: Focused RIG R4 garment-pocket relief, thick routed webbing and legacy fit
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/rig-r4-') }}
        run: node --experimental-strip-types --test tests/operator-rig-r4-pocket-routing.test.mjs tests/operator-rig-r1-contact.test.mjs tests/operator-rig-r2-identity.test.mjs tests/operator-rig-r3-proportions.test.mjs tests/operator-rig-r4-webbing.test.mjs tests/operator-rig-r5-matrix.test.mjs tests/operator-harness-magazine.test.mjs
      - name: Focused RIG A-D true mounting, magazine hierarchy and armor contact regressions
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/rig-r1-') }}
        run: node --experimental-strip-types --test tests/operator-rig-r1-contact.test.mjs tests/operator-rig-r2-light.test.mjs tests/operator-rig-r3-full.test.mjs tests/operator-rig-r4-webbing.test.mjs tests/operator-rig-r5-matrix.test.mjs tests/operator-visual-kit.test.mjs tests/operator-harness-magazine.test.mjs tests/operator-armor-rig-release-a.test.mjs tests/operator-armor-rig-release-b.test.mjs tests/operator-armor-r7-surface-contact.test.mjs
      - name: Focused R7 real rendered-shell anchors, 35 armor contacts and critical legacy regressions
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/armor-r7-') }}
        run: node --experimental-strip-types --test tests/operator-rig-r1-contact.test.mjs tests/operator-rig-r2-light.test.mjs tests/operator-rig-r3-full.test.mjs tests/operator-rig-r4-webbing.test.mjs tests/operator-armor-r7-polish.test.mjs tests/operator-armor-r7-surface-contact.test.mjs tests/operator-armor-r6-contact.test.mjs tests/operator-armor-r5-orthogonal.test.mjs tests/operator-armor-r4-silhouette.test.mjs tests/operator-armor-r2-fit.test.mjs tests/operator-armor-r1-integration.test.mjs
      - name: Focused R6 local armor contact, true strap landings and legacy fit gates
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/armor-r6-') }}
        run: node --experimental-strip-types --test tests/operator-armor-r6-contact.test.mjs tests/operator-armor-r5-orthogonal.test.mjs tests/operator-armor-r4-silhouette.test.mjs tests/operator-armor-r2-fit.test.mjs tests/operator-armor-r1-integration.test.mjs
      - name: Focused R5 orthogonal cummerbunds, collar identity and 35 uniform fits
