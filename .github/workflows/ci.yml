name: Fieldwork Ground Zero checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Critical checks, full historical regression, or release preflight"
        type: choice
        required: true
        default: critical
        options: [critical, full, release]
permissions:
  contents: read
  actions: read
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A9: tests belong to changed source domains, not historical branch-name gates.
# All historical test files remain executable through npm test / Full.
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || inputs.suite == 'critical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify CI workflow and regression ownership
        run: |
          node --test tests/ci-regression-plan.test.mjs
          node scripts/verification/ci-regression-plan.mjs --check
          node scripts/verification/ci-workflow-inventory.mjs --check
          node scripts/verification/ci-workflow-contract.mjs
      # E1: one source-owned regression selector for EVERY PR, including
      # historical feature branches. Specialized art/browser gates remain
      # independent checks when their files or workflows require them.
      - name: Fixed-clock affected-domain and architecture regression shards
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: |
          for shard in {1..16}; do
            node scripts/verification/ci-regression-plan.mjs --run --shard=${shard}/16
          done
          for shard in {1..16}; do
            node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=${shard}/16
          done
      - name: Verify extracted deterministic architecture boundaries
        run: node scripts/verification/breach-architecture-boundaries.mjs
      - name: Production typecheck, build and build-stamp integrity
        run: npm run build

  # Opt-in historical full suite, separate from bounded PR validation.
  full-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Full historical and current Node test suite
        run: npm test
      - name: Typecheck and production build
        run: npm run build

  # Release safety is a deliberate, independently executable checkpoint;
  # pending Pages deployment should not make ordinary PR test jobs red.
  release-checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse queued, failed or stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs

  # Consolidated PR dispatch: these reusable gates no longer create separate
  # mostly-skipped workflow runs on every ordinary pull request. Their manual
  # workflow_dispatch entry points and exact test jobs remain intact.
  architecture-integration:
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'refactor/') || startsWith(github.head_ref, 'feature/release1-') || startsWith(github.head_ref, 'feature/release2-') || startsWith(github.head_ref, 'feature/release3-') || startsWith(github.head_ref, 'feature/release4-') || startsWith(github.head_ref, 'feature/release5-') || startsWith(github.head_ref, 'feature/release6-')) }}
    uses: ./.github/workflows/architecture-refactor-critical.yml
    permissions:
      contents: read
      actions: read

  browser-acceptance:
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'refactor/closeout-stage6-') || startsWith(github.head_ref, 'refactor/consolidation-') || startsWith(github.head_ref, 'feature/release1-') || startsWith(github.head_ref, 'feature/release2-') || startsWith(github.head_ref, 'feature/release3-') || startsWith(github.head_ref, 'feature/release4-') || startsWith(github.head_ref, 'feature/release5-') || startsWith(github.head_ref, 'feature/release6-')) }}
    uses: ./.github/workflows/closeout-stage6-browser.yml
    permissions:
      contents: read
