name: Fieldwork Ground Zero checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused texture and world-scale regression tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'texture2/') }}
        run: node --experimental-strip-types --test tests/texture*.test.mjs tests/map-07-building-palettes.test.mjs tests/map-10-environment-wear.test.mjs tests/map-20-world-scale.test.mjs
      - name: Full game tests (main and non-texture PRs)
        if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'texture2/') }}
        run: npm test
      - name: Typecheck
        run: npm run check
      - name: Production build
        run: npm run build
