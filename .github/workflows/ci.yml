name: Fieldwork Ground Zero checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused texture and world-scale regression tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'texture2/') }}
        run: node --experimental-strip-types --test tests/texture*.test.mjs tests/map-07-building-palettes.test.mjs tests/map-10-environment-wear.test.mjs tests/map-20-world-scale.test.mjs
      - name: Focused worldgen architecture and Map Lab tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/') }}
        run: node --experimental-strip-types --test tests/worldgen-map-lab-audit.test.mjs tests/worldgen-size-programs.test.mjs tests/worldgen-room-contracts.test.mjs tests/worldgen-furnishing-recovery.test.mjs tests/worldgen-activity-furnishing.test.mjs tests/worldgen-building-identity.test.mjs tests/worldgen-contextual-wear.test.mjs tests/worldgen-relationships.test.mjs tests/worldgen-essential-recovery.test.mjs tests/worldgen-motel-suites.test.mjs tests/worldgen-apartment-units.test.mjs tests/worldgen-unit-contracts.test.mjs tests/worldgen-window-furnishing.test.mjs tests/worldgen-fixture-facing.test.mjs tests/worldgen-completeness-overlay.test.mjs tests/map-10-environment-wear.test.mjs tests/worldgen-unified-generation.test.mjs tests/worldgen-functional-furnishing.test.mjs tests/worldgen-quality-audit.test.mjs tests/worldgen-architectural-program.test.mjs
      - name: Focused campaign integration tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'campaign-') }}
        run: node --experimental-strip-types --test tests/campaign-*.test.mjs tests/lw-roster*.test.mjs tests/lw-operations-board.test.mjs tests/breach-155.test.mjs
      - name: Full game tests (main and other PRs)
        if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'texture2/') && !startsWith(github.head_ref, 'campaign-') && !startsWith(github.head_ref, 'worldgen2/')) }}
        run: npm test
      - name: Typecheck
        run: npm run check
      - name: Production build
        run: npm run build
