name: Fieldwork Ground Zero checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Each updated PR supersedes its own obsolete CI run; manual audits are independent.
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused UX2-20 strafe, route edits and update consent regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux2/20-') }}
        run: node --experimental-strip-types --test tests/ux2-20-strafe-route-update-consent.test.mjs
      - name: Focused UX2-19 mobile settings and camera regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux2/19-') }}
        run: node --experimental-strip-types --test tests/ux2-mobile-settings-camera.test.mjs
      - name: Focused UX2-18 Quick Play site identity regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux2/18-') }}
        run: node --experimental-strip-types --test tests/ux2-current-site-identity.test.mjs
      - name: Focused UX2-17 Operator Lab workflow regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux2/17-') }}
        run: node --experimental-strip-types --test tests/ux2-operator-lab-workflow.test.mjs
      - name: Focused UX2-16 execution feedback regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux2/16-') }}
        run: node --experimental-strip-types --test tests/ux2-execution-feedback.test.mjs
      - name: Focused UX2-15 tactical preview regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux2/15-') }}
        run: node --experimental-strip-types --test tests/ux2-order-previews.test.mjs
      - name: Focused texture and world-scale regression tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'texture2/') }}
        run: node --experimental-strip-types --test tests/texture*.test.mjs tests/worldgen-prop-facing.test.mjs tests/worldgen-furniture-access.test.mjs tests/condition5-01.test.mjs tests/condition5-02.test.mjs tests/worldgen-condition-lab.test.mjs tests/map-07-building-palettes.test.mjs tests/map-10-environment-wear.test.mjs tests/map-20-world-scale.test.mjs
      - name: Focused worldgen architecture and Map Lab tests
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'worldgen2/') && !startsWith(github.head_ref, 'worldgen2/25a-') && !startsWith(github.head_ref, 'worldgen2/25b-') && !startsWith(github.head_ref, 'worldgen2/26a-') && !startsWith(github.head_ref, 'worldgen2/26b-') && !startsWith(github.head_ref, 'worldgen2/26c-') && !startsWith(github.head_ref, 'worldgen2/27a-') && !startsWith(github.head_ref, 'worldgen2/27b-') && !startsWith(github.head_ref, 'worldgen2/27c-') && !startsWith(github.head_ref, 'worldgen2/28a-') && !startsWith(github.head_ref, 'worldgen2/28b-') && !startsWith(github.head_ref, 'worldgen2/28c-') && !startsWith(github.head_ref, 'worldgen2/29a-') && !startsWith(github.head_ref, 'worldgen2/29b-') && !startsWith(github.head_ref, 'worldgen2/30-') && !startsWith(github.head_ref, 'worldgen2/31-') && !startsWith(github.head_ref, 'worldgen2/32-') && !startsWith(github.head_ref, 'worldgen2/33-') && !startsWith(github.head_ref, 'worldgen2/34-') && !startsWith(github.head_ref, 'worldgen2/35-') && !startsWith(github.head_ref, 'worldgen2/36-') && !startsWith(github.head_ref, 'worldgen2/38-') && !startsWith(github.head_ref, 'worldgen2/39-') && !startsWith(github.head_ref, 'worldgen2/37-') && !startsWith(github.head_ref, 'worldgen2/variability-') }}
