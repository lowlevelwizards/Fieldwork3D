        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'ux/interaction2-') || startsWith(github.head_ref, 'appearance/stage4-')) }}
        run: node --experimental-strip-types --test tests/interaction2-*.test.mjs tests/ux2-pointer-hit-targets.test.mjs tests/breach-context-placement.test.mjs tests/ux2-order-previews.test.mjs tests/ux2-21-look-watch.test.mjs tests/ux2-execution-feedback.test.mjs
      # Release checkpoint: verify that public Pages actually serves the
      # latest main commit, not merely that a deployment workflow reported green.
      - name: Verify previous Pages build is publicly served
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ux/interaction2-') }}
        run: |
          expected="$(git ls-remote origin refs/heads/main | cut -c1-12)"
          for attempt in 1 2 3 4 5 6 7 8; do
            payload="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://lowlevelwizards.github.io/Fieldwork3D/fieldwork-build.json?release-check=${GITHUB_RUN_ID}-${attempt}" || true)"
            served="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{try{console.log(JSON.parse(s).id||'')}catch{console.log('')}})")"
            if [[ "$served" == "$expected"-* ]]; then
              echo "Pages is serving current main: $served"
              exit 0
            fi
            echo "Waiting for Pages content: expected prefix $expected, observed ${served:-unavailable}"
            sleep 5
          done
          echo "Pages did not serve expected main build" >&2
          exit 1
      - name: Focused Stage 4 field garment expansion and rig safety
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'appearance/stage4-') }}
        run: node --experimental-strip-types --test tests/operator-outerwear-stage4.test.mjs tests/operator-uniform-trousers-states-stage3c.test.mjs tests/operator-uniform-blouse-stage3b.test.mjs tests/operator-appearance-grid-purge-stage3b1.test.mjs tests/operator-fabric-camo-stage2.test.mjs tests/operator-wardrobe-data.test.mjs tests/operator-wardrobe-recipes.test.mjs tests/operator-wardrobe-persistence.test.mjs tests/operator-visual-merge.test.mjs tests/operator-headwear-fit-metrics.test.mjs tests/operator-mannequin-neutral.test.mjs
      # The comprehensive suite is opt-in, not a gate on each merge.
      - name: Full game tests (manual audit)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm test
      # npm run build already invokes tsc --noEmit; no duplicate Typecheck step.
      - name: Production build and typecheck
        run: npm run build
