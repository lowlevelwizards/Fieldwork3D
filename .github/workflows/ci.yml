name: Fieldwork Ground Zero checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Each updated PR supersedes its own obsolete CI run; manual audits are independent.
# The AO suffix isolates this focused release from a superseded, stuck broad
# AO test run. Other PRs retain their existing concurrency grouping.
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}${{ startsWith(github.head_ref, 'feature/gear-baked-ao-all-') && '-ao-r1' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: AR / AK low-ready shoulder and forearm critical gate
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/breach-low-ready-ar-ak-armor-fit-') }}
        run: |
          node --experimental-strip-types --test tests/breach-low-ready-family-fit.test.mjs tests/breach-weapon-magazine-idle.test.mjs
      - name: Breach magazine, socket and shared-idle critical gates
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/breach-weapon-sockets-magazines-idle-') }}
        run: |
          node --experimental-strip-types --test tests/breach-weapon-magazine-idle.test.mjs tests/breach-weapon-issue-faction-studio.test.mjs
      - name: AR A1 surface vents — minimal visual-geometry gate
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/weapon-ar-a1-flush-vents-') }}
        run: |
          node --experimental-strip-types --test tests/weapon-ar-a1-face-vents.test.mjs tests/weapon-ar-r48-silhouettes.test.mjs tests/weapon-ar-r47-silhouettes.test.mjs tests/weapon-ar-r46-silhouettes.test.mjs tests/weapon-geometry-r33-axes.test.mjs
          node --experimental-strip-types scripts/audit-weapon-ortho-r2.mjs /tmp/weapon-ar-a1-vents.html
      - name: AR R4.8 — miniature geometry, compatibility and production gate
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/weapon-ar-r48-') }}
        run: |
          node --experimental-strip-types --test tests/weapon-ar-r48-silhouettes.test.mjs tests/weapon-ar-r47-silhouettes.test.mjs tests/weapon-ar-r46-silhouettes.test.mjs tests/weapon-ar-r45-silhouettes.test.mjs tests/weapon-ar-r44-silhouettes.test.mjs tests/weapon-ar-r42-silhouettes.test.mjs tests/weapon-arsenal-r4.test.mjs tests/weapon-geometry-r32-anatomy.test.mjs tests/weapon-geometry-r33-axes.test.mjs tests/equipment-19-01-weapon-assemblies.test.mjs tests/weapon-workbench-mobile-sockets.test.mjs tests/weapon-ak-r46-silhouettes.test.mjs
          node --experimental-strip-types scripts/audit-weapon-ortho-r2.mjs /tmp/weapon-ortho-r48.html
      - name: AR R4.7 — receiver, rails, muzzle and legacy silhouette gate
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/weapon-ar-r47-') }}
        run: |
          node --experimental-strip-types --test tests/weapon-ar-r47-silhouettes.test.mjs tests/weapon-ar-r46-silhouettes.test.mjs tests/weapon-ar-r45-silhouettes.test.mjs tests/weapon-ar-r44-silhouettes.test.mjs tests/weapon-ar-r42-silhouettes.test.mjs tests/weapon-arsenal-r4.test.mjs tests/weapon-geometry-r32-anatomy.test.mjs tests/weapon-geometry-r33-axes.test.mjs tests/equipment-19-01-weapon-assemblies.test.mjs tests/weapon-workbench-mobile-sockets.test.mjs
          node --experimental-strip-types scripts/audit-weapon-ortho-r2.mjs /tmp/weapon-ortho-r47.html
