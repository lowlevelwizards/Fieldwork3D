name: Fieldwork Ground Zero checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Critical checks, full historical regression, or release preflight"
        type: choice
        required: true
        default: critical
        options: [critical, full, release]
permissions:
  contents: read
  actions: read
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || inputs.suite == 'critical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify CI workflow and regression ownership
        run: |
          node --test tests/ci-regression-plan.test.mjs
          node --test tests/ci-specialist-routing.test.mjs
          node --test tests/ci-movement-routing.test.mjs
          node --test tests/ci-movement-door-routing.test.mjs
          node --test tests/ci-weapon-visual-routing.test.mjs
          node --test tests/ci-after-action-routing.test.mjs
          node --test tests/ci-replay-mobile-routing.test.mjs
          node --test tests/ci-replay-legacy-routing.test.mjs
          node --test tests/ci-replay-director-routing.test.mjs
          node scripts/verification/ci-regression-plan.mjs --check
          node scripts/verification/ci-workflow-inventory.mjs --check
          node scripts/verification/ci-workflow-contract.mjs
      - name: Fixed-clock affected-domain and architecture regression shards
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: |
          for shard in {1..16}; do
            node scripts/verification/ci-regression-plan.mjs --run --shard=${shard}/16
          done
          for shard in {1..16}; do
            node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=${shard}/16
          done
      - name: Verify extracted deterministic architecture boundaries
        run: node scripts/verification/breach-architecture-boundaries.mjs
      - name: Production typecheck, build and build-stamp integrity
        run: npm run build

  full-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Full historical and current Node test suite
        run: npm test
      - name: Typecheck and production build
        run: npm run build

  release-checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse queued, failed or stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs

  architecture-integration:
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'refactor/') || startsWith(github.head_ref, 'feature/release1-') || startsWith(github.head_ref, 'feature/release2-') || startsWith(github.head_ref, 'feature/release3-') || startsWith(github.head_ref, 'feature/release4-') || startsWith(github.head_ref, 'feature/release5-') || startsWith(github.head_ref, 'feature/release6-')) }}
    uses: ./.github/workflows/architecture-refactor-critical.yml
    permissions:
      contents: read
      actions: read

  browser-acceptance:
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'refactor/vfx-') || startsWith(github.head_ref, 'refactor/closeout-stage6-') || startsWith(github.head_ref, 'refactor/consolidation-') || startsWith(github.head_ref, 'feature/release1-') || startsWith(github.head_ref, 'feature/release2-') || startsWith(github.head_ref, 'feature/release3-') || startsWith(github.head_ref, 'feature/release4-') || startsWith(github.head_ref, 'feature/release5-') || startsWith(github.head_ref, 'feature/release6-')) }}
    uses: ./.github/workflows/closeout-stage6-browser.yml
    permissions:
      contents: read


  specialist-routing:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      loadout: ${{ steps.owners.outputs.loadout }}
      physical: ${{ steps.owners.outputs.physical }}
      arsenal: ${{ steps.owners.outputs.arsenal }}
      movementRecovery: ${{ steps.owners.outputs.movementRecovery }}
      movementRelease: ${{ steps.owners.outputs.movementRelease }}
      movementDoorAny: ${{ steps.owners.outputs.movementDoorAny }}
      movementDoorJSON: ${{ steps.owners.outputs.movementDoorJSON }}
      arsenalM30: ${{ steps.owners.outputs.arsenalM30 }}
      glockArt: ${{ steps.owners.outputs.glockArt }}
      debriefV41: ${{ steps.owners.outputs.debriefV41 }}
      debriefV42: ${{ steps.owners.outputs.debriefV42 }}
      debriefV43: ${{ steps.owners.outputs.debriefV43 }}
      debriefV44: ${{ steps.owners.outputs.debriefV44 }}
      debriefV45: ${{ steps.owners.outputs.debriefV45 }}
      debriefV5: ${{ steps.owners.outputs.debriefV5 }}
      replayMobileAny: ${{ steps.owners.outputs.replayMobileAny }}
      replayMobileJSON: ${{ steps.owners.outputs.replayMobileJSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: owners
        name: Resolve changed-file specialist owners (fail closed on unknown)
        env:
          CI_BASE_REF: ${{ github.base_ref }}
          CI_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/verification/ci-specialist-routing.mjs --github-output

  loadout-domain:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.loadout == 'true' }}
    uses: ./.github/workflows/loadout-prep-l2-critical.yml
    permissions:
      contents: read

  physical-equipment-domain:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.physical == 'true' }}
    uses: ./.github/workflows/f6-physical-equipment-critical.yml
    permissions:
      contents: read

  arsenal-mount-domain:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.arsenal == 'true' }}
    uses: ./.github/workflows/arsenal-m2-mount-inventory.yml
    permissions:
      contents: read
      actions: read


  d3-recovery-critical:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.movementRecovery == 'true' }}
    uses: ./.github/workflows/d3-18-physical-recovery.yml
    permissions:
      contents: read

  d3-main-physical-checkpoint:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.movementRelease == 'true' }}
    uses: ./.github/workflows/d3-main-release-checkpoint.yml
    permissions:
      contents: read


  # A7a: one domain dispatch retains all original R7/door physical jobs.
  movement-door-acceptance:
    needs: specialist-routing
    if: ${{ github.event_name == 'pull_request' && needs.specialist-routing.outputs.movementDoorAny == 'true' }}
    uses: ./.github/workflows/movement-door-acceptance.yml
    with:
      lanes: ${{ needs.specialist-routing.outputs.movementDoorJSON }}
    permissions:
      contents: read

  arsenal-m30-visual:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.arsenalM30 == 'true' }}
    uses: ./.github/workflows/arsenal-m30.yml
    permissions:
      contents: read
      actions: read

  glock-family-visual:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.glockArt == 'true' }}
    uses: ./.github/workflows/glock-family-art.yml
    permissions:
      contents: read



  debrief-v4-navigation:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.debriefV41 == 'true' }}
    uses: ./.github/workflows/after-action-v4-stage1.yml
    permissions:
      contents: read

  debrief-v4-summary:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.debriefV42 == 'true' }}
    uses: ./.github/workflows/after-action-v4-stage2.yml
    permissions:
      contents: read

  debrief-v4-persistent3d:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.debriefV43 == 'true' }}
    uses: ./.github/workflows/after-action-v4-stage3.yml
    permissions:
      contents: read

  debrief-v4-forensic:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.debriefV44 == 'true' }}
    uses: ./.github/workflows/after-action-v4-stage4.yml
    permissions:
      contents: read

  debrief-v4-timeline:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.debriefV45 == 'true' }}
    uses: ./.github/workflows/after-action-v4-stage5.yml
    permissions:
      contents: read

  debrief-v5-browser:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.debriefV5 == 'true' }}
    uses: ./.github/workflows/after-action-v5-critical.yml
    permissions:
      contents: read

  replay-mobile-acceptance:
    needs: specialist-routing
    if: ${{ needs.specialist-routing.outputs.replayMobileAny == 'true' }}
    uses: ./.github/workflows/replay-mobile-acceptance.yml
    with:
      lanes: ${{ needs.specialist-routing.outputs.replayMobileJSON }}
    permissions:
      contents: read
      actions: read

  equipment-acceptance:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-equipment-acceptance.yml
