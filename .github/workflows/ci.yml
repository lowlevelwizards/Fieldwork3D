name: Fieldwork Ground Zero checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Critical checks, full historical regression, or release preflight"
        type: choice
        required: true
        default: critical
        options: [critical, full, release]
permissions:
  contents: read
  actions: read
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A9: tests belong to changed source domains, not historical branch-name gates.
# All historical test files remain executable through npm test / Full.
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || inputs.suite == 'critical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify CI workflow and regression ownership
        run: |
          node --test tests/ci-regression-plan.test.mjs
          node scripts/verification/ci-regression-plan.mjs --check
          node scripts/verification/ci-workflow-contract.mjs
      - name: Fixed-clock domain regressions 1/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=1/16
      - name: Fixed-clock domain regressions 2/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=2/16
      - name: Fixed-clock domain regressions 3/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=3/16
      - name: Fixed-clock domain regressions 4/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=4/16
      - name: Fixed-clock domain regressions 5/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=5/16
      - name: Fixed-clock domain regressions 6/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=6/16
      - name: Fixed-clock domain regressions 7/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=7/16
      - name: Fixed-clock domain regressions 8/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=8/16
      - name: Fixed-clock domain regressions 9/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=9/16
      - name: Fixed-clock domain regressions 10/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=10/16
      - name: Fixed-clock domain regressions 11/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=11/16
      - name: Fixed-clock domain regressions 12/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=12/16
      - name: Fixed-clock domain regressions 13/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=13/16
      - name: Fixed-clock domain regressions 14/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=14/16
      - name: Fixed-clock domain regressions 15/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=15/16
      - name: Fixed-clock domain regressions 16/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --shard=16/16
      - name: Fail-closed architecture regressions 1/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=1/16
      - name: Fail-closed architecture regressions 2/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=2/16
      - name: Fail-closed architecture regressions 3/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=3/16
      - name: Fail-closed architecture regressions 4/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=4/16
      - name: Fail-closed architecture regressions 5/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=5/16
      - name: Fail-closed architecture regressions 6/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=6/16
      - name: Fail-closed architecture regressions 7/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=7/16
      - name: Fail-closed architecture regressions 8/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=8/16
      - name: Fail-closed architecture regressions 9/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=9/16
      - name: Fail-closed architecture regressions 10/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=10/16
      - name: Fail-closed architecture regressions 11/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=11/16
      - name: Fail-closed architecture regressions 12/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=12/16
      - name: Fail-closed architecture regressions 13/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=13/16
      - name: Fail-closed architecture regressions 14/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=14/16
      - name: Fail-closed architecture regressions 15/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=15/16
      - name: Fail-closed architecture regressions 16/16
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=16/16
      - name: Verify extracted deterministic architecture boundaries
        run: node scripts/verification/breach-architecture-boundaries.mjs
      - name: Production typecheck, build and build-stamp integrity
        run: npm run build

  # Opt-in historical full suite, separate from bounded PR validation.
  full-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Full historical and current Node test suite
        run: npm test
      - name: Typecheck and production build
        run: npm run build

  # Release safety is a deliberate, independently executable checkpoint;
  # pending Pages deployment should not make ordinary PR test jobs red.
  release-checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse queued, failed or stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
