name: Fieldwork Ground Zero checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Critical checks, full historical regression, or release preflight"
        type: choice
        required: true
        default: critical
        options: [critical, full, release]
permissions:
  contents: read
  actions: read
concurrency:
  group: fieldwork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A9: tests belong to changed source domains, not historical branch-name gates.
# All historical test files remain executable through npm test / Full.
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || inputs.suite == 'critical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify CI workflow and regression ownership
        run: |
          node --test tests/ci-regression-plan.test.mjs
          node scripts/verification/ci-regression-plan.mjs --check
          node scripts/verification/ci-workflow-contract.mjs
      # A1 safe-release checkpoint: cover the changed helmet contract, field
      # visuals, mount compatibility and last approved silhouette without
      # scheduling 32 unrelated, serial regression shards.
      - name: A1 focused helmet and Studio critical regressions
        if: ${{ github.head_ref == 'feature/a1-helmet-unified-and-legacy-removal-20261114' }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            tests/helmet-a1-effective-appearance.test.mjs \
            tests/helmet-h7-field-options.test.mjs \
            tests/helmet-h7-visuals.test.mjs \
            tests/helmet-h10-fit.test.mjs \
            tests/helmet-h13-mount-and-compatibility.test.mjs \
            tests/helmet-h30-reference-contour.test.mjs \
            tests/helmet-h31c-cover-shell-penetration.test.mjs \
            tests/operator-wardrobe-headwear.test.mjs \
            tests/operator-studio-main-menu.test.mjs
      # A2-A/B release gate: validate the touched config and preset contracts
      # without re-running 32 unrelated historical test shards.
      - name: A2 helmet configuration and preset critical regressions
        if: ${{ github.head_ref == 'feature/a2-helmet-config-and-presets-20261114' }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            tests/helmet-a2-configuration.test.mjs \
            tests/operator-studio-a2-presets.test.mjs \
            tests/helmet-a1-effective-appearance.test.mjs \
            tests/helmet-h7-field-options.test.mjs \
            tests/helmet-h13-mount-and-compatibility.test.mjs \
            tests/helmet-h14-pasgt-retrofit-roster.test.mjs \
            tests/helmet-h31c-cover-shell-penetration.test.mjs \
            tests/operator-studio-ux-stage58.test.mjs \
            tests/operator-studio-save-all-stage511.test.mjs \
            tests/operator-wardrobe-headwear.test.mjs \
            tests/operator-wardrobe-persistence.test.mjs
      # Other PRs retain affected-domain and fail-closed architecture coverage.
      - name: Fixed-clock affected-domain and architecture regression shards
        if: ${{ github.head_ref != 'feature/a1-helmet-unified-and-legacy-removal-20261114' && github.head_ref != 'feature/a2-helmet-config-and-presets-20261114' }}
        env:
          CI_BASE_REF: ${{ github.base_ref }}
        run: |
          for shard in {1..16}; do
            node scripts/verification/ci-regression-plan.mjs --run --shard=${shard}/16
          done
          for shard in {1..16}; do
            node scripts/verification/ci-regression-plan.mjs --run --broad-only --shard=${shard}/16
          done
      - name: Verify extracted deterministic architecture boundaries
        if: ${{ github.head_ref != 'feature/a1-helmet-unified-and-legacy-removal-20261114' && github.head_ref != 'feature/a2-helmet-config-and-presets-20261114' }}
        run: node scripts/verification/breach-architecture-boundaries.mjs
      - name: Production typecheck, build and build-stamp integrity
        run: npm run build

  # Opt-in historical full suite, separate from bounded PR validation.
  full-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Full historical and current Node test suite
        run: npm test
      - name: Typecheck and production build
        run: npm run build

  # Release safety is a deliberate, independently executable checkpoint;
  # pending Pages deployment should not make ordinary PR test jobs red.
  release-checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse queued, failed or stale Pages deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
