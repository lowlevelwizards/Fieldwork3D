      - name: Verify previous Pages build is publicly served
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'ux/interaction2-') || startsWith(github.head_ref, 'feature/breach-traversal-') || startsWith(github.head_ref, 'feature/breach-map-clearance-') || startsWith(github.head_ref, 'feature/breach-vault-mantle-') || startsWith(github.head_ref, 'ux/watch-active-marker-') || startsWith(github.head_ref, 'appearance/stage4-') || startsWith(github.head_ref, 'fix/attention-doors-') || startsWith(github.head_ref, 'fix/doorway-right-of-way-') || startsWith(github.head_ref, 'fix/coupled-door-contact-') || startsWith(github.head_ref, 'fix/door-leaf-overlap-') || startsWith(github.head_ref, 'fix/breach-wall-glide-here-window-') || startsWith(github.head_ref, 'feat/rig-r3-') || startsWith(github.head_ref, 'feat/rig-r4-') || startsWith(github.head_ref, 'feature/operator-rig-r5-')) }}
        run: |
          expected="$(git ls-remote origin refs/heads/main | cut -c1-12)"
          for attempt in 1 2 3 4 5 6 7 8; do
            payload="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://lowlevelwizards.github.io/Fieldwork3D/fieldwork-build.json?release-check=${GITHUB_RUN_ID}-${attempt}" || true)"
            served="$(printf '%s' "$payload" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{try{console.log(JSON.parse(s).id||'')}catch{console.log('')}})")"
            if [[ "$served" == "$expected"-* ]]; then
              echo "Pages is serving current main: $served"
              exit 0
            fi
            echo "Waiting for Pages content: expected prefix $expected, observed ${served:-unavailable}"
            sleep 5
          done
          echo "Pages did not serve expected main build" >&2
          exit 1
