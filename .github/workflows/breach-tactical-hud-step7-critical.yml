name: Breach Tactical HUD and Palette Step 7 Critical
on:
  pull_request:
    paths:
      - 'src/breach-main.ts'
      - 'src/ui/tactical-hud-controller.ts'
      - 'src/ui/tactical-palette-controller.ts'
      - 'tests/tactical-hud-palette-controller-step7.test.mjs'
      - '.github/workflows/breach-tactical-hud-step7-critical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: breach-tactical-hud-step7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hud-critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Context commands, placement, feedback and gesture regressions
        run: |
          node --experimental-strip-types --test \
            tests/tactical-hud-palette-controller-step7.test.mjs \
            tests/breach-canvas-gestures.test.mjs \
            tests/breach-context-placement.test.mjs \
            tests/contextual-actions-medical-window-20261108.test.mjs \
            tests/context-dock.test.mjs \
            tests/ux2-22-guidance-recovery-hud.test.mjs
      - name: Production TypeScript and bundle
        run: npm run build
