name: WA5 G36 artwork calibration
on:
  push:
    branches: [feature/wa0-wa2-weapon-art-foundation]
    paths:
      - 'src/weapons/geometry/g36-family-silhouettes.ts'
      - 'scripts/verify-wa5-art-delta.mjs'
      - '.github/workflows/wa5-g36-calibration.yml'
  workflow_dispatch:
concurrency:
  group: wa5-benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/wa3-shared-art-vocabulary.test.mjs tests/weapon-g36-o3-compact-color.test.mjs tests/weapon-g36-p8-hk-identity.test.mjs tests/weapon-g36-family-variants.test.mjs tests/wa0-weapon-art-geometry.test.mjs
      - name: Verify color-only scoped delta against WA4
        run: |
          mkdir -p reports/wa5
          git worktree add --detach /tmp/wa4-art a532c644bb6d619eafe5d9e7f1e9e0310417571d
          ln -s "$PWD/node_modules" /tmp/wa4-art/node_modules
          cp scripts/audit-wa4-art-delta.mjs scripts/capture-weapon-art-baseline.mjs scripts/capture-wa0-operator-context.mjs /tmp/wa4-art/scripts/
          node --experimental-strip-types scripts/audit-wa4-art-delta.mjs reports/wa5/candidate.json
          (cd /tmp/wa4-art && node --experimental-strip-types scripts/audit-wa4-art-delta.mjs "$GITHUB_WORKSPACE/reports/wa5/baseline.json")
          node scripts/verify-wa5-art-delta.mjs reports/wa5/baseline.json reports/wa5/candidate.json reports/wa5/delta.json
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render pinned before and actual candidate
        env:
          WA0_PLATFORMS: g36,custom-g36,accessory-samples
          WA0_OPERATOR_IDS: g36-service,g36-k-dual,g36-c-classic,g36-ka4
        run: |
          WA0_OUTPUT="$PWD/reports/wa5/after" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs
          WA0_OPERATOR_OUTPUT="$PWD/reports/wa5/after/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs
          (cd /tmp/wa4-art && WA0_OUTPUT="$GITHUB_WORKSPACE/reports/wa5/before" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs)
          (cd /tmp/wa4-art && WA0_OPERATOR_OUTPUT="$GITHUB_WORKSPACE/reports/wa5/before/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs)
          node scripts/verify-wa4-capture-pairs.mjs reports/wa5/before reports/wa5/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa5-g36-evidence
          path: reports/wa5/
          if-no-files-found: ignore
