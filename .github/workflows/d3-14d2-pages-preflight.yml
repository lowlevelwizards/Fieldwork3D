# Final postproduction D3.15 live build stamp and idle-queue verification after successful Pages job 43692690474.
# Post-merge D3.15 verify production commit 1ad19d82e045cc4fd20d0dba78b0794a3926cd9d.
# D3.15 independent current main Pages preflight, read-only audit checkpoint.
name: D3.14D2 Pages release preflight
on:
  pull_request:
    paths:
      - '.github/workflows/d3-14d2-pages-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify main Pages queue idle, successful and actually served
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/audit-pages-release-checkpoint.mjs
