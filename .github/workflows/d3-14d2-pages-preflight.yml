name: D3.14D2 Pages release preflight
on:
  pull_request:
    paths:
      - '.github/workflows/d3-14d2-pages-preflight.yml'
      - 'src/campaign-ui.ts'
      - 'src/campaign-style.css'
      - 'src/equipment-preview.ts'
      - 'src/ui/campaign-gear-picker.ts'
      - 'src/arsenal/workbench-screen.ts'
      - 'src/arsenal/arsenal.css'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify main Pages queue idle, successful and actually served
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/audit-pages-release-checkpoint.mjs
