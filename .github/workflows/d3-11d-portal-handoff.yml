name: D3.11D portal stage continuity and 45s safety
on:
  pull_request:
    branches: [feature/d3-2-r2-physical-hinge-body-recovery-20261114]
    paths:
      - 'src/breach-door-maneuver-handoff.ts'
      - 'src/breach-door-traversal-maneuver.ts'
      - 'src/breach-motor-route.ts'
      - 'src/breach-motor-collision.ts'
      - 'tests/release-d3-11d-portal-handoff.test.mjs'
      - '.github/workflows/d3-11d-portal-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-11d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portal-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Door stage, authored order and physics critical tests
        run: |
          node --experimental-strip-types --test tests/release-d3-11d-portal-handoff.test.mjs tests/release-d3-11c-route-handoff.test.mjs tests/release-d3-11ab-route-quality.test.mjs tests/door-traversal-d2.test.mjs tests/release-d3-10b-authored-obstruction.test.mjs tests/release-d3-9c-progress.test.mjs tests/release4-cornering.test.mjs
      - name: Production build
        run: npm run build
      - name: Reproduce Utility 31162 and exact authored handoffs
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --site-index=9 --progress --route-quality --route-transitions --utility-trace > "$RUNNER_TEMP/utility.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const m=data.rows[0].modes.find(x=>x.mode==="authored");
            console.log("D311D_UTILITY",JSON.stringify({
              summary:data.summary,search:data.routeQualitySummary,
              escapeReacquirePairs:data.transitionSummary?.escapeReacquirePairs,
              sources:m.routeTransitions?.counts,
              rook:m.routeQuality.actors.find(x=>x.id==="rook"),
              windows:m.progressEvidence.filter(e=>e.actor==="rook"&&e.suspicious)
            },null,2));
            for(const k of ["exceptions","invalidPositions",
              "physicsStepViolations","corruptedPlans","unboundedManeuverAttempts"])
              if(data.summary[k]>0)throw Error("Utility physical safety: "+k);
          ' "$RUNNER_TEMP/utility.json"
      - name: Paired frozen 45-second corpus against D3.11C
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress --route-quality --route-transitions > "$RUNNER_TEMP/current.json"
          git worktree add --detach "$RUNNER_TEMP/baseline" c604fbe5569289ab7bc7d43bae190f41f588811f
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/baseline/node_modules"
          node --experimental-strip-types "$RUNNER_TEMP/baseline/scripts/audit-r7-squad-execution.mjs" 11 2700 --progress --route-quality --route-transitions > "$RUNNER_TEMP/baseline.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const before=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const after=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const keys=["acceptedFour","physicalArrivals",
              "physicalCompletedFour","completedFour","stallEpisodes","retries",
              "exceptions","invalidPositions","physicsStepViolations",
              "corruptedPlans","unboundedManeuverAttempts"];
            console.log("D311D_PAIRED",JSON.stringify({
              baseline:Object.fromEntries(keys.map(k=>[k,before.summary[k]])),
              current:Object.fromEntries(keys.map(k=>[k,after.summary[k]])),
              searchBefore:before.routeQualitySummary,
              searchAfter:after.routeQualitySummary,
              progressBefore:before.progressSummary,
              progressAfter:after.progressSummary,
              transitionBefore:before.transitionSummary,
              transitionAfter:after.transitionSummary
            },null,2));
            for(const k of ["acceptedFour","physicalArrivals",
              "physicalCompletedFour","completedFour"])
              if(after.summary[k]<before.summary[k])throw Error("arrival regression: "+k);
            for(const k of ["exceptions","invalidPositions",
              "physicsStepViolations","corruptedPlans","unboundedManeuverAttempts"])
              if(after.summary[k]>0)throw Error("safety violation: "+k);
            if(after.progressSummary.suspectedLoops>before.progressSummary.suspectedLoops)
              throw Error("increased movement-loop windows");
          ' "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/current.json"
      - name: Preserve exact case data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-11d-portal-stage-paired45
          path: |
            ${{ runner.temp }}/utility.json
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/current.json
          if-no-files-found: ignore
