name: D3.15 coordinated A plus B4 checkpoint physical acceptance
on:
  pull_request:
    paths:
      - 'src/breach-motor-door.ts'
      - 'src/breach-order-movement.ts'
      - 'src/breach-entry-coordination.ts'
      - 'src/breach-order-wait.ts'
      - 'src/breach-motor-collision.ts'
      - 'src/breach-stack-micro-corner.ts'
      - 'tests/release-d3-15a2-explicit-door-clock.test.mjs'
      - '.github/workflows/d3-15-coordinated-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  physical-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: TypeScript and precisely scoped A/B4 physical ownership
        run: |
          npm run check
          node --experimental-strip-types --test \
           tests/release-d3-15a2-explicit-door-clock.test.mjs \
           tests/release-d3-15b2-doorless-stack-world.test.mjs \
           tests/release-d3-15b4-motor-micro-corner.test.mjs \
           tests/release-d3-14c2-cycle-world-lane.test.mjs \
           tests/release-d3-14d2-retail-rehearsal.test.mjs
      - name: A door-opening restaurant 9473230 actual real motor x 45s
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
           11 2700 --site-index=7 --audit-seed=9473230 --audit-scale=small \
           --progress > "$RUNNER_TEMP/d315-restaurant.json"
      - name: A fully opened townhouse 9568385 actual real motor x 45s
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
           11 2700 --site-index=1 --audit-seed=9568385 --audit-scale=standard \
           --progress > "$RUNNER_TEMP/d315-townhouse.json"
      - name: B4 blocked STACK motel 9492261 real motor x 45s
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
           11 2700 --site-index=8 --audit-seed=9492261 --audit-scale=small \
           --progress --route-transitions > "$RUNNER_TEMP/d315-motel.json"
      - name: Require three independent four-body physical successes and no PlanNode loss
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const site of ['restaurant','townhouse','motel']){
            const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d315-'+site+'.json','utf8'));
            const m=r.rows[0].modes.find(x=>x.mode==='entry');
            console.log('D315_RELEASE_'+site.toUpperCase(),JSON.stringify({
              arrivals:m.arrivals,operators:m.operators,summary:r.summary,
              sources:m.routeTransitions?.byActor}));
            if(m.arrivals!==4||m.operators.some(x=>!x.arrived||x.remainingOrders)||
              m.crossed.some(x=>x===null)||r.summary.exceptions||
              r.summary.invalidPositions||r.summary.physicsStepViolations||
              r.summary.corruptedPlans||r.summary.unboundedManeuverAttempts)
              throw Error(site+' did not physically complete all authored entry goals');
            if(site==='motel'&&(m.routeTransitions?.byActor?.['vale:stack-micro-corner']??0)<1)
              throw Error('no demonstrated physical short-stack recovery');
          }
          NODE
      - name: Historical full 11-site 88-operator physical regression
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
           11 2700 --progress --route-quality > "$RUNNER_TEMP/d315-historical.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d315-historical.json','utf8'));
          const s=r.summary,p=r.progressSummary,q=r.routeQualitySummary;
          console.log('D315_RELEASE_HISTORICAL',JSON.stringify({s,p,q}));
          if(s.physicalArrivals<80||s.physicalCompletedFour<18||
             s.completedFour<21||s.stallEpisodes>8||
             s.exceptions||s.invalidPositions||s.corruptedPlans||
             s.physicsStepViolations||s.unboundedManeuverAttempts||
             p.suspectedLoops||p.sustainedStill||q.searches>2850)
              throw Error('combined D3.15 historical physical regression');
          NODE
      - name: Archive complete 60Hz actual combined A/B4 validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d315-coordinated-three-frozen-and-historical
          path: ${{ runner.temp }}/d315-*.json
          retention-days: 90
