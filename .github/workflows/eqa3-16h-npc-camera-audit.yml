name: EQA3.16H — real NPC camera acceptance
on:
  push:
    branches: [feature/eqa3-16g-hostile-defensive-gestures-20261119]
    paths:
      - 'tests/fixtures/eqa3-16h-presentation.html'
      - 'tests/fixtures/eqa3-16h-presentation.ts'
      - 'scripts/smoke-eqa3-16h-npc-cameras.mjs'
      - '.github/workflows/eqa3-16h-npc-camera-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real 3D rig isometric and overhead frames
        run: node scripts/smoke-eqa3-16h-npc-cameras.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eqa3-16h-npc-presentation-iso-overhead
          path: artifacts/eqa3-16h/
          if-no-files-found: ignore
          retention-days: 14
