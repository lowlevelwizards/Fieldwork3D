name: Replay R2 — Mobile UI Compact Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-r2-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  replay-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install chromium
      - name: Verify compact dock and exclusive mobile tool tabs
        run: node scripts/smoke-replay-r2-ui.mjs
