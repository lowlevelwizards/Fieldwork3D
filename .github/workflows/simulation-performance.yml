name: Simulation performance probe
on:
  pull_request:
    paths:
      - 'scripts/bench-breach-performance.mjs'
      - '.github/workflows/simulation-performance.yml'
      - 'src/breach-game.ts'
      - 'src/breach-ground-view.ts'
      - 'src/breach-replay.ts'
      - 'src/breach-3d.ts'
      - 'src/breach-operator-rig.ts'
      - 'tests/breach-ground-view-performance.test.mjs'
      - 'tests/breach-intel-discovery-performance.test.mjs'
      - 'src/breach-defense.ts'
      - 'src/breach-intel.ts'
      - 'src/breach-core.ts'
      - 'src/breach-route-heap.ts'
      - 'src/breach-spatial-index.ts'
      - 'tests/breach-route-heap-performance.test.mjs'
      - 'tests/breach-spatial-index-performance.test.mjs'
      - 'src/breach-vision-polygon.ts'
      - 'src/breach-fog-mask.ts'
      - 'src/breach-fog-memory.ts'
      - 'tests/breach-fog-ray-broadphase-performance.test.mjs'
      - 'tests/breach-fog-sparse-memory-performance.test.mjs'
  workflow_dispatch:
jobs:
  simulation-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Simulation workload profiles (host CPU, not device FPS)
        run: node --experimental-strip-types scripts/bench-breach-performance.mjs
      - name: Critical AI, muzzle and effects regressions
        run: node --experimental-strip-types --test tests/breach-120.test.mjs tests/breach-133.test.mjs tests/breach-defense-performance.test.mjs tests/breach-perf.test.mjs tests/perf-window-effects.test.mjs tests/breach-142c.test.mjs tests/breach-ground-view-performance.test.mjs tests/breach-intel-discovery-performance.test.mjs tests/breach-route-heap-performance.test.mjs tests/breach-spatial-index-performance.test.mjs tests/dnav-r8-contact-performance.test.mjs tests/breach-fog-ray-broadphase-performance.test.mjs tests/breach-fog-sparse-memory-performance.test.mjs tests/breach-fog-visibility.test.mjs
      - name: Typecheck and production bundle
        run: npm run check && npx vite build
