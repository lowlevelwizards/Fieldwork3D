name: Simulation performance probe
on:
  workflow_dispatch:
jobs:
  simulation-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - name: Simulation workload profiles (host CPU, not device FPS)
        run: node --experimental-strip-types scripts/bench-breach-performance.mjs
      - name: Critical AI, muzzle and effects regressions
        run: node --experimental-strip-types --test tests/breach-120.test.mjs tests/breach-133.test.mjs tests/breach-defense-performance.test.mjs tests/breach-perf.test.mjs tests/perf-window-effects.test.mjs tests/breach-142c.test.mjs tests/breach-ground-view-performance.test.mjs tests/breach-intel-discovery-performance.test.mjs tests/breach-route-heap-performance.test.mjs tests/breach-spatial-index-performance.test.mjs tests/dnav-r8-contact-performance.test.mjs tests/breach-fog-ray-broadphase-performance.test.mjs tests/breach-fog-sparse-memory-performance.test.mjs tests/breach-fog-visibility.test.mjs tests/breach-ai-work-scheduler-performance.test.mjs tests/breach-tactical-route-cache-performance.test.mjs tests/breach-perception-cache-performance.test.mjs tests/breach-p7-fog-layer-performance.test.mjs tests/breach-p7-projected-route-cache.test.mjs tests/breach-p7-replay-sharing.test.mjs tests/dnav-r6-movement-quality.test.mjs
      - name: Typecheck and production bundle
        run: npm run check && npx vite build
