name: Door operating modes
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/door-operating-modes.test.mjs'
      - '.github/workflows/door-operating-modes.yml'
jobs:
  door-modes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/door-operating-modes.test.mjs tests/ei3-contextual-door-pairs.test.mjs tests/breach-door-order-lockpick-regressions.test.mjs tests/gameplay-g4d-auto-door-contact.test.mjs tests/worldgen-double-doors.test.mjs
