name: E6.19 exact transparent-pass visual provenance
on:
  pull_request:
    paths:
      - 'src/rendering/breach-live-main-pass-profiler.ts'
      - 'src/rendering/breach-post-ready-attribution.ts'
      - 'src/rendering/breach-site-scene-builder.ts'
      - 'src/rendering/breach-site-openings-builder.ts'
      - 'src/breach-3d.ts'
      - 'src/breach-fog-cache.ts'
      - 'src/breach-fog-mask.ts'
      - 'src/breach-2d-visibility-renderer.ts'
      - 'tests/w5-fog-depth-disclosure.test.mjs'
      - 'scripts/verification/w5-fog-depth-browser.mjs'
      - 'src/rendering/breach-wall-presentation.ts'
      - 'src/worldgen/wall-surface-recipe.ts'
      - 'src/worldgen/wall-story-residue.ts'
      - 'tests/w6-wall-story-residue.test.mjs'
      - 'scripts/verification/w6-wall-story-browser.mjs'
      - 'src/rendering/wall-surface-atlas.ts'
      - 'src/rendering/wall-structural-packet.ts'
      - 'tests/w4-wall-structural-packet.test.mjs'
      - 'tests/w3-wall-surface-atlas.test.mjs'
      - 'src/rendering/pixel-materials.ts'
      - 'src/map-lab-main.ts'
      - 'map-lab.html'
      - 'tests/w2-wall-surface-recipe.test.mjs'
      - 'scripts/verification/w2-wall-audition-browser.mjs'
      - 'tests/w1-wall-presentation.test.mjs'
      - 'tests/refactor-e6-19-transparent-role.test.mjs'
      - 'scripts/verification/e6-19-transparent-role-browser.mjs'
      - '.github/workflows/refactor-e6-19-transparent-role.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e6-19-transparent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  transparent-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Transparent role, prior draw reconciliation and site visibility regressions
        run: |
          node --experimental-strip-types --test \
            tests/refactor-e6-19-transparent-role.test.mjs \
            tests/refactor-e6-18a-mesh-provenance.test.mjs \
            tests/refactor-e6-18-owner-static-merge.test.mjs \
            tests/refactor-e6-17-main-pass.test.mjs \
            tests/refactor-e6-16-shadow-submission.test.mjs \
            tests/performance-p6-furniture-batching.test.mjs \
            tests/breach-static-batching-performance.test.mjs \
            tests/refactor-e6-15-live-scene-attribution.test.mjs \
            tests/refactor-e6-14-live-execution-cold.test.mjs \
            tests/refactor-e6-13-briefing-idle.test.mjs
      - name: W1 focused segment, fog and replay policy
        if: ${{ startsWith(github.head_ref, 'refactor/w0-w1-') }}
        run: |
          node --experimental-strip-types --test tests/w1-wall-presentation.test.mjs tests/breach-fog-visibility.test.mjs tests/visibility-07-cutaway.test.mjs tests/replay-r7-cutaway.test.mjs tests/breach-roadmap3-3d-disclosure.test.mjs
      - name: W2 anchored effect, material, condition and fog contracts
        if: ${{ (startsWith(github.head_ref, 'refactor/w2-') || startsWith(github.head_ref, 'refactor/w3-')) }}
        run: |
          node --experimental-strip-types --test tests/w2-wall-surface-recipe.test.mjs tests/w3-wall-surface-atlas.test.mjs tests/w1-wall-presentation.test.mjs tests/texture5-07-hot-update.test.mjs tests/texture5-12-wall-sources.test.mjs tests/facade-geometry-polish-20261112.test.mjs tests/breach-fog-visibility.test.mjs tests/fog-exterior-unseen-apertures-regression.test.mjs tests/replay-r7-cutaway.test.mjs
      - name: W4 structural ownership and geometry parity
        if: ${{ startsWith(github.head_ref, 'refactor/w4-') }}
        run: node --experimental-strip-types --test tests/w4-wall-structural-packet.test.mjs tests/w3-wall-surface-atlas.test.mjs tests/w1-wall-presentation.test.mjs tests/facade-geometry-polish-20261112.test.mjs tests/fog-exterior-unseen-apertures-regression.test.mjs tests/replay-r7-cutaway.test.mjs
      - name: W5 critical fog ownership, mask and depth contracts
        if: ${{ startsWith(github.head_ref, 'refactor/w5-') }}
        run: node --experimental-strip-types --test tests/w5-fog-depth-disclosure.test.mjs tests/breach-p7-fog-layer-performance.test.mjs tests/fog-second-generated-quickplay-20261123.test.mjs tests/fog-exterior-unseen-apertures-regression.test.mjs tests/fog-procedural-site-bounds-regression.test.mjs tests/w1-wall-presentation.test.mjs tests/breach-roadmap2-stage3-integration.test.mjs
      - name: W6 fixture-anchor and atlas budget contracts
        if: ${{ startsWith(github.head_ref, 'refactor/w6-') }}
        run: node --experimental-strip-types --test tests/w6-wall-story-residue.test.mjs tests/w2-wall-surface-recipe.test.mjs tests/w3-wall-surface-atlas.test.mjs tests/w4-wall-structural-packet.test.mjs
      - name: Production typecheck and build
        run: npm run build
      - name: W5 critical real canvas and WebGL disclosure
        if: ${{ startsWith(github.head_ref, 'refactor/w5-') }}
        run: node scripts/verification/w5-fog-depth-browser.mjs
      - name: W6 generated site visual, fog and resource parity
        if: ${{ startsWith(github.head_ref, 'refactor/w6-') }}
        run: node scripts/verification/w6-wall-story-browser.mjs
      - name: Two seed real browser transparent draw roles and fog/briefing parity
        if: ${{ !startsWith(github.head_ref, 'refactor/w5-') }}
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/verification/e6-19-transparent-role-browser.mjs
      - name: W0 exact base and matched desktop captures
        if: ${{ startsWith(github.head_ref, 'refactor/w0-w1-') }}
        env:
          FIELDWORK_CI_CHROME: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The PR merge checkout is shallow. Fetch only the exact base object.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/wall-base" "$BASE_SHA"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/wall-base/node_modules"
          cp scripts/verification/e6-19-transparent-role-browser.mjs "$RUNNER_TEMP/wall-base/scripts/verification/"
          mkdir -p artifacts/w0-wall
          cp -r artifacts/refactor-e6-19/live-scene artifacts/w0-wall/candidate-phone
          (cd "$RUNNER_TEMP/wall-base" && FIELDWORK_WALL_WEAR=legacy node scripts/verification/e6-19-transparent-role-browser.mjs)
          cp -r "$RUNNER_TEMP/wall-base/artifacts/refactor-e6-19/live-scene" artifacts/w0-wall/base-phone
          FIELDWORK_WALL_DESKTOP=1 node scripts/verification/e6-19-transparent-role-browser.mjs
          cp -r artifacts/refactor-e6-19/live-scene artifacts/w0-wall/candidate-desktop
          (cd "$RUNNER_TEMP/wall-base" && FIELDWORK_WALL_WEAR=legacy FIELDWORK_WALL_DESKTOP=1 node scripts/verification/e6-19-transparent-role-browser.mjs)
          cp -r "$RUNNER_TEMP/wall-base/artifacts/refactor-e6-19/live-scene" artifacts/w0-wall/base-desktop
      - name: W2 same-site visual audition and resource verification
        if: ${{ (startsWith(github.head_ref, 'refactor/w2-') || startsWith(github.head_ref, 'refactor/w3-')) }}
        env:
          FIELDWORK_CI_CHROME: '1'
          FIELDWORK_W3_ATLAS: '1'
        run: node scripts/verification/w2-wall-audition-browser.mjs
      - name: W2 exact-base live mobile and desktop comparison
        if: ${{ (startsWith(github.head_ref, 'refactor/w2-') || startsWith(github.head_ref, 'refactor/w3-')) }}
        env:
          FIELDWORK_CI_CHROME: '1'
          FIELDWORK_W2_PROBE: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/w2-base" "$BASE_SHA"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/w2-base/node_modules"
          cp scripts/verification/e6-19-transparent-role-browser.mjs "$RUNNER_TEMP/w2-base/scripts/verification/"
          mkdir -p artifacts/w2-live
          OUT="$PWD/artifacts/w2-live"
          for desktop in 0 1; do
            (cd "$RUNNER_TEMP/w2-base" && FIELDWORK_WALL_WEAR=legacy FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/base-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs)
            for mode in packed default; do
              FIELDWORK_WALL_WEAR="$mode" FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/$mode-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs
            done
          done
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const read=(mode,desktop)=>JSON.parse(readFileSync('artifacts/w2-live/'+mode+'-'+desktop+'/summary.json','utf8'));
          for(const desktop of [0,1]){
            const base=read('base',desktop);
            for(const mode of ['packed','default']){
              const test=read(mode,desktop);
              for(const key of ['initialKnowledge','initialVisible','secondVisible']){
                if(base.wallProbe[key]!==test.wallProbe[key])throw Error('W2 disclosure changed: '+mode+' '+key);
              }
              if(test.wallProbe.depthMismatches!==0)throw Error('W2 depth mismatch');
              if(test.runs.some((run,i)=>run.drawCallsP95>base.runs[i].drawCallsP95))throw Error('W2 increased live draws');
            }
          }
          JS
      - name: W4 same-site structural audition
        if: ${{ startsWith(github.head_ref, 'refactor/w4-') }}
        env:
          FIELDWORK_CI_CHROME: '1'
          FIELDWORK_W4_STRUCTURE: '1'
        run: node scripts/verification/w2-wall-audition-browser.mjs
      - name: W4 exact-base W3 vs compiled trim
        if: ${{ startsWith(github.head_ref, 'refactor/w4-') }}
        env:
          FIELDWORK_CI_CHROME: '1'
          FIELDWORK_W2_PROBE: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/w4-base" "$BASE_SHA"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/w4-base/node_modules"
          cp scripts/verification/e6-19-transparent-role-browser.mjs "$RUNNER_TEMP/w4-base/scripts/verification/"
          OUT="$PWD/artifacts/w4-live"
          mkdir -p "$OUT"
          for desktop in 0 1; do
            (cd "$RUNNER_TEMP/w4-base" && FIELDWORK_WALL_WEAR=separate FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/base-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs)
            for mode in compiled unified; do
              FIELDWORK_WALL_WEAR="$mode" FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/$mode-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs
            done
            # Counterbalance run order for the selected unified architecture.
            FIELDWORK_WALL_WEAR=unified FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/unified-repeat-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs
            (cd "$RUNNER_TEMP/w4-base" && FIELDWORK_WALL_WEAR=separate FIELDWORK_WALL_DESKTOP="$desktop" FIELDWORK_WALL_OUTPUT="$OUT/base-repeat-$desktop" node scripts/verification/e6-19-transparent-role-browser.mjs)
          done
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const read=(mode,d)=>JSON.parse(readFileSync('artifacts/w4-live/'+mode+'-'+d+'/summary.json','utf8'));
          for(const d of [0,1]){
            const base=read('base',d);
            const repeatBase=read('base-repeat',d);
            for(const mode of ['compiled','unified','unified-repeat']){
            const test=read(mode,d),reference=mode==='unified-repeat'?repeatBase:base;
            for(const key of ['initialKnowledge','initialVisible','secondVisible'])
              if(reference.wallProbe[key]!==test.wallProbe[key])throw Error('W4 disclosure changed: '+key);
            if(test.wallProbe.depthMismatches!==0)throw Error('W4 depth mismatch');
            for(const [i,run] of test.runs.entries()){
              if(run.drawCallsP95>=reference.runs[i].drawCallsP95)throw Error('W4 failed to reduce live draws');
              if(run.renderSubmission.shadowDrawCallsP95!==reference.runs[i].renderSubmission.shadowDrawCallsP95)throw Error('W4 changed shadow draws');
            }
            }
            for(const [i,run] of read('unified',d).runs.entries()){
              const repeat=read('unified-repeat',d).runs[i];
              const ratios=[run.sceneP95Ms/base.runs[i].sceneP95Ms,repeat.sceneP95Ms/repeatBase.runs[i].sceneP95Ms];
              console.log('W4_REPEAT_TIMING '+JSON.stringify({desktop:d,seed:run.seed,ratios,repeatRegression:ratios.every(r=>r>1.05)}));
            }
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e6-19-transparent-role-evidence
          path: |
            artifacts/refactor-e6-19/live-scene/
            artifacts/w0-wall/
            artifacts/w2-wall-audition/
            artifacts/w2-live/
            artifacts/w4-live/
            artifacts/w5-fog/
            artifacts/w6-story/
          if-no-files-found: ignore
          retention-days: 14
