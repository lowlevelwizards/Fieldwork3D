name: E6.19 exact transparent-pass visual provenance
on:
  pull_request:
    paths:
      - 'src/rendering/breach-live-main-pass-profiler.ts'
      - 'src/rendering/breach-post-ready-attribution.ts'
      - 'src/rendering/breach-site-scene-builder.ts'
      - 'src/rendering/breach-site-openings-builder.ts'
      - 'src/breach-3d.ts'
      - 'src/rendering/breach-wall-presentation.ts'
      - 'tests/w1-wall-presentation.test.mjs'
      - 'tests/refactor-e6-19-transparent-role.test.mjs'
      - 'scripts/verification/e6-19-transparent-role-browser.mjs'
      - '.github/workflows/refactor-e6-19-transparent-role.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e6-19-transparent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  transparent-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Transparent role, prior draw reconciliation and site visibility regressions
        run: |
          node --experimental-strip-types --test \
            tests/refactor-e6-19-transparent-role.test.mjs \
            tests/refactor-e6-18a-mesh-provenance.test.mjs \
            tests/refactor-e6-18-owner-static-merge.test.mjs \
            tests/refactor-e6-17-main-pass.test.mjs \
            tests/refactor-e6-16-shadow-submission.test.mjs \
            tests/performance-p6-furniture-batching.test.mjs \
            tests/breach-static-batching-performance.test.mjs \
            tests/refactor-e6-15-live-scene-attribution.test.mjs \
            tests/refactor-e6-14-live-execution-cold.test.mjs \
            tests/refactor-e6-13-briefing-idle.test.mjs
      - name: W1 focused segment, fog and replay policy
        if: ${{ startsWith(github.head_ref, 'refactor/w0-w1-') }}
        run: |
          node --experimental-strip-types --test tests/w1-wall-presentation.test.mjs tests/breach-fog-visibility.test.mjs tests/visibility-07-cutaway.test.mjs tests/replay-r7-cutaway.test.mjs tests/breach-roadmap3-3d-disclosure.test.mjs
      - name: Production typecheck and build
        run: npm run build
      - name: Two seed real browser transparent draw roles and fog/briefing parity
        env:
          FIELDWORK_CI_CHROME: '1'
        run: node scripts/verification/e6-19-transparent-role-browser.mjs
      - name: W0 exact base and matched desktop captures
        if: ${{ startsWith(github.head_ref, 'refactor/w0-w1-') }}
        env:
          FIELDWORK_CI_CHROME: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The PR merge checkout is shallow. Fetch only the exact base object.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/wall-base" "$BASE_SHA"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/wall-base/node_modules"
          cp scripts/verification/e6-19-transparent-role-browser.mjs "$RUNNER_TEMP/wall-base/scripts/verification/"
          mkdir -p artifacts/w0-wall
          cp -r artifacts/refactor-e6-19/live-scene artifacts/w0-wall/candidate-phone
          (cd "$RUNNER_TEMP/wall-base" && node scripts/verification/e6-19-transparent-role-browser.mjs)
          cp -r "$RUNNER_TEMP/wall-base/artifacts/refactor-e6-19/live-scene" artifacts/w0-wall/base-phone
          FIELDWORK_WALL_DESKTOP=1 node scripts/verification/e6-19-transparent-role-browser.mjs
          cp -r artifacts/refactor-e6-19/live-scene artifacts/w0-wall/candidate-desktop
          (cd "$RUNNER_TEMP/wall-base" && FIELDWORK_WALL_DESKTOP=1 node scripts/verification/e6-19-transparent-role-browser.mjs)
          cp -r "$RUNNER_TEMP/wall-base/artifacts/refactor-e6-19/live-scene" artifacts/w0-wall/base-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e6-19-transparent-role-evidence
          path: |
            artifacts/refactor-e6-19/live-scene/
            artifacts/w0-wall/
          if-no-files-found: ignore
          retention-days: 14
