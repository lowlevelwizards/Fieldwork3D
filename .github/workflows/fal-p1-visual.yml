name: FAL P9 — Final alignment, finish parity and live-studio lighting
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/weapons/geometry/fal-core-silhouette.ts'
      - 'src/weapons/geometry/fal-receiver-form.ts'
      - 'src/fal-stage1-lab.ts'
      - 'fal-stage1-lab.html'
      - 'src/weapons/geometry/fal-silhouettes.ts'
      - 'src/weapons/geometry/fal-handguard-profiles.ts'
      - 'src/weapons/geometry/fal-magazine-profiles.ts'
      - 'src/weapons/geometry/weapon-receiver-anatomy.ts'
      - 'src/weapons/geometry/weapon-visual-palette.ts'
      - 'src/operator-carried-magazines.ts'
      - 'tests/weapon-fal-stage1-blockout.test.mjs'
      - 'tests/weapon-fal-stage2-family.test.mjs'
      - 'tests/weapon-fal-p1-identity.test.mjs'
      - 'tests/weapon-fal-p2-style.test.mjs'
      - 'tests/weapon-fal-p3-reference-style.test.mjs'
      - 'tests/weapon-fal-p4-receiver.test.mjs'
      - 'tests/weapon-fal-p5-triangle.test.mjs'
      - 'tests/weapon-fal-p6-geometry-budget.test.mjs'
      - 'tests/weapon-fal-p8-proportions.test.mjs'
      - 'tests/weapon-fal-p9-final-alignment.test.mjs'
      - 'tests/arsenal-v2-inspection-presentation.test.mjs'
      - 'src/arsenal/inspection-lighting.ts'
      - 'scripts/audit-weapon-geometry.mjs'
      - 'scripts/smoke-fal-p1-visual.mjs'
      - '.github/workflows/fal-p1-visual.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify FAL identity and legacy compatibility
        run: |
          node --experimental-strip-types --test \
            tests/weapon-fal-stage1-blockout.test.mjs \
            tests/weapon-fal-stage2-family.test.mjs \
            tests/weapon-fal-p1-identity.test.mjs \
            tests/weapon-fal-p2-style.test.mjs \
            tests/weapon-fal-p3-reference-style.test.mjs \
            tests/weapon-fal-p4-receiver.test.mjs \
            tests/weapon-fal-p5-triangle.test.mjs \
            tests/weapon-fal-p6-geometry-budget.test.mjs \
            tests/weapon-fal-p8-proportions.test.mjs \
            tests/weapon-fal-p9-final-alignment.test.mjs \
            tests/arsenal-v2-inspection-presentation.test.mjs
      - name: Quantify emitted triangles against existing weapons
        run: node --experimental-strip-types scripts/audit-weapon-geometry.mjs
      - name: Typecheck and production compile
        run: npm run check && npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture actual shared-scale M4/G3/FAL 3D views
        run: node scripts/smoke-fal-p1-visual.mjs
      - name: Verify dark-background live-lit Arsenal Workbench on mobile
        run: FW_F5_CAPTURE=1 node scripts/smoke-arsenal-lighting-r714.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fal-p9-final-3d-comparisons
          path: |
            fal-p1-captures/
            visual-foundation-f5-captures/
          if-no-files-found: ignore
          retention-days: 14
