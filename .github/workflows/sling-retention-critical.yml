name: SR sling refinement critical
on:
  push:
    branches: [feature/sr-sling-refinement, feature/sr-sling-contact-polish, feature/sr-simple-sling, feature/sr-authored-sockets, feature/sr-pack-motion]
  workflow_dispatch:
concurrency:
  group: sr-critical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/sling-retention-sr*.test.mjs tests/weapon-retention-wr*.test.mjs tests/breach-roadmap3-sling-pose.test.mjs tests/equipment-21-06-sling-loop.test.mjs tests/operator-magazine-dedicated-pouch-bottom-fit.test.mjs tests/breach-reload-v4-magazine.test.mjs tests/equipment-field-visuals.test.mjs tests/equipment-field-visual-rig.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node scripts/smoke-sling-retention.mjs
        env:
          FIELDWORK_CI_CHROME: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sling-retention-mobile-captures
          path: sling-retention-captures/
          if-no-files-found: ignore
