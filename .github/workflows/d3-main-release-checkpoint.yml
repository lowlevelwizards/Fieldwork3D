name: D3 consolidated main release checkpoint
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-main-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Critical physical door, route, corner and exact collision regressions
        run: |
          node --experimental-strip-types --test \
            tests/release-d3-9-single-opener.test.mjs \
            tests/release-d3-10a-entry-targets.test.mjs \
            tests/release-d3-10b-authored-obstruction.test.mjs \
            tests/release-d3-11d-portal-handoff.test.mjs \
            tests/release-d3-11e-corner-lookahead.test.mjs \
            tests/release-d3-12a-swept-parity.test.mjs \
            tests/release-d3-12b-squeeze-parity.test.mjs \
            tests/door-traversal-d4-physics.test.mjs \
            tests/passage-q5-approaches.test.mjs \
            tests/release-d3-14d2-retail-rehearsal.test.mjs \
            tests/release-d3-14c2-cycle-world-lane.test.mjs \
            tests/release-d3-14b2-narrow-leaf-exit.test.mjs \
            tests/release-d3-17c-physical-departure.test.mjs \
            tests/release-d3-17b-route-recurrence.test.mjs \
            tests/release-d3-17a-loop-forensics.test.mjs \
            tests/release-d3-15b4-motor-micro-corner.test.mjs \
            tests/release-d3-17d-door-route-join.test.mjs \
            tests/ci-d3-physical-truth.test.mjs
      - name: TypeScript and deployable Pages build
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/fieldwork-build.json
      - name: Full 45-second 88-operator mainline merge acceptance
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --d329-cancellation-door-witness --progress --route-quality > "$RUNNER_TEMP/release45.json"
          node scripts/verify-d3-30-mainline.mjs "$RUNNER_TEMP/release45.json"
      - name: Frozen 176-body lock provenance, pending orders, loop recovery and exact physical waypoints
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 22 2700 \
            --d315b4-blind22 --progress --route-transitions --d329-cancellation-door-witness \
            --trace-cases=13919313:entry:ash,14136777:entry:ash,14462973:authored:ash \
            > "$RUNNER_TEMP/frozen22.json"
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --site-index=9 --audit-seed=14462973 --audit-scale=standard \
            --progress --route-transitions --d329-cancellation-door-witness \
            --trace-actor=ash --trace-mode=authored \
            > "$RUNNER_TEMP/court.json"
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 \
            --site-index=3 --audit-seed=5412896 --audit-scale=small \
            --progress --route-transitions \
            --trace-actor=rook --trace-mode=authored \
            > "$RUNNER_TEMP/retail.json"
          node scripts/verification/ci-d3-physical-truth.mjs \
            "$RUNNER_TEMP/release45.json" "$RUNNER_TEMP/frozen22.json" \
            "$RUNNER_TEMP/court.json" "$RUNNER_TEMP/retail.json"
      - name: Retain full physical acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-main-release-45s
          path: |
            ${{ runner.temp }}/release45.json
            ${{ runner.temp }}/frozen22.json
            ${{ runner.temp }}/court.json
            ${{ runner.temp }}/retail.json
          if-no-files-found: ignore
