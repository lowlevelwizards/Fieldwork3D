name: D3.11A-B route evidence, owner-world safety and 45s parity
on:
  pull_request:
    branches: [feature/d3-2-r2-physical-hinge-body-recovery-20261114]
    paths:
      - src/breach-core.ts
      - src/breach-motor-route.ts
      - src/breach-squeeze-route.ts
      - scripts/audit-r7-squad-execution.mjs
      - scripts/lib/d3-11-route-quality.mjs
      - tests/release-d3-11ab-route-quality.test.mjs
      - .github/workflows/d3-11ab-route-quality.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-11ab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: D3.11A/B targeted and prior safeguards
        run: node --experimental-strip-types --test tests/release-d3-11ab-route-quality.test.mjs tests/release-d3-10b-authored-obstruction.test.mjs tests/release-d3-10b-diagnostic-parity.test.mjs tests/release4-cornering.test.mjs tests/release-d3-9c-progress.test.mjs
      - name: Production build
        run: npm run build
      - name: Utility 31162 focused 45-second trace
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --site-index=9 --progress --route-quality --utility-trace > "$RUNNER_TEMP/utility.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const m=data.rows[0].modes.find(x=>x.mode==="authored");
            const trace=m.routeQuality.trace;
            const events=m.progressEvidence.filter(x=>x.actor==="rook");
            console.log("D311_UTILITY",JSON.stringify({
              summary:data.summary,quality:data.routeQualitySummary,
              rook:m.routeQuality.actors.find(x=>x.id==="rook"),
              eventWindows:events,
              trace:trace.filter((x,i)=>i%4===0||x.blocked>.85||x.retries>0),
              grid:m.gridAudit},null,2));
            if(data.summary.exceptions||data.summary.invalidPositions||
               data.summary.physicsStepViolations||data.summary.corruptedPlans)
              throw Error("invalid focused execution");
          ' "$RUNNER_TEMP/utility.json"
      - name: D3.11A/B paired 45-second full-corpus parity
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress --route-quality > "$RUNNER_TEMP/current45.json"
          git worktree add --detach "$RUNNER_TEMP/d310b" 8e6934007056291497db7f31bca883a99ef2b1d4
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/d310b/node_modules"
          node --experimental-strip-types "$RUNNER_TEMP/d310b/scripts/audit-r7-squad-execution.mjs" 11 2700 --progress > "$RUNNER_TEMP/baseline45.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const before=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const after=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            console.log("D311_PAIRED_45",JSON.stringify({
              baseline:before.summary,current:after.summary,
              quality:after.routeQualitySummary,
              progressBaseline:before.progressSummary,
              progressCurrent:after.progressSummary},null,2));
            for(const k of ["acceptedFour","physicalArrivals",
               "physicalCompletedFour","completedFour"])
              if(after.summary[k]<before.summary[k])
                throw Error("movement outcome regression: "+k);
            for(const k of ["exceptions","invalidPositions",
               "physicsStepViolations","corruptedPlans",
               "unboundedManeuverAttempts"])
              if(after.summary[k]>0)throw Error("safety regression: "+k);
          ' "$RUNNER_TEMP/baseline45.json" "$RUNNER_TEMP/current45.json"
      - name: Preserve full witness data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-11ab-utility-and-paired45
          path: |
            ${{ runner.temp }}/utility.json
            ${{ runner.temp }}/baseline45.json
            ${{ runner.temp }}/current45.json
          if-no-files-found: ignore
