name: River Geometry Visual Audit

on:
  workflow_dispatch:
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm install --no-package-lock
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-river-lab.mjs
      - run: node scripts/capture-live-ground.mjs
      - run: node scripts/capture-region.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdigris-river-lab-screenshots
          path: river-lab-captures/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdigris-live-ground-mobile
          path: live-ground-captures/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutwoods-region-mobile
          path: region-032-captures/
          if-no-files-found: ignore
          retention-days: 14
