name: River Geometry Visual Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/river-*.ts'
      - 'src/terrain-model.ts'
      - 'river-lab.html'
      - 'scripts/capture-river-lab.mjs'
      - '.github/workflows/river-visual-audit.yml'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/capture-river-lab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdigris-river-lab-screenshots
          path: river-lab-captures/
          if-no-files-found: ignore
          retention-days: 14
