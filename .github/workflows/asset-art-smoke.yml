name: Asset silhouette smoke
on:
  pull_request:
    paths:
      - 'src/worldgen/asset-character-visuals.ts'
      - 'src/worldgen/fixture-visuals.ts'
      - 'src/worldgen/foliage-card-visuals.ts'
      - 'src/worldgen/exterior-sites.ts'
      - 'src/worldgen/public-street-layout.ts'
      - 'src/rendering/curb-ramp-wedge.ts'
      - 'src/worldgen/parking-stalls.ts'
      - 'src/worldgen/service-yard-layout.ts'
      - 'tests/exterior-curb-service-20261108.test.mjs'
      - 'src/worldgen/property-surfaces.ts'
      - 'src/worldgen/outdoor-fixture-policy.ts'
      - 'tests/public-street-layout-20261108.test.mjs'
      - 'tests/outdoor-service-seating-20261108.test.mjs'
      - 'src/worldgen/landscape-edge-program.ts'
      - 'src/worldgen/outdoor-fixture-policy.ts'
      - 'tests/exterior-realism-stage1-20261108.test.mjs'
      - 'src/breach-3d.ts'
      - 'src/worldgen/road-service-fixtures.ts'
      - 'tests/replay-prop-stability-20261108.test.mjs'
      - 'tests/map-29-architecture-hardware.test.mjs'
      - 'src/worldgen/detailed-fixture-visuals.ts'
      - 'src/worldgen/asset-review.ts'
      - 'tests/map-22-asset-audit.test.mjs tests/map-30-asset-condition.test.mjs tests/map-32-full-asset-render-smoke.test.mjs'
      - 'src/asset-lab-main.ts'
      - 'tests/map-21-asset-character-pass.test.mjs'
      - '.github/workflows/asset-art-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Fixture geometry and scale regression
        run: node --experimental-strip-types --test tests/map-21-asset-character-pass.test.mjs tests/map-17-vehicles.test.mjs tests/map-04-fixture-renderer.test.mjs tests/map-01-asset-registry.test.mjs tests/map-22-asset-audit.test.mjs tests/replay-prop-stability-20261108.test.mjs tests/map-28-organic-silhouettes.test.mjs tests/exterior-realism-stage1-20261108.test.mjs tests/public-street-layout-20261108.test.mjs tests/outdoor-service-seating-20261108.test.mjs tests/worldgen-28a-entrance-lane.test.mjs tests/worldgen-35-02-parking-program.test.mjs tests/exterior-curb-service-20261108.test.mjs tests/worldgen-28c-service-yards.test.mjs
      - name: Typecheck
        run: npm run check
