name: D3.14B sixth blind 22-map paired physical acceptance
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: d3-14b-sixth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Candidate exact PR head
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Immutable released H4 movement baseline
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: b655efdd79ff244e0ff3d9f681b50c6ef2e2d4e0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Freeze identical harness and 22-map corpus in both versions
        run: |
          cp candidate/scripts/audit-r7-squad-execution.mjs baseline/scripts/audit-r7-squad-execution.mjs
          cp candidate/scripts/lib/d3-14b-sixth-blind22.mjs baseline/scripts/lib/d3-14b-sixth-blind22.mjs
          cp candidate/scripts/lib/d3-14b-narrow-exit-probe.mjs baseline/scripts/lib/d3-14b-narrow-exit-probe.mjs
          npm --prefix baseline install --no-audit --no-fund
          npm --prefix candidate install --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/d3-14b"
      - name: Released H4 · sixth unseen 22 maps × two modes × four × 45s
        run: |
          cd baseline
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --d314b-blind22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-14b/baseline.json"
      - name: D3.14B2 · identical maps, orders and 60Hz physics
        run: |
          cd candidate
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs \
            22 2700 --d314b-blind22 --progress --route-quality \
            > "$RUNNER_TEMP/d3-14b/candidate.json"
      - name: Enforce paired physical quality and performance no-regression
        run: |
          cd candidate
          node scripts/report-d3-14b-blind22.mjs \
            "$RUNNER_TEMP/d3-14b/baseline.json" \
            "$RUNNER_TEMP/d3-14b/candidate.json"
      - name: Retain both full physical simulations and changed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-14b-sixth-frozen22-baseline-vs-b2
          path: ${{ runner.temp }}/d3-14b/*.json
          if-no-files-found: ignore
          retention-days: 90
