name: D3.13C read-only generated door hinge sweep audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-generated-door-swing.mjs'
      - '.github/workflows/d3-13c-hinge-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Unseen 22-map static hinge clearance 32% vs 72%
        run: node --experimental-strip-types scripts/audit-generated-door-swing.mjs 22 1200201 9311
      - name: First fixed 22-map geometry audit (diagnostic only)
        run: node --experimental-strip-types scripts/audit-generated-door-swing.mjs 22 728413 11131
