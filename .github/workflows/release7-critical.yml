name: Release 7 squad execution critical
on:
  push:
    branches:
      - 'feature/release7-squad-reliability-*'
  pull_request:
    paths:
      - 'scripts/audit-r7-squad-execution.mjs'
      - 'scripts/audit-squad-entry-b.mjs'
      - 'src/breach-passage.ts'
      - 'src/breach-game.ts'
      - 'src/breach-entry-lanes.ts'
      - 'tests/squad-entry-b-*.test.mjs'
      - '.github/workflows/release7-critical.yml'
  workflow_dispatch:
concurrency:
  group: release7-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  squad-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Critical real-motor, queue, and authored-attention regressions
        run: |
          node --experimental-strip-types --test tests/squad-flow-a1.test.mjs tests/doorway-convoy-flow.test.mjs tests/squad-entry-b-sectors.test.mjs tests/squad-entry-b-continuity.test.mjs tests/breach-149.test.mjs tests/release7-squad-queue.test.mjs tests/release7-order-recovery.test.mjs tests/release7-entry-watch.test.mjs tests/release7-mobile-clarity.test.mjs tests/release7-door-intent.test.mjs tests/release7-obstructed-entry-gate.test.mjs
      - name: Generated R7.1 execution smoke (observability only)
        run: node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 3 600
      - name: Release checkpoint - genuine four-operator entry fixtures
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types scripts/audit-squad-entry-b.mjs
      - name: Release checkpoint - eleven seeded real building layouts
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 900
      - name: Release checkpoint - typecheck and production build
        if: github.event_name == 'pull_request'
        run: npm run build
