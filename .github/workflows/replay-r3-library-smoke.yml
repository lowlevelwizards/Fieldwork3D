name: Replay R3 — Durable Library Browser Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-r3-library-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  library-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install chromium
      - name: Verify IndexedDB save/reload/watch/delete and mobile library
        run: node scripts/smoke-replay-r3-library.mjs
