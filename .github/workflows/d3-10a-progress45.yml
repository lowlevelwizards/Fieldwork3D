name: D3.10A 45-second progress and obstruction triage
on:
  push:
    branches: [feature/d3-9-clean-single-opener-20261114]
    paths:
      - scripts/audit-r7-squad-execution.mjs
      - src/breach-d3-c-progress.ts
      - tests/release-d3-9c-progress.test.mjs
      - .github/workflows/d3-10a-progress45.yml
      - src/breach-motor-door.ts
      - src/breach-motor-collision.ts
      - src/breach-order-movement.ts
      - src/breach-game.ts
      - src/breach-entry-lanes.ts
      - src/breach-intel.ts
      - src/breach-entry-target-settle.ts
      - tests/release-d3-10a-entry-targets.test.mjs
      - src/breach-passage-coordinator.ts
      - src/breach-door-traversal-episode.ts
      - src/breach-door-opening-footwork.ts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-10a-progress45-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Validate progress classification
        run: node --experimental-strip-types --test tests/release-d3-9c-progress.test.mjs
      - name: Build / typecheck
        run: npm run build
      - name: D3.10A entry endpoint invariants
        run: |
          if test -f tests/release-d3-10a-entry-targets.test.mjs; then node --experimental-strip-types --test tests/release-d3-10a-entry-targets.test.mjs; fi
      - name: 45-second observed real-world corpus
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress > "$RUNNER_TEMP/c45.json"
          node -e 'const r=require(process.argv[1]);const bad=r.rows.flatMap(site=>(site.modes??[]).flatMap(m=>(m.progressEvidence??[]).filter(w=>w.suspicious).map(w=>({site:site.archetype,seed:site.seed,mode:m.mode,actor:w.actor,...w}))));const pending=r.rows.flatMap(site=>(site.modes??[]).flatMap(m=>(m.operators??[]).filter(a=>!a.arrived).map(a=>({site:site.archetype,seed:site.seed,mode:m.mode,id:a.id,remaining:a.remaining,travel:a.progressDistance,blocked:a.blockedSeconds,pause:a.motorPause,nav:a.nextNav,episode:a.doorEpisode}))));const flips=r.rows.flatMap(site=>(site.modes??[]).flatMap(m=>(m.doorFlipDetails??[]).filter(d=>d.flips>=2).map(d=>({site:site.archetype,seed:site.seed,mode:m.mode,...d}))));console.log("D3.10A45",JSON.stringify({summary:r.summary,progress:r.progressSummary,bad,pending,flips},null,2));if(r.summary.invalidPositions||r.summary.physicsStepViolations||r.summary.corruptedPlans)throw Error("unsafe motion or plan corruption")' "$RUNNER_TEMP/c45.json"
      - name: Retain full per-five-second evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-10a-45s-progress-witness
          path: ${{ runner.temp }}/c45.json
          if-no-files-found: ignore
