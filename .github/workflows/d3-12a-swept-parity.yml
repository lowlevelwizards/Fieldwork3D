name: D3.12A-B exact body and squeeze parity with 45-second safety
on:
  pull_request:
    branches: [feature/d3-11e-bounded-corner-lookahead-20261114]
    paths:
      - 'src/breach-navigation.ts'
      - 'tests/release-d3-12a-swept-parity.test.mjs'
      - 'tests/release-d3-12b-squeeze-parity.test.mjs'
      - '.github/workflows/d3-12a-swept-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d3-12a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swept-physicality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Exact body and squeeze parity and doorway safeguards
        run: |
          node --experimental-strip-types --test tests/release-d3-12a-swept-parity.test.mjs tests/release-d3-12b-squeeze-parity.test.mjs tests/door-traversal-d4-physics.test.mjs tests/release-d3-11d-portal-handoff.test.mjs tests/release4-cornering.test.mjs tests/release-d3-11e-corner-lookahead.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: Paired 45-second authentic physical motor comparison
        run: |
          node --experimental-strip-types scripts/audit-r7-squad-execution.mjs 11 2700 --progress --route-quality > "$RUNNER_TEMP/current.json"
          git worktree add --detach "$RUNNER_TEMP/baseline" 6d1695a1bac18abbf4691c53a3f7bce7d341c109
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/baseline/node_modules"
          node --experimental-strip-types "$RUNNER_TEMP/baseline/scripts/audit-r7-squad-execution.mjs" 11 2700 --progress --route-quality > "$RUNNER_TEMP/baseline.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const ks=["acceptedFour","physicalArrivals","physicalCompletedFour",
             "completedFour","stallEpisodes","retries","reversalsNearDoor",
             "invalidPositions","physicsStepViolations","corruptedPlans"];
            const pick=o=>Object.fromEntries(ks.map(k=>[k,o[k]]));
            console.log("D312A_PAIRED",JSON.stringify({
             before:pick(b.summary),after:pick(c.summary),
             progressBefore:b.progressSummary,progressAfter:c.progressSummary,
             routeBefore:b.routeQualitySummary,routeAfter:c.routeQualitySummary
            },null,2));
            for(const key of ["acceptedFour","physicalArrivals",
               "physicalCompletedFour","completedFour"])
              if(c.summary[key]<b.summary[key])throw Error("physical outcome regression "+key);
            for(const key of ["exceptions","invalidPositions","physicsStepViolations",
              "corruptedPlans","unboundedManeuverAttempts"])
              if(c.summary[key]>0)throw Error("physical safety violation "+key);
            if(c.progressSummary.sustainedStill>b.progressSummary.sustainedStill||
               c.progressSummary.suspectedLoops>b.progressSummary.suspectedLoops)
              throw Error("new sustained stall or loop");
            if(c.summary.stallEpisodes>b.summary.stallEpisodes)
              throw Error("more stall episodes");
            if(c.routeQualitySummary.searches>b.routeQualitySummary.searches*1.05)
              throw Error("A* count inflated");
          ' "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/current.json"
      - name: Paired deterministic audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-12ab-paired45
          path: |
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/current.json
          if-no-files-found: ignore
