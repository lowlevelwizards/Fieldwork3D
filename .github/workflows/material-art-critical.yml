name: Material art critical checks
on:
  pull_request:
    paths:
      - 'src/worldgen/wall-surface-recipe.ts'
      - 'src/worldgen/wall-weathering-art.ts'
      - 'src/wall-material-lab*'
      - 'wall-material-lab.html'
      - 'src/rendering/pixel-decals.ts'
      - 'src/rendering/pixel-recipes.ts'
      - 'src/worldgen/condition-visual.ts'
      - 'src/rendering/floor-wear-raster.ts'
      - 'src/worldgen/object-wear.ts'
      - 'src/rendering/wear-finish.ts'
      - 'src/rendering/fixture-wear-projection.ts'
      - 'src/rendering/material-art-*.ts'
      - 'src/rendering/wall-surface-atlas.ts'
      - 'src/rendering/floor-surface-atlas.ts'
      - 'scripts/verification/ma-material-art-browser.mjs'
      - 'tests/ma-*.test.mjs'
      - '.github/workflows/material-art-critical.yml'
jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Targeted art and atlas contracts
        run: node --experimental-strip-types --test tests/ma-*.test.mjs tests/wall-material-lab.test.mjs tests/w3-wall-surface-atlas.test.mjs tests/w7-floor-surface-atlas.test.mjs tests/w8-material-condition.test.mjs tests/texture2-02-profiles.test.mjs
      - name: Production build
        run: |
          npm run build
          test -s dist/wall-material-lab.html
      - name: Install browser harness
        if: github.head_ref == 'feature/ma-r-acceptance'
        run: npm install --no-save --package-lock=false playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Pin pre-refinement visual reference
        if: github.head_ref == 'feature/ma-r-acceptance'
        run: |
          git fetch --no-tags --depth=1 origin 323088e0b8d327279907f4f0d00fc642d95dfd16
          git worktree add --detach "$RUNNER_TEMP/ma-reference" 323088e0b8d327279907f4f0d00fc642d95dfd16
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/ma-reference/node_modules"
          echo "MA_REFERENCE_ROOT=$RUNNER_TEMP/ma-reference" >> "$GITHUB_ENV"
      - name: Real-renderer art comparison
        if: github.head_ref == 'feature/ma-r-acceptance'
        run: node scripts/verification/ma-material-art-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.head_ref == 'feature/ma-r-acceptance'
        with:
          name: ma-material-art-comparison
          path: artifacts/ma-art/
          retention-days: 14
