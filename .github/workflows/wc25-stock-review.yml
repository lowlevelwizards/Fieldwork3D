name: WC2.5 AR stock artwork review
on:
  push:
    branches: [art/wc25-ar-stock-caricatures]
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node --experimental-strip-types scripts/capture-wc25-stock-art.mjs
      - run: node --experimental-strip-types --test tests/wc25-ar-stock-art.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc25-ar-stock-review
          path: reports/wc25/
          if-no-files-found: error
