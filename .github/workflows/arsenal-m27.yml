name: Arsenal M2.7 touch mounting Workbench
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/arsenal/**'
      - 'src/arsenal-m27-smoke.ts'
      - 'src/weapons/geometry/mounted-accessory-layout.ts'
      - 'tests/arsenal-m27-*.test.mjs'
      - 'scripts/smoke-arsenal-m27-touch.mjs'
      - 'arsenal-m27-smoke.html'
      - '.github/workflows/arsenal-m27.yml'
permissions:
  contents: read
  actions: read
jobs:
  critical:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Physical picker, editor, economy and M2.6 migration regressions
        run: |
          node --experimental-strip-types --test \
            tests/arsenal-m27-mount-picker.test.mjs \
            tests/arsenal-m26-persistent-mounts.test.mjs \
            tests/arsenal-m26-transactions.test.mjs \
            tests/arsenal-m26-kit-quickplay.test.mjs \
            tests/arsenal-m26-stock-transfer.test.mjs \
            tests/arsenal-v2-assembly.test.mjs
      - name: TypeScript
        run: npm run check
      - name: Production compile
        run: npm run build
  visual:
    needs: critical
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Actual Workbench mobile and desktop touch interactions
        run: node scripts/smoke-arsenal-m27-touch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arsenal-m27-touch-workbench-acceptance
          path: |
            reports/arsenal-m27-desktop.png
            reports/arsenal-m27-mobile.png
            reports/arsenal-m27-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
  release-preflight:
    needs: [critical, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify previous Pages success, no running publish and served build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-pages-release-checkpoint.mjs
