name: Equipment E1–E2 — Phone Gear Flow
on:
  pull_request:
    paths:
      - 'src/campaign-ui.ts'
      - 'src/campaign-style.css'
      - 'src/ui/campaign-gear-picker.ts'
      - 'src/ui/quick-loadout-groups.ts'
      - 'scripts/smoke-ux-r3-campaign.mjs'
      - '.github/workflows/equipment-ux-critical.yml'
permissions:
  contents: read
concurrency:
  group: campaign-equipment-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  equipment-phone:
    if: ${{ startsWith(github.head_ref, 'ui/equipment-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify phone roster, categories, gear chooser and Studio handoff
        run: node scripts/smoke-ux-r3-campaign.mjs
