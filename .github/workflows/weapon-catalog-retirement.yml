name: Weapon catalog retirement
on:
  push:
    branches: [feature/wa0-wa2-weapon-art-foundation, refactor/catalog-runtime-retirement]
    paths:
      - 'src/breach-weapon-geometry.ts'
      - 'src/breach-weapon-issue.ts'
      - 'src/breach-quickplay-kit-preferences.ts'
      - 'src/equipment-deployment-snapshot.ts'
      - 'tests/weapon-catalog-migration.test.mjs'
      - 'tests/weapon-catalog-ownership.test.mjs'
      - 'src/equipment-weapon-identity.ts'
      - 'src/equipment-weapon-ownership.ts'
      - 'src/campaign-state.ts'
      - 'src/campaign-weapon-procurement.ts'
      - 'src/dispatch-starter-choices.ts'
      - 'src/campaign-ui.ts'
      - 'src/breach-campaign-flow.ts'
      - 'src/breach-roster.ts'
      - 'src/arsenal/quickplay-adapter.ts'
      - 'src/arsenal/apply-guidance.ts'
      - 'src/arsenal/workbench-screen.ts'
      - 'tests/g36-reference-campaign-integration.test.mjs'
      - 'tests/dispatch-d3-1-starter-policy.test.mjs'
      - 'tests/weapon-workbench-mobile-sockets.test.mjs'
      - 'tests/arsenal-v2-quickplay-adapter.test.mjs'
      - 'tests/arsenal-r9-load-ui.test.mjs'
      - 'tests/arsenal-r13-model-picker.test.mjs'
      - 'tests/arsenal-r14-apply-guidance.test.mjs'
      - 'src/breach-quickplay-controller.ts'
      - 'src/ui/outfitter-choice-sources.ts'
      - 'src/ui/quick-play-configurator.ts'
      - 'src/breach-operations-board-controller.ts'
      - 'src/dispatch-weapon-access.ts'
      - 'src/dispatch-campaign-review.ts'
      - 'src/faction-reference-loadout-apply.ts'
      - 'tests/operations-landing-navigation.test.mjs'
      - 'tests/weapon-ar-r44-silhouettes.test.mjs'
      - 'tests/weapon-ar-r45-silhouettes.test.mjs'
      - 'tests/faction-reference-loadout-ft1-3.test.mjs'
      - 'src/arsenal/wa-art-models.ts'
      - 'scripts/verify-catalog-retirement.mjs'
      - 'scripts/smoke-fal-p1-visual.mjs'
      - 'scripts/smoke-fnc-arsenal.mjs'
      - '.github/workflows/weapon-catalog-retirement.yml'
  workflow_dispatch:
jobs:
  retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current branch dependency inventory
        run: |
          mkdir -p reports/retirement
          git grep -nE 'WeaponId|WEAPON_PLATFORMS|\bWEAPONS\b|primary-(carbine|smg|rifle|shotgun)|resolveCatalogConfiguration' -- src > reports/retirement/class-dependencies.txt || true
          git grep -nE 'legacy-shotgun|weaponSilhouetteParts|weaponDetailParts|weaponSignatureParts|compileLegacyShotgunBody|shotgun-legacy|arsenal-m30-shotgun-capture' -- src scripts tests .github '*.html' > reports/retirement/obsolete-art-references.txt || true
          wc -l reports/retirement/*.txt
          cat reports/retirement/obsolete-art-references.txt
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/operator-weapon-detail.test.mjs tests/replay-weapon-and-retired-geometry.test.mjs tests/equipment-19-02-weapon-silhouettes.test.mjs tests/wa0-weapon-art-inventory.test.mjs tests/wa0-weapon-art-geometry.test.mjs tests/arsenal-m30-weapon-quality-audit.test.mjs tests/weapon-catalog-migration.test.mjs tests/quickplay-field-preferences.test.mjs tests/equipment-deployment-snapshot.test.mjs tests/ci-weapon-visual-routing.test.mjs tests/weapon-catalog-ownership.test.mjs tests/equipment-27-00-weapon-identity.test.mjs tests/arsenal-v2-campaign-adapter.test.mjs tests/dispatch-d13-department-procurement.test.mjs tests/operations-landing-navigation.test.mjs tests/weapon-arsenal-r4.test.mjs tests/weapon-ar-r44-silhouettes.test.mjs tests/weapon-ar-r45-silhouettes.test.mjs tests/equipment-06-presets.test.mjs tests/performance-p3-async-thumbnails.test.mjs tests/campaign-08.test.mjs tests/campaign-11.test.mjs tests/equipment-02-loadouts.test.mjs tests/campaign-pre-go-inventory.test.mjs tests/equipment-27-01-campaign-ownership.test.mjs tests/dispatch-d13c-procurement-policy-truth.test.mjs tests/dispatch-d13d-creation-armory-preview.test.mjs tests/equipment-19-04-weapon-persistence.test.mjs tests/equipment-19-08-campaign-attachment-stock.test.mjs tests/outfitter-choice-sources.test.mjs tests/loadout-quickplay-carry-selector.test.mjs tests/consolidation-4-to-7-integration.test.mjs tests/faction-reference-loadout-ft1-3.test.mjs tests/g36-reference-campaign-integration.test.mjs tests/dispatch-d3-1-starter-policy.test.mjs tests/weapon-workbench-mobile-sockets.test.mjs tests/arsenal-v2-quickplay-adapter.test.mjs tests/arsenal-r9-load-ui.test.mjs tests/arsenal-r13-model-picker.test.mjs tests/arsenal-r14-apply-guidance.test.mjs tests/dispatch-d12-campaigns.test.mjs tests/equipment-15-persistent-magazines.test.mjs
      - name: Retained authored artwork parity
        run: |
          git worktree add --detach /tmp/pre-retirement bbf4c427574efbde20cee8bddf284c3ce1b0874b
          ln -s "$PWD/node_modules" /tmp/pre-retirement/node_modules
          cp scripts/audit-wa4-art-delta.mjs /tmp/pre-retirement/scripts/
          node --experimental-strip-types scripts/audit-wa4-art-delta.mjs reports/retirement/after.json
          (cd /tmp/pre-retirement && node --experimental-strip-types scripts/audit-wa4-art-delta.mjs "$GITHUB_WORKSPACE/reports/retirement/before.json")
          node scripts/verify-catalog-retirement.mjs reports/retirement/before.json reports/retirement/after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-retirement-evidence
          path: reports/retirement/
