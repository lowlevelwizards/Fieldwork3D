name: WA6 AR artwork overhaul
on:
  push:
    branches: [feature/wa0-wa2-weapon-art-foundation]
    paths:
      - 'src/weapons/geometry/ar-handguard-profiles.ts'
      - 'src/weapons/geometry/ar-silhouettes.ts'
      - 'src/weapons/geometry/ar-rail-profiles.ts'
      - 'scripts/*wa6*'
      - 'tests/weapon-ar-*.test.mjs'
      - '.github/workflows/wa6-ar-art-overhaul.yml'
  workflow_dispatch:
concurrency:
  group: wa6-ar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/weapon-ar-r46-silhouettes.test.mjs tests/weapon-ar-r47-silhouettes.test.mjs tests/weapon-ar-r48-silhouettes.test.mjs tests/weapon-ar-a1-face-vents.test.mjs tests/arsenal-a2-material-unification.test.mjs tests/wa0-weapon-art-geometry.test.mjs
      - name: Verify scoped art delta and real emitted-cost reduction against WA5
        run: |
          mkdir -p reports/wa6
          git worktree add --detach /tmp/wa5-art e21737f9b3ef557ee97a7050aa7fb7ca648e57b0
          ln -s "$PWD/node_modules" /tmp/wa5-art/node_modules
          cp scripts/audit-wa6-art-delta.mjs scripts/capture-weapon-art-baseline.mjs scripts/capture-wa0-operator-context.mjs /tmp/wa5-art/scripts/
          node --experimental-strip-types scripts/audit-wa6-art-delta.mjs reports/wa6/candidate.json
          (cd /tmp/wa5-art && node --experimental-strip-types scripts/audit-wa6-art-delta.mjs "$GITHUB_WORKSPACE/reports/wa6/baseline.json")
          node scripts/verify-wa6-art-delta.mjs reports/wa6/baseline.json reports/wa6/candidate.json reports/wa6/delta.json
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render pinned before and actual candidate
        env:
          WA0_PLATFORMS: ar15,custom-ar15,accessory-samples
          WA0_OPERATOR_IDS: ar-m16a1,ar-m16a2,ar-m16a4,ar-c7a2-proxy,ar-mk12mod0,ar-car15,ar-colt733,ar-m4a1,ar-mk18
        run: |
          WA0_OUTPUT="$PWD/reports/wa6/after" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs
          WA0_OPERATOR_OUTPUT="$PWD/reports/wa6/after/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs
          (cd /tmp/wa5-art && WA0_OUTPUT="$GITHUB_WORKSPACE/reports/wa6/before" node --experimental-strip-types scripts/capture-weapon-art-baseline.mjs)
          (cd /tmp/wa5-art && WA0_OPERATOR_OUTPUT="$GITHUB_WORKSPACE/reports/wa6/before/operator-context" node --experimental-strip-types scripts/capture-wa0-operator-context.mjs)
          node scripts/verify-wa6-capture-pairs.mjs reports/wa6/before reports/wa6/after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa6-ar-evidence
          path: reports/wa6/
          if-no-files-found: ignore
