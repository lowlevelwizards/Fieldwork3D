name: Operator Studio — Critical Mobile Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  studio-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm ci --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps chromium
      - run: node scripts/smoke-operator-studio.mjs
      - name: R5 UV1 self-shadow atlas — actual mobile WebGL proof
        if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'feature/operator-lighting-r5-')) }}
        run: node scripts/smoke-operator-lightmap-r5.mjs
      - name: PASGT P5 actual WebGL material / fit captures
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/pasgt-p5-')) }}
        run: node scripts/pasgt-p5-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-studio-portrait
          path: operator-studio-captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/pasgt-p5-'))) }}
        with:
          name: pasgt-p5-visual-proof
          path: pasgt-p5-captures/
          if-no-files-found: ignore
