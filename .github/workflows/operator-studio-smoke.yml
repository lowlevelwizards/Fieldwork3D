name: Operator Studio — Critical Mobile Smoke
on:
  pull_request:
    paths:
      - 'operator-studio.html'
      - 'src/operator-studio.ts'
      - 'src/operator-studio.css'
      - 'src/operator-appearance-grid.ts'
      - 'src/operator-garment-color-policy.ts'
      - 'src/operator-pasgt-drape-geometry.ts'
      - 'src/operator-pasgt-cover-texture.ts'
      - 'src/operator-pasgt-cover-visuals.ts'
      - 'src/operator-pasgt-field-dress.ts'
      - 'src/operator-pasgt-cover-policy.ts'
      - 'src/operator-headwear-silhouettes.ts'
      - 'scripts/smoke-operator-studio.mjs'
      - '.github/workflows/operator-studio-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-operator-studio.mjs
      - name: R5 UV1 self-shadow atlas — actual mobile WebGL proof
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/operator-lighting-r5-') }}
        run: node scripts/smoke-operator-lightmap-r5.mjs
      - name: PASGT P5/P6 actual WebGL material / fit captures
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/pasgt-p5-') || startsWith(github.head_ref, 'feature/pasgt-p6-')) }}
        run: node scripts/pasgt-p5-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-studio-portrait
          path: operator-studio-captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/pasgt-p5-') || startsWith(github.head_ref, 'feature/pasgt-p6-')) }}
        with:
          name: pasgt-actual-mobile-visual-proof
          path: pasgt-p5-captures/
          if-no-files-found: ignore
