name: Operator Studio — Critical Mobile Smoke
on:
  pull_request:
    paths:
      - 'operator-studio.html'
      - 'src/operator-studio.ts'
      - 'src/operator-studio-graphic-lighting.ts'
      - 'src/operator-wardrobe-head-visuals.ts'
      - 'src/operator-wardrobe-gear-visuals.ts'
      - 'src/operator-visual-kit.ts'
      - 'scripts/smoke-operator-r715-bleed.mjs'
      - 'src/operator-studio-light-lab.ts'
      - 'src/arsenal/viewport.ts'
      - 'src/arsenal/lighting-lab.ts'
      - 'src/arsenal/workbench-screen.ts'
      - 'scripts/smoke-arsenal-lighting-r714.mjs'
      - 'src/operator-studio-toon-lighting.ts'
      - 'src/operator-visual-kit.ts'
      - 'scripts/smoke-operator-r7-shader.mjs'
      - 'src/operator-studio.css'
      - 'src/operator-appearance-grid.ts'
      - 'src/operator-garment-color-policy.ts'
      - 'src/operator-pasgt-drape-geometry.ts'
      - 'src/operator-pasgt-cover-texture.ts'
      - 'src/operator-pasgt-cover-visuals.ts'
      - 'src/operator-pasgt-field-dress.ts'
      - 'src/operator-pasgt-cover-policy.ts'
      - 'src/operator-headwear-silhouettes.ts'
      - 'scripts/smoke-operator-studio.mjs'
      - '.github/workflows/operator-studio-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-operator-studio.mjs
      - name: R5 UV1 self-shadow atlas — actual mobile WebGL proof
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/operator-lighting-r5-') }}
        run: node scripts/smoke-operator-lightmap-r5.mjs
      - name: Rendering R7 — opt-in cel, pose cavity and pixel rim WebGL smoke
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/r7-stylized-') || startsWith(github.head_ref, 'feature/r79-') || startsWith(github.head_ref, 'feature/r710-') || startsWith(github.head_ref, 'feature/r711-') || startsWith(github.head_ref, 'feature/r712-')) }}
        run: node scripts/smoke-operator-r7-shader.mjs
      - name: Rendering R7.13 — white rim real WebGL mobile comparison
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/r713-') || startsWith(github.head_ref, 'feature/lighting-r714-')) }}
        run: node scripts/smoke-operator-r713-rim.mjs
      - name: Rendering R7.16 — surface-bound gear/skin bands and Arsenal real WebGL
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/r716-surface-bound-') }}
        run: |
          node scripts/smoke-operator-r715-bleed.mjs
          node scripts/smoke-arsenal-lighting-r714.mjs
      - name: Rendering R7.15 — backlit gear/skin 3D silhouette and Arsenal mobile smoke
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/lighting-r715-') }}
        run: |
          node scripts/smoke-operator-r715-bleed.mjs
          node scripts/smoke-arsenal-lighting-r714.mjs
      - name: Rendering R7.14 — actual Arsenal weapon 3D shader mobile smoke
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/lighting-r714-') }}
        run: node scripts/smoke-arsenal-lighting-r714.mjs
      - name: PASGT P5/P6/P7 actual WebGL material / fit captures
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/pasgt-p5-') || startsWith(github.head_ref, 'feature/pasgt-p6-') || startsWith(github.head_ref, 'feature/pasgt-p7-')) }}
        run: node scripts/pasgt-p5-visual-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-studio-portrait
          path: operator-studio-captures/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/pasgt-p5-') || startsWith(github.head_ref, 'feature/pasgt-p6-') || startsWith(github.head_ref, 'feature/pasgt-p7-')) }}
        with:
          name: pasgt-actual-mobile-visual-proof
          path: pasgt-p5-captures/
          if-no-files-found: ignore
