name: Breach Pose V3 — Focused Mobile Visuals
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pose-v3-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: /tmp/fieldwork-browsers
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install only required dependencies
        run: |
          npm ci --no-audit --no-fund
      - run: npm exec -- playwright install --with-deps chromium
      - name: Eight-kit static mobile pose fit gate
        run: POSE_V3=1 node scripts/capture-breach-pose-fit.mjs
      - name: ADS and reload action-time dynamic pose evidence
        run: node scripts/capture-breach-pose-v3-dynamic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breach-pose-v3-static-and-dynamic-phone
          path: |
            breach-pose-fit-captures/
            breach-pose-v3-dynamic-captures/
          if-no-files-found: warn
