name: VEH vehicle geometry and contracts
on:
  pull_request:
    paths:
      - 'src/worldgen/vehicle-*.ts'
      - 'tests/veh-*.test.mjs'
      - '.github/workflows/veh-vehicle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vehicle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/veh-vehicle-model.test.mjs tests/map-17-vehicles.test.mjs tests/map-24-vehicle-identity.test.mjs
      - run: npm run check
