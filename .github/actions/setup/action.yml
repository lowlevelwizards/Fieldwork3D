name: Fieldwork toolchain
description: Install the repository-pinned Node and npm versions
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm
    - name: Pin npm
      shell: bash
      run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
    - name: Verify toolchain
      shell: bash
      run: node scripts/verification/toolchain.mjs
