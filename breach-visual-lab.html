<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Fieldwork / Effects Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e2e8df;background:#182a2a}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow:hidden}
.lab{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;z-index:5;display:grid;gap:6px;pointer-events:none}
.lab>*{pointer-events:auto}header,.controls,footer{background:#172825ed;border:1px solid #768b7e;border-radius:6px;padding:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
header strong{font-size:13px;letter-spacing:.08em}header small{display:block;color:#aabdac;font-size:10px}
a{color:#e0e9db;font-size:12px}button,select{font:inherit;font-size:11px;min-height:34px;padding:6px 8px;color:#e6ead8;background:#28433d;border:1px solid #82978a;border-radius:4px;touch-action:manipulation}
button:active{background:#c5b888;color:#131f1c}.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
footer{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;z-index:5;font-size:11px;pointer-events:none}#metrics{color:#b5c5b7;font-size:10px;margin-top:4px}
@media(min-width:800px){.lab{max-width:680px}footer{max-width:680px}}
</style></head><body>
<div class="lab">
<header><div><strong>FIELDWORK / EFFECTS LAB</strong><small>Production renderer · controlled presentation samples</small></div><a href="./index.html">RETURN</a></header>
<div class="controls" aria-label="Effect samples">
<button id="hit">BLOOD HIT</button><button id="down">DOWN</button><button id="pool">POOL</button><button id="stabilize">STABILIZE</button>
<button id="stone">MASONRY</button><button id="wood">WOOD</button><button id="metal">METAL</button><button id="dust">DUST</button>
<button id="glass">GLASS</button><button id="flash">FLASHBANG</button><button id="muzzle">MUZZLE</button><button id="vegetation">VEGETATION</button><button id="miss">MISS</button>
</div><div class="controls" aria-label="Playback and camera">
<button id="repeat">REPEAT</button><button id="pause">PAUSE</button><button id="step">STEP</button><select id="speed" aria-label="Playback speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option></select><button id="reset">RESET</button>
<button id="iso">ISO</button><button id="top">TOP</button><button id="gameZoom">GAME ZOOM</button><button id="closeZoom">CLOSE</button>
</div></div>
<footer><div id="status">Loading effects…</div><div id="metrics"></div></footer>
<!-- FIELDWORK / VISUAL LAB: retained historical standalone entry -->
<script type="module" src="/src/breach-visual-lab.ts"></script>
</body></html>
