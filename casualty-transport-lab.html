<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FIELDWORK — CASUALTY TRANSPORT LAB</title><link rel="stylesheet" href="./src/ui/fieldwork-design.css"><style>
*{box-sizing:border-box}body{margin:0;background:#182824;color:#ecede1;font:13px system-ui,sans-serif}header,main{padding:12px;max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#dfc799}main{display:grid;gap:12px}section{background:#263a34;border:1px solid #678777;border-radius:8px;padding:12px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}label{display:grid;gap:5px;font-size:11px;font-weight:700}button,select{min-height:44px;border:1px solid #92a48a;border-radius:5px;background:#39554a;color:#f6efe2;font:inherit;padding:8px}button{cursor:pointer}input[type=range]{width:100%;min-height:36px;accent-color:#d9b77d}#stage{height:clamp(240px,50vh,520px);width:100%;touch-action:none;overflow:hidden}canvas{display:block;width:100%;height:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}pre{white-space:pre-wrap;font:12px/1.5 monospace;margin:0}p{color:#ced8cf;line-height:1.4;margin:8px 0 0}</style></head><body>
<header><strong>FIELDWORK / CASUALTY TRANSPORT LAB</strong><nav><a href="./operator-lab.html">OPERATOR LAB</a> · <a href="./index.html">BACK TO GAME</a></nav></header>
<main><section><div class="controls">
<label>TRANSPORT<select id="mode"><option value="drag">Drag</option><option value="carry">Carry</option></select></label>
<label>SCENARIO<select id="scenario"><option value="straight">Straight route</option><option value="idle">Stationary</option><option value="corner">90° corner</option><option value="doorway">Doorway gap</option></select></label>
<label>CASUALTY<select id="subject"><option value="blue">Friendly</option><option value="red">Suspect</option><option value="civilian">Civilian</option></select></label>
<label>PRIMARY SUPPORT<select id="sling"><option value="sling-two-point">Two-point</option><option value="sling-single-point">Single-point</option><option value="sling-traditional">Traditional</option><option value="sling-none">Grounded</option></select></label>
<label>VIEW<select id="view"><option value="three">Three-quarter</option><option value="side">Side</option><option value="top">Top</option></select></label>
</div><div class="row"><button id="play">PLAY</button><button id="step">+1 FRAME</button><button id="reset">RESET</button><button id="pickup">PICKUP</button><button id="loaded">LOADED</button><button id="release">RELEASE</button><label><input id="contacts" type="checkbox" checked> CONTACTS</label></div>
<label>TIMELINE<input id="time" type="range" min="0" max="600" value="0" step="1"></label><p>Isolated animation and pair-movement audition. Gold markers are intended anatomical contacts; lines show actual wrist error. Static obstacle probes are not full tactical door/AI validation.</p></section>
<section id="stage" aria-label="3D casualty transport preview"></section><section><pre id="detail"></pre></section></main>
<script type="module" src="./src/casualty-transport-lab-main.ts"></script></body></html>
