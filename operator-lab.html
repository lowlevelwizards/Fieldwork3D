<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#242c2b"/><title>FIELDWORK — OPERATOR LAB</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#c4c5bd;color:#e8e6da;font:12px monospace;overflow:hidden;touch-action:none}
#preview{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:env(safe-area-inset-top);left:0;right:0;z-index:2;background:#202c2be8;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
header a{color:#c8b992}main{position:fixed;bottom:env(safe-area-inset-bottom);left:0;right:0;z-index:3;padding:8px;background:#202c2bf0;display:grid;gap:8px;max-height:48dvh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}label{min-width:55px;color:#b9c5bd}button,select{background:#4a5b52;color:#fff1d8;border:1px solid #728177;padding:8px 11px;font:11px monospace;border-radius:3px;min-height:35px;touch-action:manipulation}button[aria-pressed=true]{background:#c8ac72;color:#1a2522}select{min-width:120px}small{opacity:.85}
#timeline{flex:1;min-width:120px;accent-color:#c8ac72;touch-action:pan-x}
#diagnosticText{position:fixed;top:50px;left:8px;z-index:2;
  padding:8px;white-space:pre-line;pointer-events:none;
  background:#16231fdd;color:#e8e6da;max-width:260px;font:11px monospace}
#diagnosticText:empty{display:none}
#labStatus{position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 54px);
  left:50%;transform:translateX(-50%);width:min(360px,calc(100% - 28px));
  background:#23312feb;color:#f1f0e5;border:1px solid #728177;
  padding:12px 14px;border-radius:5px;box-shadow:0 3px 14px #0005}
#labStatus[hidden]{display:none}
#labStatus strong{display:block;font-size:13px;margin-bottom:5px}
#labStatus p{font-size:11px;line-height:1.5;margin:5px 0 9px}
#labStatus a{color:#ffe1a2;margin-right:12px}
@media(max-height:540px){main{grid-template-columns:1fr 1fr;max-height:54dvh}
.row{gap:3px}button{min-height:28px;padding:4px}
#diagnosticText{top:38px;font-size:9px;max-width:180px}}
@media(max-width:440px){main{gap:5px}.row{gap:4px}
button,select{padding:6px 8px;font-size:10px;min-height:31px}}
</style></head>
<body><canvas id="preview"></canvas>
<aside id="labStatus" role="status" aria-live="polite">
  <strong id="labStatusTitle">INITIALIZING OPERATOR LAB</strong>
  <p id="labStatusMessage">Loading the 3D operator preview…</p>
  <a href="./operator-lab.html?retry=1">RETRY LAB</a>
  <a href="./index.html">BACK TO BATTLE</a>
</aside>
<header><strong>FIELDWORK / OPERATOR LAB <small>Build 122</small></strong><a href="./index.html">← BATTLE</a></header>
<output id="diagnosticText" aria-live="off"></output>
<main>
<div class="row"><label>MODEL</label><select id="operator"><option value="rook">ROOK</option><option value="moss">MOSS</option><option value="ash">ASH</option><option value="vale">VALE</option><option value="hostile">HOSTILE</option></select>
<select id="weapon"><option value="carbine">CARBINE</option><option value="smg">SMG</option><option value="rifle">RIFLE</option><option value="shotgun">SHOTGUN</option></select>

<div class="row"><label>MOTION</label>
<button data-pose="idle">IDLE</button><button data-pose="walk">WALK</button>
<button data-pose="accelerate">ACCEL</button><button data-pose="stop">STOP</button>
<button data-pose="restart">RESTART</button><button data-pose="back">BACK</button>
<button data-pose="strafe-left">STRAFE L</button><button data-pose="strafe-right">STRAFE R</button>
<button data-pose="strafe">STRAFE</button>
<button data-pose="strafe-stop">STRAFE → STOP</button>
<button data-pose="strafe-reverse">STRAFE ↔ REVERSE</button>
<button data-pose="mixed">MIXED MOVEMENT</button>
<button data-pose="turn-90">90° TURN</button>
<button data-pose="turn-180">180° TURN</button><button data-pose="turn">TURN</button>
<button data-pose="pivot-reverse">PIVOT ↔ REVERSE</button>
<button data-pose="pie">PIE</button><button data-pose="look">MOVE + LOOK</button>
<button data-pose="crouch-walk">CROUCH WALK</button><button data-pose="crouch">CROUCH</button>
<button data-pose="wounded">WOUNDED</button><button data-pose="aim">ADS</button></div>
<div class="row"><label>READY</label>
<button data-pose="high-ready">HIGH READY</button>
<button data-pose="low-ready">LOW READY</button>
<button data-pose="ready">READY</button>
<button data-pose="short-stock">SHORT STOCK</button>
<button data-pose="active-aim">ACTIVE AIM / ADS</button>
<button data-pose="point-shoot">POINT SHOOT</button>
<button data-pose="ready-to-ads">READY → ADS</button>
<button data-pose="ads-to-low">ADS → LOW</button></div>
<div class="row"><label>ACTIONS</label>
<button data-pose="reload">RELOAD</button>
<button data-pose="reload-emergency">EMPTY RELOAD</button>
<button data-pose="reload-retention">RETENTION</button>
<button data-pose="reload-shotgun">SHELL LOAD</button>
<button data-pose="reload-interrupt">INTERRUPT</button>
<button data-pose="reload-wounded">WOUNDED RELOAD</button><button data-pose="flash">FLASH</button>
<button data-pose="door">DOOR</button>
<button data-pose="kick">KICK</button>
<button data-pose="bash">SHOVE</button><button data-pose="down">DOWN</button>
<button data-pose="down-forward">FALL FWD</button>
<button data-pose="down-back">FALL BACK</button>
<button data-pose="down-left">FALL LEFT</button>
<button data-pose="down-right">FALL RIGHT</button>
<button data-pose="down-slump">SUPPORTED SLUMP</button></div>
<div class="row"><label>PLAYBACK</label>
<button id="playPause">PAUSE</button><button id="stepFrame">+1 FRAME</button>
<button id="restartTrack">RESTART</button>
<button id="loopTrack" aria-pressed="true">LOOP</button>
<input type="range" id="timeline" min="0" max="4000" step="1" value="0"
 aria-label="Motion timestamp"/><output id="timestamp">0.00s</output></div>
<div class="row"><label>VIEW</label><button data-view="iso">ISO</button><button data-view="front">FRONT</button><button data-view="side">SIDE</button><button data-view="top">TOP</button><button id="resetCamera">FIT</button><button id="diagnostics" aria-pressed="false">JOINTS</button><button id="slowMotion" aria-pressed="false">SLOW</button>
<select id="diagnosticLayer" aria-label="Diagnostic layer">
<option value="off">DIAG: OFF</option>
<option value="anchors">FOOT ANCHORS</option>
<option value="lanes">FOOT LANES</option><option value="balance">BODY BALANCE</option><option value="targets">STEP TARGETS</option>
<option value="support">SUPPORT REGION</option><option value="polygon">SUPPORT POLYGON</option>
<option value="planes">KNEE/ELBOW PLANES</option><option value="limits">JOINT LIMITS</option>
<option value="weapon">WEAPON CONTACTS</option><option value="replay">REPLAY SAMPLES</option>
</select><small>Drag orbit · Pinch zoom · Two fingers pan</small></div>
</main>
<script>
// Keep failures visible even if the ES module never evaluates or WebGL
// throws before the Lab's own render-loop error handling is installed.
(function(){
  const status=document.getElementById('labStatus');
  const title=document.getElementById('labStatusTitle');
  const message=document.getElementById('labStatusMessage');
  window.__labStatus={
    ready(){
      if(status)status.hidden=true;
      document.getElementById('preview')?.setAttribute('data-ready','true');
    },
    fail(error){
      if(title)title.textContent='OPERATOR LAB COULD NOT START';
      if(message)message.textContent=String(error||'3D preview unavailable');
      if(status)status.hidden=false;
      document.getElementById('preview')?.setAttribute('data-ready','error');
    }
  };
  window.addEventListener('error',e=>{
    window.__labStatus.fail(e.message||'Script failed to load');
  });
  window.addEventListener('unhandledrejection',e=>{
    window.__labStatus.fail(e.reason?.message||e.reason||'Unexpected loading error');
  });
  document.getElementById('preview').addEventListener('webglcontextlost',e=>{
    e.preventDefault();
    window.__labStatus.fail('3D graphics context was lost. Try reloading the Lab.');
  });
})();
</script>
<script type="module" src="./src/breach-operator-lab.ts"></script></body></html>
